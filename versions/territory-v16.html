  men = men || (owner === 0 ? 500 : Math.min(CFG.enemySpawnCap, Math.round(CFG.enemySpawnBase * zoneMul())));
  const mine = atCap ? [atCap] : G.caps.filter(function (c) { return c.owner === owner; });
  if (!mine.length) return null;
  const cap = mine[(Math.random() * mine.length) | 0];
  const list = armyOf(owner).filter(function (a) { return !a.garrison; });
  if (owner === 0 && list.length >= armyCapOf()) {
    list.sort(function (p, q) { return p.men - q.men; });
    list[0].men += men;
    if (owner === 0) toast('兵團已達上限　·　' + men + ' 人併入既有兵團');
    return list[0];
  }
  /* paid = 人口已經由呼叫端扣掉（緊急征召令），不要重複扣 */
  if (!paid) cap.pop = Math.max(60, (cap.pop || 0) - men);
  const a = addArmy(owner, cap.x, cap.y, men, cap, cap.zone);
  for (let k = 0; k < 16; k++) spawnPart(cap.x, cap.y, '#ffe08a', 0.9, 0.75);
  if (owner === 0) {
    toast('新兵團成軍　·　' + men + ' 人　·　共 ' + armyOf(0).length + ' 支');
    if (!G.player.sel) G.player.sel = a;
    blip(640, 0.16, 0.05, 'triangle');
  }
  return a;
}

function updatePop(dt) {
  G.popT += dt;
  if (G.popT < 30) return;
  G.popT -= 30;
  for (const cap of G.caps) {
    const g = BIOMES[cap.biome || 0].grow;
    const max = Math.max(20000, (cap.district ? cap.district.size : 60) * 300);
    cap.pop = Math.min(max, (cap.pop || 0) * (1 + 0.14 * g) + 4);
  }
  /* v10：這裡每 30 秒結算一次；攻下主城的當下也會另外結算（見 captureDistrict） */
  convertPlayerPop();
  // 敵國也會從自己的人口成軍，才不會打完一輪就沒兵
  for (const r of G.rivals) {
    if (r.dead) continue;
    let p = 0;
    for (const c of G.caps) if (c.owner === r.owner) p += c.pop || 0;
    let paid = G.popPaidBy[r.owner] || 0;
    while (p - paid >= 10000) {
      paid += 10000;
      if (armyOf(r.owner).length < 24) spawnArmy(r.owner);   // v16：敵國不受玩家兵團上限限制
    }
    G.popPaidBy[r.owner] = paid;
  }
}

function ownGround(b, u) {
  const cx = Math.floor(u.x), cy = Math.floor(u.y);
  if (b.owner[cy * b.w + cx] === u.owner) return true;
  if (cx > 0 && b.owner[cy * b.w + cx - 1] === u.owner) return true;
  if (cx < b.w - 1 && b.owner[cy * b.w + cx + 1] === u.owner) return true;
  if (cy > 0 && b.owner[(cy - 1) * b.w + cx] === u.owner) return true;
  if (cy < b.h - 1 && b.owner[(cy + 1) * b.w + cx] === u.owner) return true;
  return false;
}

/* ═══════════════════════════ AI ═══════════════════════════ */
const _from = new Int32Array(WORLD_W * WORLD_H);
const _seen = new Uint8Array(WORLD_W * WORLD_H);
const _queue = new Int32Array(WORLD_W * WORLD_H);

class Brain {
  constructor(unit) {
    this.u = unit;
    this.t = 0;
    this.tx = unit.x;
    this.ty = unit.y;
    this.has = false;
    this.cap = null;        // 正在圍的城
    this.stuck = 0;
    this.lastX = unit.x;
    this.lastY = unit.y;
  }

  update(dt, b) {
    const u = this.u;
    if (!u.alive || u.stunned) return;

    /* 已經站在別人的主城上 → 站著不動就是圍城，別再抽新目標 */
    if (this.cap && this.cap.owner !== u.owner) {
      const dc = Math.hypot(this.cap.x - u.x, this.cap.y - u.y);
      if (dc < 0.85) { this.has = false; this.t = 0.2; return; }
    }

    this.t -= dt;
    if (this.t <= 0) {
      this.pick(b);
      this.t = 0.34 + Math.random() * 0.24;
    }

    if (!this.has) return;
    const dx = this.tx - u.x, dy = this.ty - u.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.5) {
      moveUnit(b, u, dx, dy, dt);
      /* 卡住偵測：兩秒內幾乎沒位移就換目標 */
      if (Math.hypot(u.x - this.lastX, u.y - this.lastY) < 0.02) {
        this.stuck += dt;
        if (this.stuck > 1.2) { this.stuck = 0; this.has = false; this.t = 0; this.cap = null; }
      } else { this.stuck = 0; }
    } else {
      this.t = Math.min(this.t, 0.1);
    }
    this.lastX = u.x; this.lastY = u.y;
  }

  /* 重新挑目標：中立地 / 玩家地 / 別人的地 / 別人的主城 */
  pick(b) {
    const u = this.u;
    const cx = Math.floor(u.x), cy = Math.floor(u.y);
    const mine = b.cnt[u.owner + 1];
    const hungry = mine < 26;
    const aggro = (u.owner !== 0) ? (AGGRO[G.aggression] || 0.8) : 1;
    const warm = G.t < CFG.warmup ? 0.2 : 1;
    const R = hungry ? 40 : 30;

    let best = -1, bestScore = 0, bestCap = null;

    /* 主城優先：強攻時會專程去拆玩家的城 */
    for (const cap of G.caps) {
      if (cap.owner === u.owner) continue;
      if (cap.owner === 0 && aggro < 1.4) continue;   // 只有「強」才會打玩家的城
      const d = Math.abs(cap.x - u.x) + Math.abs(cap.y - u.y);
      if (d > 46) continue;
      let v = cap.owner === 0 ? aggro * 2.9 * warm : 1.55;
      if (hungry) v *= 0.55;
      const sc = v / (1 + d * 0.028) * (0.9 + Math.random() * 0.2);
      if (sc > bestScore) { bestScore = sc; best = cap.i; bestCap = cap; }
    }

    for (let y = Math.max(0, cy - R); y <= Math.min(b.h - 1, cy + R); y++) {
      for (let x = Math.max(0, cx - R); x <= Math.min(b.w - 1, cx + R); x++) {
        const i = y * b.w + x;
        if (!b.terrain[i]) continue;
        const o = b.owner[i];
        if (o === u.owner) continue;
        const d = Math.abs(x - cx) + Math.abs(y - cy);
        let v;
        if (o === NEUTRAL) v = 1.0;
        else if (o === 0) v = aggro * warm * (hungry ? 0.5 : 1.0);
        else v = 2.05 * (hungry ? 0.6 : 1.0);          // 對其他 AI 永遠強
        /* 距離衰減故意放很慢：遠一點的地也吃，AI 才不會只在自己腳邊打轉 */
        const sc = v / (1 + d * 0.014) * (0.78 + Math.random() * 0.44);
        if (sc > bestScore) { bestScore = sc; best = i; bestCap = null; }
      }
    }

    this.cap = bestCap;
    if (best < 0) {
      /* 周圍真的沒東西可吃（整個區塊都是自己的）→ 往最近的未佔格走 */
      let far = -1, farD = 1e9;
      for (let k = 0; k < b.n; k++) {
        if (!b.terrain[k] || b.owner[k] === u.owner) continue;
        const d = Math.abs(k % b.w - cx) + Math.abs(((k / b.w) | 0) - cy);
        if (d < farD) { farD = d; far = k; }
      }
      if (far < 0) { this.has = false; return; }
      best = far;
    }

    const step = this.pathTo(b, cx, cy, best);
    if (step < 0) {
      /* 走不到 → 先往目標方向硬走一小段，不要罰站 */
      const tx = (best % b.w) + 0.5, ty = ((best / b.w) | 0) + 0.5;
      this.tx = tx; this.ty = ty; this.has = true;
      return;
    }
    this.tx = (step % b.w) + 0.5;
    this.ty = ((step / b.w) | 0) + 0.5;
    this.has = true;
  }

  pathTo(b, cx, cy, target) {
    const w = b.w;
    const start = cy * w + cx;
    if (start === target) return -1;
    const seen = _seen, q = _queue, from = _from;
    let qh = 0, qt = 0;
    q[qt++] = start; seen[start] = 1; from[start] = -1;
    let found = -1;
    while (qh < qt && qt < 5200) {
      const i = q[qh++];
      if (i === target) { found = i; break; }
      const x = i % w, y = (i / w) | 0;
      if (x > 0)     { const j = i - 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (x < b.w - 1) { const j = i + 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y > 0)     { const j = i - w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y < b.h - 1) { const j = i + w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
    }
    if (found < 0) {
      for (let k = 0; k < qt; k++) seen[q[k]] = 0;
      return -1;
    }
    let cur = found;
    while (from[cur] !== start && from[cur] >= 0) cur = from[cur];
    for (let k = 0; k < qt; k++) seen[q[k]] = 0;
    return cur;
  }
}

/* ═══════════════════════════ 粒子／音效 ═══════════════════════════ */
function spawnPart(x, y, c, sp, life) {
  if (G.parts.length > 420) return;
  const a = Math.random() * TAU;
  G.parts.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life, max: life, c, r: 0.1 + Math.random() * 0.1
  });
}
function spawnBurst(x, y, c) {
  for (let k = 0; k < 5; k++) spawnPart(x, y, c, 0.5 + Math.random() * 0.7, 0.28 + Math.random() * 0.3);
}

let actx = null, muted = false, lastFlip = 0;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  return actx;
}
function blip(freq, dur, gain, type) {
  const a = audio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(gain, a.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function sfxFlip() {
  if (muted) return;
  const now = performance.now();
  if (now - lastFlip < 70) return;
  lastFlip = now;
  blip(420 + Math.random() * 120, 0.05, 0.018, 'triangle');
}

/* ═══════════════════════════ 地區 ═══════════════════════════ */
/* 把一塊區塊的陸地切成 4~6 個「地區」：最遠點取樣挑種子，再多源 BFS 分地，
   所以每個地區一定是連通的一整片（不會東一塊西一塊）。 */
function buildDistricts(z, t) {
  const w = ZW, h = ZH;
  const land = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (t[y * w + x]) land.push(y * w + x);
  z.districts = [];
  z.borders = null;
  if (!land.length) return;
  const rnd = mulberry32((z.seed ^ 0x2f9e71) >>> 0);
  let k = 4 + ((rnd() * 3) | 0);                       // 4、5、6
  k = Math.max(2, Math.min(k, Math.floor(land.length / 18)));

  /* 1. 最遠點取樣：種子盡量散開，但保留一點隨機 */
  const seeds = [land[(rnd() * land.length) | 0]];
  const tmp = new Float32Array(land.length);
  while (seeds.length < k) {
    let bestD = -1;
    for (let n = 0; n < land.length; n++) {
      const c = land[n];
      let md = 1e9;
      for (let si = 0; si < seeds.length; si++) {
        const sc = seeds[si];
        const dx = (c % w) - (sc % w), dy = ((c / w) | 0) - ((sc / w) | 0);
        const dd = dx * dx + dy * dy;
        if (dd < md) md = dd;
      }
      tmp[n] = md;
      if (md > bestD) bestD = md;
    }
    const pool = [];
    for (let n = 0; n < land.length; n++) if (tmp[n] > bestD * 0.5) pool.push(land[n]);
    seeds.push(pool.length ? pool[(rnd() * pool.length) | 0] : land[(rnd() * land.length) | 0]);
  }

  /* 2. 多源 BFS：每格歸給最快走到的種子 → 每區必連通 */
  const lab = new Int8Array(w * h).fill(-1);
  const q = new Int32Array(w * h);
  let qh = 0, qt = 0;
  for (let si = 0; si < seeds.length; si++) {
    const c = seeds[si];
    if (lab[c] >= 0) continue;
    lab[c] = si; q[qt++] = c;
  }
  while (qh < qt) {
    const c = q[qh++], x = c % w, y = (c / w) | 0;
    if (x > 0)     { const n = c - 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (x < w - 1) { const n = c + 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y > 0)     { const n = c - w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y < h - 1) { const n = c + w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
  }
  for (const c of land) if (lab[c] < 0) {
    const x = c % w, y = (c / w) | 0;
    const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
    for (const n of nb) if (n >= 0 && lab[n] >= 0) { lab[c] = lab[n]; break; }
  }

  /* 3. 太小的地區併進鄰居 */
  const minCells = Math.max(9, Math.floor(land.length * 0.085));
  for (let guard = 0; guard < 14; guard++) {
    const sizes = new Int32Array(seeds.length);
    for (const c of land) if (lab[c] >= 0) sizes[lab[c]]++;
    let small = -1;
    for (let i = 0; i < sizes.length; i++) if (sizes[i] > 0 && sizes[i] < minCells) { small = i; break; }
    if (small < 0) break;
    const touch = new Int32Array(seeds.length);
    for (const c of land) {
      if (lab[c] !== small) continue;
      const x = c % w, y = (c / w) | 0;
      const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
      for (const n of nb) if (n >= 0 && lab[n] >= 0 && lab[n] !== small) touch[lab[n]]++;
    }
    let to = -1, best = -1;
    for (let i = 0; i < touch.length; i++) if (touch[i] > best) { best = touch[i]; to = i; }
    if (to < 0) break;
    for (const c of land) if (lab[c] === small) lab[c] = to;
  }

  /* 4. 建立地區物件 + 主城 */
  const groups = new Map();
  for (const c of land) {
    const l = lab[c];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(c);
  }
  let id = 0;
  for (const arr0 of groups.values()) {
    /* 這裡的索引是「區塊內座標」，換算成世界座標才拿去塗 */
    const arr = new Int32Array(arr0.length);
    for (let n = 0; n < arr0.length; n++) {
      const lc = arr0[n];
      arr[n] = (z.y0 + ((lc / w) | 0)) * WORLD_W + (z.x0 + (lc % w));
    }
    /* 主城位置要用「區塊內座標」算，arr 已是世界座標 */
    let capC = arr0[0], capScore = -1;
    for (const c of arr0) {
      const x = c % w, y = (c / w) | 0;
      let sc = 0;
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          if (Math.abs(dx) + Math.abs(dy) > 3) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          if (t[ny * w + nx]) sc++;
        }
      }
      if (sc > capScore) { capScore = sc; capC = c; }
    }
    const cx = capC % w, cy = (capC / w) | 0;
    const bi = biomeAt(z.x0 + cx, z.y0 + cy);
    z.districts.push({
      id: id++, cells: arr, size: arr.length, owner: NEUTRAL, biome: bi,
      cap: {
        lx: cx, ly: cy, x: z.x0 + cx + 0.5, y: z.y0 + cy + 0.5,
        i: (z.y0 + cy) * WORLD_W + (z.x0 + cx),
        owner: NEUTRAL, prog: 0, surr: 0, pulse: 0, flash: 0, checkT: 0,
        biome: bi, pop: 20000, zone: z
      }
    });
  }
  for (const d of z.districts) d.cap.district = d;

  /* 5. 地區邊界線 */
  const p = new Path2D();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = y * w + x;
      if (!t[c]) continue;
      const l = lab[c], wx = z.x0 + x, wy = z.y0 + y;
      if (x < w - 1 && t[c + 1] && lab[c + 1] !== l) { p.moveTo(wx + 1, wy); p.lineTo(wx + 1, wy + 1); }
      if (y < h - 1 && t[c + w] && lab[c + w] !== l) { p.moveTo(wx, wy + 1); p.lineTo(wx + 1, wy + 1); }
    }
  }
  z.borders = p;
}

/* 把整塊區塊分給各路人馬（玩家主場則保留一個地區給玩家） */
function assignOwners(z, homeIdx) {
  const b = G.board;
  const ds = z.districts;
  if (!ds.length) return;
  /* v14：統一國家的大陸 —— 所有地區都歸同一個國家，只有玩家主場例外 */
  if (G.unified) {
    let uni = G.rivals.find(function (r) { return !r.dead && r.owner === 1; });
    if (!uni) {
      uni = { owner: 1, name: '大一統帝國', dead: false, unified: true };
      G.rivals.push(uni);
    }
    for (const r of G.rivals) if (r !== uni) r.dead = true;
  }
  const want = G.unified ? 1 : Math.min(homeIdx >= 0 ? 2 : 3, Math.max(1, ds.length - (homeIdx >= 0 ? 1 : 0)));

  /* 國家是跨區塊延續的：沿用既有敵國，不夠才開新國（最多 4 國） */
  const slots = [];
  for (const r of G.rivals) if (!r.dead && slots.indexOf(r.owner) < 0) slots.push(r.owner);
  if (G.unified) {
    slots.length = 0;
    slots.push(1);
  } else {
    for (let o = 1; o < COLORS.length && slots.length < want; o++) {
      if (slots.indexOf(o) >= 0) continue;
      G.rivals.push({ owner: o, name: makeFactionName(), dead: false });
      slots.push(o);
    }
  }

  let si = 0;
  const ownerOf = [];
  for (const d of ds) {
    if (d.id === homeIdx) { ownerOf[d.id] = 0; continue; }
    ownerOf[d.id] = slots.length ? slots[si++ % slots.length] : NEUTRAL;
  }

  /* 玩家開局至少拿兩個相鄰地區，否則人口與兵團會被 AI 壓死 */
  if (homeIdx >= 0 && ds.length >= 5) {
    const at = new Map();
    for (const d of ds) for (const i of d.cells) at.set(i, d.id);
    let bestD = -1, bestN = -1;
    for (const d of ds) {
      if (d.id === homeIdx) continue;
      let n = 0;
      for (const i of d.cells) {
        const x = i % ZW, y = (i / ZW) | 0;
        if (x > 0 && at.get(i - 1) === homeIdx) n++;
        if (x < ZW - 1 && at.get(i + 1) === homeIdx) n++;
        if (y > 0 && at.get(i - ZW) === homeIdx) n++;
        if (y < ZH - 1 && at.get(i + ZW) === homeIdx) n++;
      }
      if (n > bestN) { bestN = n; bestD = d.id; }
    }
    if (bestD >= 0 && bestN > 0) ownerOf[bestD] = 0;
  }

  /* 預填：整個地區都塗成地主的顏色（玩家主場除外） */
  for (const d of ds) {
    const o = ownerOf[d.id];
    d.owner = o;
    d.cap.owner = o;
    for (const i of d.cells) {
      b.setOwner(i, o);
      b.hp[i] = HP_MAX;
      b.lock[i] = 0;
    }
    b.setOwner(d.cap.i, o);
  }

  /* 進場走廊：接縫往中心的路、以及接縫附近的登陸場保持中立，讓玩家走得進來 */
  const cx = ZW / 2, cy = ZH / 2;
  const seams = [];
  if (zoneAt(z.gx - 1, z.gy)) seams.push([0, ZH / 2]);
  if (zoneAt(z.gx + 1, z.gy)) seams.push([ZW, ZH / 2]);
  if (zoneAt(z.gx, z.gy - 1)) seams.push([ZW / 2, 0]);
  if (zoneAt(z.gx, z.gy + 1)) seams.push([ZW / 2, ZH]);
  const clear = (lx, ly, rad) => {
    for (let y = Math.floor(ly - rad); y <= Math.ceil(ly + rad); y++) {
      for (let x = Math.floor(lx - rad); x <= Math.ceil(lx + rad); x++) {
        if (x < 0 || y < 0 || x >= ZW || y >= ZH) continue;
        if ((x - lx) * (x - lx) + (y - ly) * (y - ly) > rad * rad) continue;
        const i = (z.y0 + y) * WORLD_W + (z.x0 + x);
        if (!b.terrain[i]) continue;
        if (b.owner[i] === 0) continue;
        b.setOwner(i, NEUTRAL);
      }
    }
  };
  for (const sm of seams) {
    clear(sm[0], sm[1], 3.2);
    for (let t01 = 0; t01 <= 1.0001; t01 += 0.12) {
      clear(sm[0] + (cx - sm[0]) * t01, sm[1] + (cy - sm[1]) * t01, 1.6);
    }
  }

  /* 國家：每個佔到地的顏色都是一個國家。
     敵國每座主城的初始兵團數 = 區塊數 × 0.5（最少 1 支、最多 10 支），玩家每座主城 1 支。
     v8.1 回調成 v7 的數值。 */
  const perCap = clamp(Math.round(G.zones.length * CFG.enemyArmyPerZone), 1, CFG.enemyArmyCap);
  /* v14：統一帝國是一整片大陸的政權，兵團比一般國家多、人也比較多 */
  const uniMul = G.unified ? 1.5 : 1;
  for (const d of ds) {
    const o = ownerOf[d.id];
    if (o < 0) continue;
    const n = o === 0 ? 1 : Math.round(perCap * uniMul);
    const men = o === 0 ? 500
      : Math.round(Math.min(CFG.enemyMenCap, Math.round(CFG.enemyMenBase * zoneMul())) * (G.unified ? 1.35 : 1));
    for (let k = 0; k < n; k++) {
      const na = addArmy(o, d.cap.x + (Math.random() - 0.5) * 0.8, d.cap.y + (Math.random() - 0.5) * 0.8, men, d.cap, z);
      if (o === 0 && !G.newPlayerArmy) G.newPlayerArmy = na;
    }
  }

  /* 每座主城配守軍：只在家門口攔截，不會跟著野戰兵團到處跑。
     v8 守軍從 100 提升到 300（上限 1200 → 4800）；
     v9 敵軍優勢未生效時回到 v7 的 100 / 上限 1200。 */
  for (const d of ds) {
    const o = ownerOf[d.id];
    if (o < 0) continue;
    const buffed = o === 0 || enemyBuff();
    const gmen = o === 0 ? 100
      : Math.min(buffed ? CFG.garrisonCap : 1200,
                 Math.round((buffed ? CFG.garrisonBase : 100) * zoneMul()));
    const gd = addArmy(o, d.cap.x + 0.9, d.cap.y + 0.9, gmen, d.cap, z);
    gd.garrison = true;
  }

  for (const d of ds) G.caps.push(d.cap);
  rivalSig = ''; capSig = '';
}

/* 玩家主場：離區塊中心最近的那個地區 */
function pickHomeDistrict(z) {
  const cx = ZW / 2, cy = ZH / 2;
  let best = -1, bestD = 1e9;
  for (const d of z.districts) {
    const dd = (d.cap.lx - cx) * (d.cap.lx - cx) + (d.cap.ly - cy) * (d.cap.ly - cy);
    const dc = (d.cells[0] % ZW - cx) * (d.cells[0] % ZW - cx);
    if (dd < bestD) { bestD = dd; best = d.id; }
  }
  return best;
}

/* ═══════════════════════════ 開局 ═══════════════════════════ */
function freeOwnerSlot() {
  for (let o = 1; o < COLORS.length; o++) {
    let used = false;
    for (const r of G.rivals) if (!r.dead && r.owner === o) used = true;
    if (!used) return o;
  }
  return -1;
}

function spawnRivals(z) {
  const want = Math.min(3, 1 + Math.floor(G.zones.length / 3));
  let placed = 0;
  const rand = mulberry32((z.seed ^ 0x51ed270b) >>> 0);
  for (let tries = 0; tries < 260 && placed < want; tries++) {
    const lx = 3 + ((rand() * (ZW - 6)) | 0);
    const ly = 3 + ((rand() * (ZH - 6)) | 0);
    const wx = z.x0 + lx, wy = z.y0 + ly;
    const i = wy * WORLD_W + wx;
    if (!G.board.terrain[i]) continue;
    let ok = true;
    for (let dy = -1; dy <= 1 && ok; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (!G.board.terrain[i + dy * WORLD_W + dx]) { ok = false; break; }
    if (!ok) continue;
    // 不要擠在一起
    for (const r of G.rivals) {
      if (r.dead) continue;
      if (Math.abs(r.unit.x - wx) + Math.abs(r.unit.y - wy) < 9) { ok = false; break; }
    }
    if (!ok) continue;
    const slot = freeOwnerSlot();
    if (slot < 0) break;
    const u = new Unit(slot, wx + 0.5, wy + 0.5,
      Math.min(CFG.aiSpeedMax, CFG.aiSpeedBase + CFG.aiSpeedPerZone * (G.zones.length - 1)),
      Math.min(3, 1 + Math.floor((G.zones.length - 1) / 3)));
    G.rivals.push({ owner: slot, unit: u, brain: new Brain(u), dead: false });
    paintBlob(wx, wy, 2, slot);
    placed++;
  }
}

function paintBlob(cx, cy, r, owner) {
  const b = G.board;
  for (let y = cy - r; y <= cy + r; y++) {
    for (let x = cx - r; x <= cx + r; x++) {
      if (Math.abs(x - cx) + Math.abs(y - cy) > r) continue;
      if (!b.isLand(x, y)) continue;
      b.setOwner(y * b.w + x, owner);
      b.hp[y * b.w + x] = HP_MAX;
    }
  }
}

function newGame(opts) {
  const keepStage = opts && opts.stage;
  G.stage = keepStage || 1;
  G.unified = G.stage >= 2;
  G.diplo = G.stage >= 2;        // v14：佔領第一片大陸之後解鎖外交
  if (G.stage <= 1) G.wars = {};
  G.zones.length = 0;
  G.rivals.length = 0;
  G.caps.length = 0;
  G.parts.length = 0;
  G.t = 0;
  G.zone = 1;
  G.kills = 0;
  G.suffocate = 0;
  G.openDelay = 0;
  G.pending = false;
  G.surge.t = 0;
  G.surge.cd = 0;
  G.caps.length = 0;
  G.capSig = '';
  G.armies.length = 0;
  G.uidSeq = 0;
  G.control = -1;
  G.popT = 0;
  G.popPaid = 0;
  G.popPaidBy = {};
  G.draftCd = 0;
  G.warMode = false;
  G.startTime = performance.now();
  G.board = newBoard();

  USED_NAMES.clear();
  const forced = new URLSearchParams(location.search).get('seed');
  WORLD_SEED = forced ? (parseInt(forced, 10) >>> 0)
                      : ((Date.now() ^ ((Math.random() * 0x7fffffff) | 0)) >>> 0);
  G.baseSeed = WORLD_SEED;
  buildWorld();
  const start = pickStartZone();
  G.home = { gx: start.gx, gy: start.gy };
  G.armies = [];
  G.mobFlash = {};
  G.player = { sel: null };
  const z0 = openZone(start.gx, start.gy, true);
  const home = z0.districts.find(d => d.owner === 0) || z0.districts[0];
  const cx = Math.floor(home ? home.cap.x : z0.x0 + (ZW >> 1));
  const cy = Math.floor(home ? home.cap.y : z0.y0 + (ZH >> 1));
  paintBlob(cx, cy, 2, 0);
  G.suffocate = 0;

  G.zones.length = 1;
  G.zones[0] = z0;
  // 開局人口視為已結算，避免一開場就被 20000 人口換出一堆兵團
  G.popPaid = Math.floor(playerPop());
  for (const r of G.rivals) {
    let pp = 0;
    for (const c of G.caps) if (c.owner === r.owner) pp += c.pop || 0;
    G.popPaidBy[r.owner] = Math.floor(pp);
  }
  if (!G.player.sel) {
    const first = armyOf(0);
    G.player.sel = first.length ? first[0] : null;
  }
  /* v15：開局就把自家城池命名，並把待分配人力清空 */
  G.garrisonPool = 0;
  G.waitingNext = false;
  G.nameIdx = 0;
  for (const c of G.caps) if (c.owner === 0) nameCity(c);
  for (const c of G.caps) if (!c.name && c.owner === 0) nameCity(c);
  cam.cell = fitCell();
  cam.x = G.player.sel ? G.player.sel.x : cam.x;
  cam.y = G.player.sel ? G.player.sel.y : cam.y;
  cam.tx = cam.x; cam.ty = cam.y;
  cam.camPan = 0;
  terrDirty = true;
}

function fitCell() {
  const z = G.zones[0];
  if (!z) return 30;
  return clamp(Math.min(CW / (ZW + 1), (CH * 0.9) / (ZH + 1)), 7, 56);
}

/* ═══════════════════════════ 相機 ═══════════════════════════ */
function camPanTo(x, y, dur) {
  cam.tx = x; cam.ty = y;
  cam.camPan = dur;
}

function clampCam() {
  const b = G.board;
  if (!b) return;
  const bw = b.boxX1 - b.boxX0 + 1, bh = b.boxY1 - b.boxY0 + 1;
  const halfW = (CW / 2) / cam.cell, halfH = (CH * 0.86 / 2) / cam.cell;
  const minX = b.boxX0 - 1 + halfW, maxX = b.boxX1 + 2 - halfW;
  const minY = b.boxY0 - 1 + halfH, maxY = b.boxY1 + 2 - halfH;
  cam.x = minX > maxX ? (b.boxX0 + b.boxX1 + 1) / 2 : clamp(cam.x, minX, maxX);
  cam.y = minY > maxY ? (b.boxY0 + b.boxY1 + 1) / 2 : clamp(cam.y, minY, maxY);
}

function zoomBy(f) {
  const before = cam.cell;
  cam.cell = clamp(cam.cell * f, 7, 58);
  if (cam.cell !== before) {
    zoomFlash = 0.25;
    updateHUD();
  }
  clampCam();
}
let zoomFlash = 0;

/* ═══════════════════════════ 更新 ═══════════════════════════ */
function update(dt) {
  const b = G.board;
  if (!b) return;
  if (G.state !== 'playing') { updateParts(dt); return; }
  G.t += dt;
  b.time += dt;
  if (G.grace > 0) G.grace = Math.max(0, G.grace - dt);

  if (G.surge.t > 0) {
    G.surge.t -= dt;
    if (G.surge.t <= 0) { G.surge.t = 0; G.surge.cd = CFG.surgeCd; }
  } else if (G.surge.cd > 0) {
    G.surge.cd = Math.max(0, G.surge.cd - dt);
  }
  if (G.draftCd > 0) G.draftCd = Math.max(0, G.draftCd - dt);   // v11 征召冷卻

  // 玩家操控的兵團
  const cu = controlledUnit();
  if (cu) {
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (dx || dy) moveUnit(b, cu, dx, dy, dt, G.surge.t > 0 ? CFG.surgeSpeed : 1);
    // 玩家操控的兵團不受區塊限制，想去哪就去哪；只有 AI 操控時才被鎖在出生的區塊
    applyBrush(b, cu, dt);
    if (!cu.out && cu.home && Math.hypot(cu.x - cu.home.x, cu.y - cu.home.y) > 4) {
      cu.out = true;
      toast('兵團出擊中　·　' + Math.round(cu.men) + ' 人');
    }
  }

  // 吃完當下的判定放在玩家塗抹之後：這一瞬間全歸玩家就算清盤
  if (!G.pending && b.cnt[1] >= b.landCount && b.landCount > 0) {
    G.pending = true;
    G.openDelay = CFG.zoneOpenDelay;
    toast('第 ' + G.zones.length + ' 塊已完全征服');
    for (let k = 0; k < 26; k++) {
      const z = G.zones[G.zones.length - 1];
      spawnPart(z.x0 + Math.random() * ZW, z.y0 + Math.random() * ZH, '#9dfff0', 1.4, 0.9);
    }
    blip(300, 0.16, 0.05, 'sine');
    setTimeout(function () { blip(450, 0.2, 0.045, 'sine'); }, 120);
  }

  // AI 兵團
  pathBudget = 2;              // v15：每幀最多算兩條路徑
  updateArmies(dt, b);
  updateReturnTeleport(dt);    // v15.1：歸位卡住 3 秒自動回城
  /* v15：定期校正「一城一野戰軍」與自動存檔 */
  G.homeT = (G.homeT || 0) - dt;
  if (G.homeT <= 0) { G.homeT = 2; assignHomes(); }
  autoSaveTick(dt);

  // 快被消滅的國家會崩解
  for (const r of G.rivals) {
    if (r.dead) continue;
    if (b.cnt[r.owner + 1] <= CFG.collapseAt) {
      if (Math.random() < dt * 4) {
        const mine = [];
        for (let i = 0; i < b.n; i++) if (b.owner[i] === r.owner) mine.push(i);
        if (mine.length) b.setOwner(mine[(Math.random() * mine.length) | 0], NEUTRAL);
      }
      for (const a of G.armies) if (a.owner === r.owner) a.stunned = true;
    } else {
      for (const a of G.armies) if (a.owner === r.owner) a.stunned = false;
    }
  }

  // 窒息判定：腳下與四鄰都沒有自己的地 → 撐不住就死
  // 兵團不再窒息：行軍本來就會踩在敵地上，改成只有「站著不動又沒有自己的地」才會消耗
  for (const a of G.armies.slice()) {
    if (!a.alive) continue;
    const moved = Math.hypot(a.x - (a.lastX === undefined ? a.x : a.lastX),
                             a.y - (a.lastY === undefined ? a.y : a.lastY));
    a.lastX = a.x; a.lastY = a.y;
    if (ownGround(b, a) || moved > 0.02) { a.breath = 0; }
    else {
      a.breath = (a.breath || 0) + dt;
      if (a.breath > 4.0) { a.men -= 26 * dt; if (a.men <= 0.5) killArmy(a); }
    }
  }

  // 兵團全滅但還有主城 → 從主城重整殘部
  G.rescueT -= dt;
  if (G.rescueT <= 0) {
    G.rescueT = 6;
    if (!armyOf(0).length) {
      const caps = G.caps.filter(function (c) { return c.owner === 0; });
    if (caps.length) {
      /* v15：野戰軍全滅 → 從守軍抽定額湊一支，再補到上限 */
      caps.sort(function (p, q) {
        const gp = capGarrison(p), gq = capGarrison(q);
        return (gq ? gq.men : 0) - (gp ? gp.men : 0);
      });
      const c = caps[0];
      const g = capGarrison(c);
      const take = g ? Math.min(500, Math.max(0, Math.floor(g.men - 100))) : 0;
      if (g) g.men -= take;
      const sp = freeSpotNear(c.x + 0.5, c.y + 0.5);
      const na = addArmy(0, sp[0], sp[1], Math.max(100, take), c, c.zone);
      topUpArmy(na);
      G.player.sel = na;
      assignHomes();
      toast('殘部重整　·　' + Math.round(na.men) + ' 人');
    } else {
        onDefeat();
        return;
      }
    }
  }

  if (G.pending) {
    G.openDelay -= dt;
    if (G.openDelay <= 0) {
      G.pending = false;
      if (!G.autoNext) {
        /* v15：不自動開下一輪，停在這裡等玩家按 */
        G.waitingNext = true;
        toast('這一輪清空了　·　按「開啟下一輪」繼續');
      } else if (!openNextZone()) {
        if (G.stage < 2) {
          G.state = 'stageclear';
          renderStageClear();
        } else {
          G.state = 'victory';
          renderVictory();
        }
      }
    }
  }

  updateSiege(dt);
  updatePop(dt);
  for (const z of G.zones) if (z.reveal > 0) z.reveal -= dt / 1.5;
  updateParts(dt);
  updateHUD();
}

function updateParts(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
  }
}

/* ═══════════════════════════ 主城 ═══════════════════════════ */
/* 誰在圍城：回傳 owner（0 = 玩家），-1 表示雙方都在（僵持），-2 表示沒人 */
function siegerOf(cap) {
  let sieger = -2, bestD = 1e9;
  const near = [];
  for (const a of G.armies) {
    if (!a.alive || a.stunned) continue;
    if (a.owner === cap.owner) continue;      // 守軍站在自己的城上不算圍城
    /* v14 外交：和平的雙方不能互相圍城 */
    if (cap.owner === 0 && a.owner > 0 && !atWar(a.owner)) continue;
    if (cap.owner > 0 && a.owner === 0 && !atWar(cap.owner)) continue;
    const d = Math.hypot(a.x - cap.x, a.y - cap.y);
    if (d > CFG.siegeRadius) continue;
    if (a.owner === 0) { if (d < bestD) { sieger = 0; bestD = d; } }
    else near.push([d, a.owner]);
  }
  near.sort((a, b) => a[0] - b[0]);
  if (sieger === 0) {
    return near.length ? -1 : 0;      // 玩家和 AI 同時貼著城 → 僵持
  }
  if (near.length) return near[0][1];
  return -2;
}

/* 地區裡除了主城那一格以外的地，是不是全部同一方 */
function districtSoleOwner(d) {
  if (!d || !d.cells) return -1;      // 存檔還原時的防護：對不到地區就不要爆掉
  let who = -2;
  for (const i of d.cells) {
    if (i === d.cap.i) continue;
    const o = G.board.owner[i];
    if (o === NEUTRAL) return -1;
    if (who === -2) who = o;
    else if (who !== o) return -1;
  }
  return who;
}

function captureDistrict(cap, owner) {
  const b = G.board;
  const d = cap.district;
  if (!d) return;                     // 防護：沒有地區就不做事
  const prev = cap.owner;
  if (prev === owner) { cap.prog = 0; return; }
  for (const i of d.cells) {
    b.setOwner(i, owner);
    b.hp[i] = HP_MAX;
    b.lock[i] = b.time + 0.6;
  }
  cap.owner = owner;
  d.owner = owner;
  cap.prog = 0;
  cap.surr = 0;
  cap.flash = 1;
  cap.pulse = 0.4;
  for (let k = 0; k < 18; k++) spawnPart(cap.x, cap.y, COLORS[owner < 0 ? 0 : owner].css, 0.9, 0.7);
  if (owner === 0) {
    nameCity(cap);                       // v15：攻下的城取一個中國古風名字
    spawnFieldArmyAt(cap, 500, true);    // v16：新城成立自動調撥 500 人成野戰軍
    toast('攻下主城　·　' + cap.name + '　·　整片地區歸你');
    blip(520, 0.18, 0.05, 'sine');
  } else if (prev === 0) {
    toast('主城失守　·　這片地區被奪走');
    blip(140, 0.35, 0.06, 'sawtooth');
  } else if (owner > 0) {
    toast((rivalName(owner)) + ' 攻下了一座主城');
  }
  // 城破時，附近殘餘的敵方兵團直接併入佔領者的人口
  if (prev >= 0) {
    let absorbed = 0;
    for (const a of G.armies.slice()) {
      if (!a.alive || a.owner !== prev) continue;
      if (Math.hypot(a.x - cap.x, a.y - cap.y) > 7) continue;
      absorbed += a.men;
      killArmy(a, true);
    }
    if (absorbed > 0) {
      cap.pop = (cap.pop || 0) + absorbed;
      if (owner === 0) toast('俘獲 ' + Math.round(absorbed) + ' 人　·　併入人口');
    }
  }
  /* v10：攻下主城拿到的這批人口（含俘虜），立刻算進兵力轉化 */
  if (owner === 0) convertPlayerPop();

  if (prev > 0 && b.cnt[prev + 1] === 0) {
    const r = G.rivals.find(x => x.owner === prev && !x.dead);
    if (r) killRival(r);
  }
  rivalSig = ''; capSig = '';
}

/* v8：主城裡有多少守方兵力（含守軍與回防的野戰兵團） */
function capDefenders(cap, rad) {
  let men = 0;
  const r = rad || 5.5;
  for (const a of G.armies) {
    if (!a.alive || a.owner !== cap.owner) continue;
    if (Math.hypot(a.x - cap.x, a.y - cap.y) <= r) men += a.men;
  }
  return men;
}

/* v8 城防：圍城者站在城下會被持續消耗。
   傷害用「自身兵力的百分比」而不是固定值 —— 固定值對 6 萬人的大兵團等於不存在，
   只有百分比傷害才咬得動堆疊起來的兵團。 */
function capitalFire(cap, dt) {
  if (cap.owner > 0 && !enemyBuff()) return;   // v9：敵軍優勢未生效時不開火
  const def = capDefenders(cap, 5.5);
  const pow = clamp(def / CFG.capFirePow, 0.35, CFG.capFireMax);
  const rate = CFG.capFireRate * pow;
  for (const a of G.armies.slice()) {
    if (!a.alive || a.owner === cap.owner) continue;
    if (Math.hypot(a.x - cap.x, a.y - cap.y) > CFG.siegeRadius + 0.7) continue;
    a.men -= a.men * rate * dt;
    if (Math.random() < dt * 4) spawnPart(a.x, a.y, '#ffb86b', 0.55, 0.45);
    if (a.men <= 0.5) killArmy(a);
  }
}

/* v8 全民皆兵：敵方主城被圍時會從人口抽兵補進守軍，逼玩家真的把城打下來。
   每次圍城有次數上限（capBuyMax），否則守軍補得比殺得快，城會變成打不完的牆。 */
function capBuyTroops(cap, dt) {
  if (cap.owner <= 0 || !enemyBuff()) return;   // v9：敵軍優勢未生效時不抽兵
  cap.buyT = (cap.buyT || 0) - dt;
  if (cap.buyT > 0) return;
  cap.buyT = CFG.capBuyT;
  if ((cap.buys || 0) >= CFG.capBuyMax) return;
  if ((cap.pop || 0) < 8000) return;
  if (capDefenders(cap, 3.2) >= CFG.capBuyGuard) return;
  const take = Math.min(CFG.capBuyMen, (cap.pop || 0) - 4000);
  if (take < 100) return;
  let g = null;
  for (const a of G.armies) {
    if (a.alive && a.owner === cap.owner && a.garrison && a.home === cap) { g = a; break; }
  }
  cap.pop -= take;
  cap.buys = (cap.buys || 0) + 1;
  if (g) {
    g.men += take;
    g.g0 = Math.max(g.g0 || 0, g.men);
  } else {
    const na = addArmy(cap.owner, cap.x + 0.6, cap.y + 0.6, take, cap, cap.zone);
    na.garrison = true;
    na.g0 = take;
  }
  for (let k = 0; k < 8; k++) spawnPart(cap.x, cap.y, '#ffe08a', 0.8, 0.6);
}

function updateSiege(dt) {
  const b = G.board;
  for (const cap of G.caps) {
    if (!cap.district) continue;      // 沒有對到地區的主城不參與圍城判定
    if (cap.flash > 0) cap.flash = Math.max(0, cap.flash - dt * 3);
    if (cap.pulse > 0) cap.pulse = Math.max(0, cap.pulse - dt);
    const who = siegerOf(cap);
    let sieging = false;
    if (who >= 0 && who !== cap.owner) {
      const need = who === 0 ? CFG.siegeTime : CFG.siegeAiTime;
      const bm = BIOMES[cap.biome || 0].siege;
      /* v8 守城優勢：城裡守軍越多，圍城進度越慢（守軍 1400 → 砍半，最低 0.28 倍） */
      const defMen = capDefenders(cap);
      const defMul = (cap.owner > 0 && !enemyBuff())
        ? 1
        : Math.max(CFG.siegeDefFloor, 1 / (1 + defMen / CFG.siegeDefSlow));
      cap.prog = Math.min(1, cap.prog + (dt / need) * bm * defMul);
      cap.pulse = 0.5;
      sieging = true;
      capitalFire(cap, dt);
      capBuyTroops(cap, dt);
      if (cap.prog >= 1) { captureDistrict(cap, who); continue; }
    } else if (who === -1) {
      sieging = true;    // 僵持：進度不動也不衰減
      capitalFire(cap, dt);
    }
    if (!sieging) {
      cap.prog = Math.max(0, cap.prog - dt * CFG.siegeDecay);
      /* v9：抽兵額度不隨圍城中斷而重置 —— 每座城整場只抽一次 */
    }

    /* 自動歸降：地區其他格全被同一方吃光 */
    cap.checkT -= dt;
    if (cap.checkT <= 0) {
      cap.checkT = 0.25;
      const sole = districtSoleOwner(cap.district);
      if (sole >= 0 && sole !== cap.owner) cap.surr += 0.25;
      else cap.surr = Math.max(0, cap.surr - 0.5);
      if (cap.surr >= CFG.surrenderTime) { captureDistrict(cap, sole); }
    }
  }
}

function rivalName(owner) {
  for (const r of G.rivals) if (r.owner === owner && r.name) return r.name;
  return COLORS[owner] ? COLORS[owner].name : '某個勢力';
}

function killRival(r) {
  if (r.dead) return;
  r.dead = true;
  const b = G.board;
  for (const a of G.armies.slice()) if (a.owner === r.owner) killArmy(a, true);
  let sx = 0, sy = 0, sn = 0;
  for (let i = 0; i < b.n; i++) {
    if (b.owner[i] === r.owner) {
      if (sn === 0) { sx = i % b.w; sy = (i / b.w) | 0; }
      sn++;
      b.setOwner(i, NEUTRAL);
    }
  }
  G.kills++;
  if (sn) spawnBurst(sx, sy, COLORS[r.owner].css);
  toast((r.name || COLORS[r.owner].name) + ' 被吞沒了');
  if (!muted) blip(180, 0.25, 0.05, 'sawtooth');
  const k = G.rivals.indexOf(r);
  if (k >= 0) G.rivals.splice(k, 1);
  rivalSig = '';
}

function onDefeat() {
  G.state = 'defeat';
  renderDefeat();
}

/* ═══════════════════════════ 縮放／視窗 ═══════════════════════════ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = window.innerWidth;
  CH = window.innerHeight;
  canvas.width = Math.floor(CW * DPR);
  canvas.height = Math.floor(CH * DPR);
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  clampCam();
}
window.addEventListener('resize', resize);

/* ═══════════════════════════ 繪圖 ═══════════════════════════ */
function rebuildTerritory() {
  const b = G.board;
  if (!b || !terrU32) return;
  const w = b.w, owner = b.owner;
  for (let i = 0; i < b.n; i++) {
    const o = owner[i];
    if (o < 0) { terrU32[i] = 0; continue; }
    const px = i % w, py = (i / w) | 0;
    const c = COLORS[o], P = BIOMES[biomeAt(px, py)];
    const mx = 0.26;
    const a2 = 146 + ((hash2i(px, py, 3) * 47) | 0);
    terrU32[i] = packRGBA(
      (c.r * (1 - mx) + P.mid[0] * mx) | 0,
      (c.g * (1 - mx) + P.mid[1] * mx) | 0,
      (c.b * (1 - mx) + P.mid[2] * mx) | 0, a2);
  }
  terrCtx.putImageData(terrImg, 0, 0);
  terrDirty = false;
}

function rebuildOutlines() {
  const b = G.board;
  if (!b || b.boxX1 < b.boxX0) return;
  const w = b.w, owner = b.owner;
  const paths = COLORS.map(() => new Path2D());
  for (let y = b.boxY0; y <= b.boxY1; y++) {
    for (let x = b.boxX0; x <= b.boxX1; x++) {
      const i = y * w + x;
      const o = owner[i];
      if (o < 0) continue;
      const p = paths[o];
      if (y === 0 || owner[i - w] !== o) { p.moveTo(x, y); p.lineTo(x + 1, y); }
      if (y === b.h - 1 || owner[i + w] !== o) { p.moveTo(x, y + 1); p.lineTo(x + 1, y + 1); }
      if (x === 0 || owner[i - 1] !== o) { p.moveTo(x, y); p.lineTo(x, y + 1); }
      if (x === w - 1 || owner[i + 1] !== o) { p.moveTo(x + 1, y); p.lineTo(x + 1, y + 1); }
    }
  }
  terrPaths = paths;
}

function render() {
  const b = G.board;
  buildCapTroops();          // v15：城池守備數字用
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 海
  const g = ctx.createRadialGradient(CW * 0.5, CH * 0.42, 60, CW * 0.5, CH * 0.5, Math.max(CW, CH) * 0.78);
  g.addColorStop(0, '#123043');
  g.addColorStop(0.55, '#0b1c29');
  g.addColorStop(1, '#050c13');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
  if (!b) return;

  const cs = cam.cell;
  const ox = CW / 2 - cam.x * cs;
  const oy = CH * 0.5 - cam.y * cs;

  const x0 = Math.max(0, Math.floor(-ox / cs) - 1);
  const y0 = Math.max(0, Math.floor(-oy / cs) - 1);
  const x1 = Math.min(b.w, Math.ceil((CW - ox) / cs) + 1);
  const y1 = Math.min(b.h, Math.ceil((CH - oy) / cs) + 1);
  const sw = x1 - x0, sh = y1 - y0;

  ctx.imageSmoothingEnabled = false;
  if (sw > 0 && sh > 0) {
    ctx.drawImage(terrainCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);
    if (shadowCv) ctx.drawImage(shadowCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);

    if (terrDirty) rebuildTerritory();
    ctx.globalAlpha = 0.68;
    ctx.drawImage(terrCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(cs, cs);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  if (coastPath) {
    ctx.strokeStyle = 'rgba(186,226,232,.30)';
    ctx.lineWidth = 1.6 / cs;
    ctx.stroke(coastPath);
  }
  if (terrPaths) {
    for (let o = 0; o < COLORS.length; o++) {
      const p = terrPaths[o];
      if (!p) continue;
      ctx.lineWidth = 1.9 / cs;
      ctx.strokeStyle = OUTLINE[o];
      ctx.stroke(p);
      if (o === 0) {
        ctx.lineWidth = 4.0 / cs;
        ctx.strokeStyle = GLOW;
        ctx.stroke(p);
      }
    }
  }

  // 新區塊的浮現光環
  for (const z of G.zones) {
    if (z.reveal <= 0) continue;
    const a = clamp(z.reveal, 0, 1);
    const t = 1 - a;
    const cx = z.x0 + z.w / 2, cy = z.y0 + z.h / 2;
    const rr = Math.max(z.w, z.h) * (0.12 + t * 0.62);
    const grd = ctx.createRadialGradient(cx, cy, rr * 0.55, cx, cy, rr);
    grd.addColorStop(0, 'rgba(140,255,238,0)');
    grd.addColorStop(0.75, 'rgba(150,255,242,' + (a * 0.30).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.fill();
  }

  // 粒子
  for (const p of G.parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.7), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 兵團
  for (const a of G.armies) if (a.alive) drawArmy(a, cs);
  if (G.player && G.player.sel && G.player.sel.alive) {
    const a = G.player.sel;
    ctx.strokeStyle = 'rgba(255,224,138,.9)';
    ctx.lineWidth = 1.6 / cs;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 0.8, 0, TAU);
    ctx.stroke();
  }

  // 地區邊界（縮太小就不畫，免得糊成一團）
  if (cs >= 12) {
    ctx.strokeStyle = 'rgba(6,16,22,.32)';
    ctx.lineWidth = 1 / cs;
    ctx.setLineDash([2.5 / cs, 3.2 / cs]);
    for (const z of G.zones) if (z.borders) ctx.stroke(z.borders);
    ctx.setLineDash([]);
  }
  // 主城
  for (const cap of G.caps) drawCapital(cap, cs);

  ctx.restore();
}

function drawArmyOld(a, cs) {
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 3 + (a.phase || 0)) * 0.04;
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(a.x, a.y + 0.42, 0.44, 0.2, 0, 0, TAU);
  ctx.fill();
  // 三個小人
  ctx.fillStyle = COLORS[a.owner] ? COLORS[a.owner].css : '#cfd8dd';
  for (let i = 0; i < 3; i++) {
    const dx = (i - 1) * 0.23;
    const dy = (i === 1 ? -0.1 : 0) + bob;
    ctx.beginPath();
    ctx.arc(a.x + dx, a.y - 0.10 + dy, 0.135, 0, TAU);
    ctx.fill();
  }
  // 旗竿與旗子
  ctx.strokeStyle = 'rgba(10,26,30,.72)';
  ctx.lineWidth = 1.3 / cs;
  ctx.beginPath();
  ctx.moveTo(a.x + 0.32, a.y + 0.3);
  ctx.lineTo(a.x + 0.32, a.y - 0.66);
  ctx.stroke();
  ctx.fillStyle = a.owner === 0 ? '#ffe08a' : 'rgba(255,255,255,.72)';
  ctx.beginPath();
  ctx.moveTo(a.x + 0.32, a.y - 0.66);
  ctx.lineTo(a.x + 0.76, a.y - 0.50);
  ctx.lineTo(a.x + 0.32, a.y - 0.34);
  ctx.closePath();
  ctx.fill();
  // 人數
  if (cs >= 14) {
    const txt = String(Math.round(a.men));
    ctx.font = '700 0.32px ui-sans-serif,system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center';
    // 底色藥丸，壓在敵方領土上也讀得到
    const w = ctx.measureText(txt).width;
    ctx.fillStyle = a.owner === 0 ? 'rgba(6,32,30,.72)' : 'rgba(10,18,24,.66)';
    const py = a.y - 1.06;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(a.x - w / 2 - 0.13, py - 0.24, w + 0.26, 0.42, 0.16);
    else ctx.rect(a.x - w / 2 - 0.13, py - 0.24, w + 0.26, 0.42);
    ctx.fill();
    ctx.lineWidth = 0.055;
    ctx.strokeStyle = 'rgba(6,16,20,.5)';
    ctx.strokeText(txt, a.x, py + 0.06);
    ctx.fillStyle = a.owner === 0 ? '#e9fffb' : 'rgba(255,244,220,.95)';
    ctx.fillText(txt, a.x, py + 0.06);
    ctx.textAlign = 'left';
  }
}

function drawUnit(u, col, cs, isPlayer) {
  const r = 0.42;
  const t = performance.now() / 1000;
  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(u.x, u.y + 0.36, r * 0.9, r * 0.42, 0, 0, TAU);
  ctx.fill();

  // 危險（腳下沒地）
  if (u.breath > 0) {
    const k = clamp(u.breath / CFG.suffocateTime, 0, 1);
    ctx.strokeStyle = 'rgba(255,90,90,' + (0.35 + k * 0.6).toFixed(3) + ')';
    ctx.lineWidth = 2.4 / cs + 0.06;
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 0.16 + k * 0.18, 0, TAU);
    ctx.stroke();
  }

  // 身體
  const bob = Math.sin(t * 2.4 + u.phase) * 0.03;
  ctx.fillStyle = col.css;
  ctx.beginPath();
  ctx.arc(u.x, u.y + bob, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 1.4 / cs;
  ctx.stroke();

  // 眼睛
  const ex = u.fx * 0.13, ey = u.fy * 0.11;
  ctx.fillStyle = 'rgba(6,16,20,.82)';
  ctx.beginPath();
  ctx.arc(u.x - 0.14 + ex, u.y - 0.05 + ey, 0.075, 0, TAU);
  ctx.arc(u.x + 0.14 + ex, u.y - 0.05 + ey, 0.075, 0, TAU);
  ctx.fill();

  if (isPlayer) {
    const ready = G.surge.cd <= 0 && G.surge.t <= 0;
    const p = G.surge.t > 0 ? 1 : (ready ? 1 : 1 - G.surge.cd / CFG.surgeCd);
    ctx.strokeStyle = 'rgba(46,230,200,.16)';
    ctx.lineWidth = 2.2 / cs + 0.05;
    ctx.beginPath(); ctx.arc(u.x, u.y, r + 0.3, 0, TAU); ctx.stroke();
    ctx.strokeStyle = G.surge.t > 0 ? '#dcfffa' : (ready ? 'rgba(150,255,238,.95)' : 'rgba(90,200,190,.7)');
    ctx.lineWidth = 2.6 / cs + 0.05;
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 0.3, -Math.PI / 2, -Math.PI / 2 + TAU * p);
    ctx.stroke();
    if (ready) {
      ctx.globalAlpha = 0.25 + Math.sin(t * 5) * 0.12;
      ctx.strokeStyle = '#9dfff0';
      ctx.lineWidth = 5 / cs;
      ctx.beginPath(); ctx.arc(u.x, u.y, r + 0.3, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawCapitalOld(cap, cs) {
  const halfPx = Math.max(9, Math.min(26, cs * 0.62));
  const hw = halfPx / cs;
  const o = cap.owner;
  const col = o >= 0 ? COLORS[o] : { css: '#8fa3ad', r: 143, g: 163, b: 173 };
  const x = cap.x, y = cap.y;
  const top = y - hw * 0.9, bot = y + hw * 0.9;

  // 圍城進度：先畫底環再畫進度，遠看也讀得出來
  const ringR = hw * 1.75;
  if (cap.prog > 0.002) {
    ctx.strokeStyle = 'rgba(8,18,24,.42)';
    ctx.lineWidth = 3.2 / cs;
    ctx.beginPath();
    ctx.arc(x, y, ringR, 0, TAU);
    ctx.stroke();
  }

  // 台座
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(x, bot + hw * 0.18, hw * 1.22, hw * 0.42, 0, 0, TAU);
  ctx.fill();

  // 城體（比領土色再深一點，免得跟自己的地混在一起）
  const cr = Math.round(col.r * 0.82), cg2 = Math.round(col.g * 0.82), cb2 = Math.round(col.b * 0.82);
  const bodyCss = 'rgb(' + cr + ',' + cg2 + ',' + cb2 + ')';
  ctx.fillStyle = bodyCss;
  ctx.beginPath();
  ctx.rect(x - hw, top, hw * 2, bot - top);
  const bw = hw * 0.46;
  for (let k = 0; k < 3; k++) ctx.rect(x - hw + k * (hw * 0.77), top - bw * 0.9, bw * 0.62, bw * 0.9);
  ctx.fill();

  // 屋頂陰影（上緣壓暗，立體感）
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.fillRect(x - hw, top, hw * 2, hw * 0.34);

  // 門
  ctx.fillStyle = 'rgba(6,16,20,.66)';
  ctx.beginPath();
  ctx.moveTo(x - hw * 0.26, bot);
  ctx.lineTo(x - hw * 0.26, bot - hw * 0.5);
  ctx.arc(x, bot - hw * 0.5, hw * 0.26, Math.PI, 0);
  ctx.lineTo(x + hw * 0.26, bot);
  ctx.closePath();
  ctx.fill();

  // 外框：深底 + 淡亮邊，任何底色上都看得出來
  ctx.strokeStyle = 'rgba(8,18,24,.55)';
  ctx.lineWidth = 1.4 / cs;
  ctx.strokeRect(x - hw, top, hw * 2, bot - top);

  // 旗子
  ctx.strokeStyle = 'rgba(8,18,24,.55)';
  ctx.lineWidth = 1.1 / cs;
  ctx.beginPath();
  ctx.moveTo(x, top - bw * 0.9);
  ctx.lineTo(x, top - bw * 0.9 - hw * 0.5);
  ctx.stroke();
  ctx.fillStyle = bodyCss;
  ctx.beginPath();
  ctx.moveTo(x, top - bw * 0.9 - hw * 0.5);
  ctx.lineTo(x + hw * 0.44, top - bw * 0.9 - hw * 0.34);
  ctx.lineTo(x, top - bw * 0.9 - hw * 0.18);
  ctx.closePath();
  ctx.fill();

  // 圍城進度弧
  if (cap.prog > 0.002) {
    ctx.strokeStyle = 'rgba(255,104,96,.95)';
    ctx.lineWidth = 3.2 / cs;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x, y, ringR, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(cap.prog, 0, 1));
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // 被圍城時的脈動
  if (cap.pulse > 0) {
    ctx.strokeStyle = 'rgba(255,150,150,' + (cap.pulse * 0.8).toFixed(3) + ')';
    ctx.lineWidth = 1.5 / cs;
    ctx.beginPath();
    ctx.arc(x, y, hw * (1.25 + (0.5 - cap.pulse) * 3.0), 0, TAU);
    ctx.stroke();
  }

  // 易主閃光
  if (cap.flash > 0) {
    ctx.globalAlpha = cap.flash * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, hw * 2.0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* v10：兵力顯示用（1.2k / 34.5k / 1.2M） */
function fmtMen(n) {
  n = Math.round(n);
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

/* v10：玩家兵團清單（HUD 展開後才畫）。
   結構（有哪些兵團、誰被選中）變了才重繪；只有兵力在跳動時就只改文字，
   否則戰鬥中每幀重建 innerHTML 會讓點擊很不穩。 */
function renderArmyList() {
  if (!armyRowsEl || !armyToggleEl || !armyToggleEl.classList.contains('open')) return;
  const all = armyOf(0);
  const field = all.filter(function (a) { return !a.garrison; });
  const gar = all.filter(function (a) { return a.garrison; });
  const sel = G.player && G.player.sel;

  /* 結構變了才重繪；單純兵力跳動只改數字 */
  let sig = '';
  for (const a of field) sig += 'f' + a.uid + (a === sel ? '*' : '') + '|';
  for (const a of gar) sig += 'g' + a.uid + (a === sel ? '*' : '') + '|';

  const rowHtml = function (a) {
    return '<div class="army-item' + (a === sel ? ' on' : '') + '" data-army="' + a.uid + '">' +
      '<i class="dot" style="background:' + (a.garrison ? '#ffc142' : '#2ee6c8') + '"></i>' +
      '<span class="nm">' + (a.home && a.home.name ? a.home.name : '兵團') + '</span>' +
      '<span class="men">' + fmtMen(a.men) + '</span>' +
      (a === sel ? '<span class="tag">操控中</span>' : '') +
      (!a.garrison ? '<button class="disband" data-disband="' + a.uid + '">解散</button>' : '') +
      '</div>';
  };

  if (sig !== armySig) {
    armySig = sig;
    let h = '<div class="army-sec">野戰兵團 <b>0</b></div>';
    if (!field.length) h += '<div class="army-item empty">沒有野戰兵團</div>';
    for (const a of field) h += rowHtml(a);
    h += '<div class="army-sec">守軍 <b>0</b></div>';
    if (!gar.length) h += '<div class="army-item empty">沒有守軍</div>';
    for (const a of gar) h += rowHtml(a);
    armyRowsEl.innerHTML = h;
  }

  const list = field.concat(gar);
  const menEls = armyRowsEl.querySelectorAll('.army-item .men');
  for (let i = 0; i < menEls.length && i < list.length; i++) {
    menEls[i].textContent = fmtMen(list[i].men);
  }
  const secs = armyRowsEl.querySelectorAll('.army-sec b');
  if (secs[0]) secs[0].textContent = field.length + ' 支 · ' + fmtMen(playerFieldMen());
  if (secs[1]) secs[1].textContent = gar.length + ' 支 · ' + fmtMen(playerGarrisonMen());
}

function updateHUD() {
  const b = G.board;
  if (!b) return;
  const won = b.cnt[1];
  const land = Math.max(1, b.landCount);
  const pct = won / land;
  ownBarEl.style.width = (pct * 100).toFixed(1) + '%';
  ownPctEl.textContent = Math.round(pct * 100) + '%';
  leftCellsEl.textContent = String(Math.max(0, b.landCount - won));
  zoneNumEl.textContent = String(G.zones.length);
  zoneSizeEl.textContent = ZW + ' × ' + ZH;
  zoneCountEl.textContent = String(G.zones.length);
  zoomPctEl.textContent = Math.round(cam.cell / Math.max(1, fitCell()) * 100) + '%';
  let mine = 0, total = 0, dists = 0;
  for (const c of G.caps) { total++; if (c.owner === 0) mine++; }
  for (const z of G.zones) if (z.districts) dists += z.districts.length;
  capCountEl.textContent = mine + ' / ' + total;
  distCountEl.textContent = String(dists);
  aggLabelEl.textContent = AGGRO_LABEL[G.aggression];
  if (powMulEl) {
    powMulEl.textContent = enemyBuff() ? '×' + zoneMul().toFixed(1) : '休眠';
    powMulEl.style.opacity = enemyBuff() ? '1' : '.45';
  }
  if (draftCdEl) {
    const pct = Math.round((G.draftPct || CFG.draftPct) * 100);
    draftCdEl.textContent = (G.draftCd > 0 ? Math.ceil(G.draftCd) + 's' : '就緒') + ' · ' + pct + '%';
  }
  if (dipChipEl) dipChipEl.style.display = G.diplo ? '' : 'none';
  if (nextChipEl) nextChipEl.style.display = G.waitingNext ? '' : 'none';
  if (leftPanelEl) leftPanelEl.classList.toggle('folded', !!G.uiLeft);
  if (rightPanelEl) rightPanelEl.classList.toggle('folded', !!G.uiRight);
  const pop = playerPop();
  if (popCountEl) popCountEl.textContent = fmtMen(pop);
  const myAll = armyOf(0);
  let myField = 0;
  for (const a of myAll) if (!a.garrison) myField++;
  if (armyCountEl) armyCountEl.textContent = myField + ' / ' + armyCapOf();
  if (garCountEl) garCountEl.textContent = String(myAll.length - myField);
  if (menCountEl) menCountEl.textContent = fmtMen(playerFieldMen()) + ' / ' + fmtMen(playerGarrisonMen());
  renderArmyList();
  if (warChipEl) warChipEl.style.display = G.warMode ? '' : 'none';

  /* 敵國欄位：兵力與兵團數每幀都可能變，所以只重建結構，數值用 textContent 更新 */
  const alive = G.rivals.filter(r => !r.dead);
  const sig = alive.map(r => r.owner).join(',');
  if (sig !== rivalSig) {
    rivalSig = sig;
    let html = '';
    for (const r of alive) {
      html += '<div class="rival">' +
        '<i class="dot" style="background:' + COLORS[r.owner].css + ';color:' + COLORS[r.owner].css + '"></i>' +
        '<span class="rname">' + (r.name || COLORS[r.owner].name) + '</span>' +
        '<span class="rbar"><i style="width:0%;background:' + COLORS[r.owner].css + '"></i></span>' +
        '<span class="rpct">0%</span>' +
        '<span class="rmeta"></span></div>';
    }
    rivalsEl.innerHTML = html;
  }
  const bars = rivalsEl.querySelectorAll('.rbar i');
  const pcts = rivalsEl.querySelectorAll('.rpct');
  const metas = rivalsEl.querySelectorAll('.rmeta');
  alive.forEach((r, k) => {
    const p = Math.round(b.cnt[r.owner + 1] / land * 100);
    if (bars[k]) bars[k].style.width = p + '%';
    if (pcts[k]) pcts[k].textContent = p + '%';
    if (metas[k]) {
      let n = 0, men = 0;
      for (const a of G.armies) if (a.alive && a.owner === r.owner) { n++; men += a.men; }
      metas[k].textContent = n + ' 支兵團　·　' + fmtMen(men) + ' 兵' +
        (G.diplo ? (atWar(r.owner) ? '　·　交戰' : '　·　和平') : '');
    }
  });

  const cdLeft = G.surge.t > 0 ? 1 : 1 - G.surge.cd / CFG.surgeCd;
  surgeFillEl.style.width = (clamp(cdLeft, 0, 1) * 100).toFixed(0) + '%';
  if (surgeChipEl) {
    if (G.surge.t > 0) surgeChipEl.classList.add('hot');
    else surgeChipEl.classList.remove('hot');
  }
}

/* ═══════════════════════════ v14 存檔 ═══════════════════════════
   三個存檔槽，放在 localStorage。
   只存「玩的狀態」：seed + 已開區塊 + 每格歸屬 + 主城 + 兵團 + 各項設定；
   地形由 seed 重建（同一個 seed 一定長出同一片大陸）。 */
const SAVE_SLOTS = 3;

function slotKey(n) { return 'territory_save_' + n; }

function bytesToB64(bytes) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(s);
}
function b64ToBytes(str) {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function slotInfo(n) {
  try {
    const raw = localStorage.getItem(slotKey(n));
    if (!raw) return '';
    const d = JSON.parse(raw);
    const dt = new Date(d.ts || 0);
    const p2 = function (v) { return v < 10 ? '0' + v : '' + v; };
    return '第 ' + (d.stage || 1) + ' 片 · ' + ((d.zones && d.zones.length) || 0) + ' 塊 · ' +
      p2(dt.getMonth() + 1) + '/' + p2(dt.getDate()) + ' ' + p2(dt.getHours()) + ':' + p2(dt.getMinutes());
  } catch (e) { return ''; }
}

function hasSave() {
  for (let i = 1; i <= SAVE_SLOTS; i++) if (slotInfo(i)) return true;
  return false;
}

function saveToSlot(n) {
  try {
    const b = G.board;
    const data = {
      v: 15,
      ts: Date.now(),
      seed: WORLD_SEED >>> 0,
      baseSeed: G.baseSeed >>> 0,
      stage: G.stage, unified: !!G.unified, diplo: !!G.diplo, wars: G.wars || {},
      t: G.t, zone: G.zone, kills: G.kills, aggression: G.aggression,
      armyCap: G.armyCap, buffOn: G.buffOn, rallyMode: G.rallyMode, rallyCount: G.rallyCount,
      draftPct: G.draftPct, draftCd: G.draftCd,
      popPaid: G.popPaid, popPaidBy: G.popPaidBy, grace: G.grace, warMode: G.warMode,
      home: G.home,
      garrisonPool: G.garrisonPool, rallyGarrison: !!G.rallyGarrison,
      autoNext: G.autoNext !== false, autoSave: G.autoSave !== false,
      draftRatio: G.draftRatio, armyFillCap: G.armyFillCap,
      nameIdx: G.nameIdx, waitingNext: !!G.waitingNext,
      uiLeft: !!G.uiLeft, uiRight: !!G.uiRight,
      owner: bytesToB64(new Uint8Array(b.owner.buffer.slice(0))),
      hp: bytesToB64(new Uint8Array(b.hp.buffer.slice(0))),
      zones: G.zones.map(function (z) {
        return {
          gx: z.gx, gy: z.gy, x0: z.x0, y0: z.y0, w: z.w, h: z.h,
          land: z.land, reveal: z.reveal, seed: z.seed,
          districts: z.districts.map(function (d) {
            /* cells 在遊戲裡可能是 typed array，JSON 會把它變成物件 → 一定要轉成真陣列 */
            return { id: d.id, cells: Array.from(d.cells), size: d.size, owner: d.owner, biome: d.biome };
          })
        };
      }),
      caps: G.caps.map(function (c) {
        return {
          lx: c.lx, ly: c.ly, x: c.x, y: c.y, i: c.i,
          owner: c.owner, prog: c.prog, surr: c.surr, biome: c.biome, pop: c.pop,
          name: c.name || '',
          zi: G.zones.indexOf(c.zone), did: c.district ? c.district.id : -1
        };
      }),
      rivals: G.rivals.map(function (r) {
        return { owner: r.owner, name: r.name, dead: !!r.dead, unified: !!r.unified };
      }),
      armies: G.armies.map(function (a) {
        return {
          owner: a.owner, x: a.x, y: a.y, men: a.men, speed: a.speed, brush: a.brush,
          garrison: !!a.garrison, rally: a.rally || 0, returning: !!a.returning,
          uid: a.uid, hi: a.home ? G.caps.indexOf(a.home) : -1
        };
      }),
      sel: G.player && G.player.sel ? G.player.sel.uid : 0,
      uidSeq: G.uidSeq
    };
    localStorage.setItem(slotKey(n), JSON.stringify(data));
    toast('已存到存檔 ' + n);
    return true;
  } catch (e) {
    toast('存檔失敗：' + ((e && e.message) || '空間不足'));
    return false;
  }
}

/* 依 seed 重建地形，再把存檔的歸屬與主城疊回去 */
function loadFromSlot(n) {
  let d = null;
  try {
    const raw = localStorage.getItem(slotKey(n));
    if (!raw) { toast('存檔 ' + n + ' 是空的'); return false; }
    d = JSON.parse(raw);
  } catch (e) {
    toast('存檔損毀');
    return false;
  }
  if (!d || d.v !== 15) { toast('存檔版本不符'); return false; }
  try {
    WORLD_SEED = d.seed >>> 0;
    G.baseSeed = d.baseSeed >>> 0;
    G.stage = d.stage || 1;
    G.unified = !!d.unified;
    G.diplo = !!d.diplo;
    G.wars = d.wars || {};

    buildWorld();                       // 重建 worldLand / zoneOpenGrid / biomes
    G.board = newBoard();
    const b = G.board;

    /* 1) 先把地形貼回去（只貼已開放的區塊），順便重畫地形畫布 */
    G.zones.length = 0;
    G.caps.length = 0;
    G.rivals.length = 0;
    G.armies.length = 0;
    for (const z of d.zones) {
      const zo = {
        gx: z.gx, gy: z.gy, x0: z.x0, y0: z.y0, w: z.w, h: z.h,
        land: z.land, open: true, reveal: z.reveal, seed: z.seed,
        districts: [], borders: null
      };
      G.zones.push(zo);
      zoneOpenGrid[zo.gy * WCOL + zo.gx] = 1;
      const img = terrainCtx.createImageData(zo.w, zo.h);
      const u32 = new Uint32Array(img.data.buffer);
      const tz = new Uint8Array(zo.w * zo.h);
      for (let y = 0; y < zo.h; y++) {
        for (let x = 0; x < zo.w; x++) {
          const wx = zo.x0 + x, wy = zo.y0 + y;
          const i = wy * WORLD_W + wx;
          const land = worldLand[i];
          b.terrain[i] = land ? 1 : 0;
          if (!land) continue;
          tz[y * zo.w + x] = 1;
          u32[y * zo.w + x] = terrainColorAt(wx, wy);
          b.growBox(wx, wy);
        }
      }
      terrainCtx.putImageData(img, zo.x0, zo.y0);
      buildZoneCoast(tz, { x0: zo.x0, y0: zo.y0 });   // 海岸線重繪
    }

    /* 2) 歸屬與耐久 */
    const ownerB = b64ToBytes(d.owner);
    b.owner.set(new Int8Array(ownerB.buffer, 0, b.n));
    const hpB = b64ToBytes(d.hp);
    if (hpB.length >= b.n * 4) b.hp.set(new Float32Array(hpB.buffer, 0, b.n));

    /* 3) 重算計數 */
    b.cnt.fill(0);
    b.landCount = 0;
    for (let i = 0; i < b.n; i++) {
      if (!b.terrain[i]) continue;
      b.landCount++;
      b.cnt[b.owner[i] + 1]++;
    }
    b.dirty = true;

    /* 4) 主城 → 地區 → 區塊（重建互相引用） */
    for (const c of d.caps) {
      G.caps.push({
        lx: c.lx, ly: c.ly, x: c.x, y: c.y, i: c.i,
        owner: c.owner, prog: c.prog || 0, surr: c.surr || 0,
        pulse: 0, flash: 0, checkT: 0, biome: c.biome,
        pop: c.pop, name: c.name || '', zone: null, district: null
      });
    }
    let capCursor = 0;
    for (const z of d.zones) {
      const zo = G.zones[d.zones.indexOf(z)];
      for (const dd of z.districts) {
        /* 依序配對：G.caps 的推入順序就是「區塊順序 → 地區順序」，
           跟存檔時存下來的順序一致，比用 id 比對可靠。 */
        const cap = G.caps[capCursor];
        const dist = { id: dd.id, cells: Array.from(dd.cells), size: dd.size, owner: dd.owner, biome: dd.biome, cap: cap };
        if (cap) { cap.district = dist; cap.zone = zo; }
        zo.districts.push(dist);
        capCursor++;
      }
    }

    /* 5) 國家與兵團 */
    for (const r of d.rivals) G.rivals.push({ owner: r.owner, name: r.name, dead: !!r.dead, unified: !!r.unified });
    for (const a of d.armies) {
      const u = new Unit(a.owner, a.x, a.y, a.speed || 6, a.brush || 3);
      u.kind = 'army';
      u.men = a.men;
      u.uid = a.uid;
      u.home = a.hi >= 0 ? (G.caps[a.hi] || null) : null;
      u.zone = u.home ? u.home.zone : null;
      u.out = false;
      u.retarget = 0;
      u.tx = a.x; u.ty = a.y;
      u.think = 0;
      u.goal = null;
      u.garrison = !!a.garrison;
      u.rally = a.rally || 0;
      u.returning = !!a.returning;
      G.armies.push(u);
    }
    G.uidSeq = d.uidSeq || (G.armies.length + 1);
    G.player = { sel: null };
    if (d.sel) G.player.sel = G.armies.find(function (x) { return x.uid === d.sel; }) || null;
    if (!G.player.sel && armyOf(0).length) G.player.sel = armyOf(0)[0];

    /* 6) 各種計數與設定 */
    G.t = d.t || 0;
    G.zone = d.zone || 1;
    G.kills = d.kills || 0;
    G.aggression = d.aggression || 'mid';
    G.armyCap = d.armyCap || 6;
    G.buffOn = d.buffOn !== false;
    G.rallyMode = d.rallyMode || 'near';
    G.rallyCount = d.rallyCount || 3;
    G.draftPct = d.draftPct || CFG.draftPct;
    G.draftCd = d.draftCd || 0;
    G.popPaid = d.popPaid || 0;
    G.popPaidBy = d.popPaidBy || {};
    G.grace = d.grace || 0;
    G.warMode = !!d.warMode;
    G.home = d.home || { gx: 0, gy: 0 };
    G.garrisonPool = d.garrisonPool || 0;
    G.rallyGarrison = !!d.rallyGarrison;
    G.autoNext = d.autoNext !== false;
    G.autoSave = d.autoSave !== false;
    G.draftRatio = d.draftRatio || 0.1;
    G.armyFillCap = d.armyFillCap || 3000;
    G.nameIdx = d.nameIdx || 0;
    G.waitingNext = !!d.waitingNext;
    G.uiLeft = !!d.uiLeft;
    G.uiRight = !!d.uiRight;
    G.pending = false;
    G.openDelay = 0;
    G.surge.t = 0;
    G.surge.cd = 0;
    G.suffocate = 0;
    G.rescueT = 0;
    G.popT = 0;
    G.parts.length = 0;
    G.newPlayerArmy = null;

    terrDirty = true;
    paintShadow();
    rebuildTerritory();
    rebuildOutlines();
    rivalSig = ''; capSig = ''; armySig = '';

    cam.cell = fitCell();
    const cu = controlledUnit();
    if (cu) { cam.x = cu.x; cam.y = cu.y; }
    cam.tx = cam.x; cam.ty = cam.y;
    cam.camPan = 0;

    hideOverlay();
    hudEl.classList.add('on');
    G.state = 'playing';
    updateHUD();
    toast('讀取存檔 ' + n + '　·　第 ' + G.stage + ' 片大陸');
    return true;
  } catch (e) {
    console.error(e);
    toast('讀取失敗：' + ((e && e.message) || '未知錯誤'));
    return false;
  }
}
