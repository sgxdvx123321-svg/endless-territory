<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>無盡領土 · Endless Territory</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#050a10;color:#dceaf2;
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none;
  }
  canvas#cv{position:fixed;inset:0;display:block}

  /* ───────── HUD ───────── */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease;z-index:5}
  #hud.on{opacity:1}
  .hud-row{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;gap:12px}
  .panel{
    background:rgba(7,15,22,.66);border:1px solid rgba(110,170,190,.13);border-radius:14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 34px rgba(0,0,0,.42);
  }
  .era-panel{padding:10px 15px 12px;min-width:224px}
  .era-line{display:flex;align-items:baseline;gap:7px}
  .era-line .lbl{font-size:11px;letter-spacing:.16em;color:#6f8b9d}
  .era-line .num{font-size:26px;font-weight:750;line-height:1;color:#eaf6fb;font-variant-numeric:tabular-nums}
  .era-line .of{font-size:11px;color:#5d7688;margin-left:auto}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:9px 0 7px}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#1fb89f,#2ee6c8);transition:width .18s linear;
    box-shadow:0 0 12px rgba(46,230,200,.55)}
  .era-sub{font-size:11.5px;color:#7f97a7;display:flex;gap:6px;align-items:center}
  .era-sub b{color:#cfeee7;font-weight:650;font-variant-numeric:tabular-nums}
  .mini-row{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.06);
    display:flex;justify-content:space-between;font-size:10.5px;color:#61798a;letter-spacing:.04em}
  .mini-row b{color:#9fc3cf;font-weight:650;font-variant-numeric:tabular-nums}

  /* v10 兵團清單 */
  .mini-row.army-row{cursor:pointer;pointer-events:auto;transition:color .15s}
  .mini-row.army-row:hover{color:#cfe3ec}
  .mini-row .caret{font-style:normal;opacity:.55;margin-left:5px;display:inline-block;transition:transform .18s}
  .mini-row.army-row.open .caret{transform:rotate(180deg)}
  .army-list{display:none;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);
    max-height:172px;overflow-y:auto;pointer-events:auto;overscroll-behavior:contain}
  .army-list.open{display:block}
  .army-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;cursor:pointer;
    font-size:11px;color:#93aab9;transition:background .14s,color .14s}
  .army-item:hover{background:rgba(255,255,255,.06);color:#d6e7ef}
  .army-item.on{background:rgba(46,230,200,.14);color:#b6fff2}
  .army-item .dot{width:7px;height:7px;border-radius:2px;flex:none;background:#2ee6c8}
  .army-item .nm{flex:1;white-space:nowrap}
  .army-item .men{font-variant-numeric:tabular-nums;font-weight:650;color:#cfe3ec}
  .army-item .tag{font-size:9px;padding:1px 5px;border-radius:99px;
    background:rgba(255,255,255,.07);color:#8ba3b2;flex:none}
  .army-item.empty{cursor:default;justify-content:center;color:#5c7686}
  .army-sec{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;
    color:#4f6674;padding:4px 4px 2px;border-top:1px solid rgba(255,255,255,.05);margin-top:4px}
  .army-sec:first-child{border-top:0;margin-top:0}
  .army-sec b{color:#8ba3b2;font-weight:650;font-variant-numeric:tabular-nums}
  .mini-act{background:rgba(46,230,200,.10);border:1px solid rgba(46,230,200,.28);
    color:#9ff2e4;font-size:9px;padding:1px 7px;border-radius:99px;cursor:pointer;
    font-family:inherit;letter-spacing:0}
  .mini-act:hover{background:rgba(46,230,200,.22);color:#d9fff8}

  .rivals{padding:8px;display:flex;flex-direction:column;gap:5px;min-width:214px}
  /* v22：整個面板要能吃滑鼠事件，否則列點不到、也不能捲動 */
  #rightPanel .panel-body{pointer-events:auto;max-height:calc(100vh - 150px);overflow-y:auto;
    scrollbar-width:thin;scrollbar-color:rgba(120,180,200,.35) transparent}
  #rightPanel .panel-body::-webkit-scrollbar{width:5px}
  #rightPanel .panel-body::-webkit-scrollbar-thumb{background:rgba(120,180,200,.26);border-radius:99px}
  .rival{display:flex;align-items:center;gap:8px;padding:4px 7px;border-radius:9px;transition:opacity .3s;flex-wrap:wrap}
  .rival.dead{opacity:.62}
  .rival-sec{font-size:9.5px;letter-spacing:.14em;color:#4a6274;margin:6px 0 2px;
    border-top:1px solid rgba(255,255,255,.07);padding-top:6px;display:flex;justify-content:space-between}
  .rival-sec b{color:#6b8496;font-weight:650}
  .rival{pointer-events:auto;cursor:pointer;border-radius:9px;padding:2px 4px;transition:background .15s}
  .rival:hover{background:rgba(120,190,210,.10)}
  .rival .rmeta{width:100%;padding-left:17px;font-size:10px;color:#6f8b9d;
    font-variant-numeric:tabular-nums;letter-spacing:.02em}
  /* v19 戰史 */
  .war-box{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.09);
    font-size:10px;color:#7d95a5;letter-spacing:.02em}
  .war-box .wb-h{font-size:9.5px;letter-spacing:.18em;color:#46606f;margin-bottom:4px}
  .war-box .wb-r{display:flex;justify-content:space-between;gap:8px;line-height:1.65}
  .war-box .wb-r b{color:#b9d3df;font-weight:650;font-variant-numeric:tabular-nums}
  .war-box .wb-r b.neg{color:#ff9b9b}
  .war-box .wb-r b.war{color:#ffc142}
  /* v20 叛亂按鈕（敵國欄底部） */
  .form-row{display:flex;flex-wrap:wrap;gap:4px;padding:4px 2px 6px}
  /* v31：編隊小視窗 */
  #legionPop{position:fixed;display:none;z-index:40;background:rgba(8,18,26,.96);
    border:1px solid rgba(46,230,200,.28);border-radius:11px;padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);flex-direction:column;gap:4px;min-width:104px}
  #legionPop.on{display:flex}
  #legionPop .lp-title{font-size:9px;letter-spacing:.14em;color:#5b7b8a;padding:0 2px 3px}
  .mini-act.on{background:rgba(46,230,200,.3);color:#e6fffb;border-color:rgba(46,230,200,.6)}
  .rebel-btn{width:100%;margin-top:8px;padding:5px 0;border-radius:9px;cursor:pointer;
    font-family:inherit;font-size:10.5px;letter-spacing:.14em;
    background:rgba(255,120,90,.12);border:1px solid rgba(255,120,90,.32);color:#ffb8a3;
    pointer-events:auto;transition:background .15s,color .15s}
  .rebel-btn:hover{background:rgba(255,120,90,.26);color:#ffd8c9}
  .rebel-btn.off{opacity:.38}
  .rival .dot{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 9px currentColor}
  .rival .rname{font-size:11.5px;color:#c3d7e2;width:70px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rival .rbar{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .rival .rbar i{display:block;height:100%;width:0%;border-radius:99px;transition:width .2s linear}
  .rival .rpct{font-size:11px;color:#8ea6b5;width:34px;text-align:right;flex:none;font-variant-numeric:tabular-nums}

  .hud-bottom{
    position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;
    gap:16px;padding:0 16px 14px;font-size:11.5px;color:#6d8697
  }
  kbd{
    display:inline-block;min-width:19px;padding:2px 5px;margin:0 1px;border-radius:5px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
    font-family:inherit;font-size:10.5px;color:#a9c1cf;text-align:center
  }
  .agg-chip{padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);color:#8ba3b2}
  .agg-chip b{color:#ffc142;font-weight:700;margin-left:3px}
  /* v15 面板收納 */
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:-2px 0 6px;pointer-events:auto}
  .panel-head .ph-title{font-size:9.5px;letter-spacing:.18em;color:#46606f}
  .fold{background:none;border:0;color:#6f8b9d;cursor:pointer;font-size:12px;line-height:1;
    padding:2px 4px;border-radius:5px;font-family:inherit}
  .fold:hover{color:#cfe3ec;background:rgba(255,255,255,.06)}
  .panel.folded{padding:6px 10px}
  .panel.folded .panel-body{display:none}
  .panel.folded .panel-head{margin:0}
  .disband{margin-left:2px;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.3);
    color:#ffb3b3;font-size:9.5px;padding:1px 6px;border-radius:99px;cursor:pointer;
    font-family:inherit;flex:none}
  .disband:hover{background:rgba(255,90,90,.25);color:#ffdada}
  /* v14 外交 */
  .agg-chip.clickable{pointer-events:auto;cursor:pointer;transition:background .15s,color .15s}
  .agg-chip.clickable:hover{background:rgba(46,230,200,.14);color:#b6fff2}
  .dip-row{display:flex;align-items:center;gap:8px;margin:7px 0;padding:6px 8px;border-radius:10px;
    background:rgba(255,255,255,.035);text-align:left}
  .dip-row .dot{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 9px currentColor}
  .dip-row .nm{flex:1;font-size:12px;color:#c3d7e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dip-row .st{font-size:10.5px;color:#5fd6b0;flex:none}
  .dip-row .st.war{color:#ff8b8b}
  .ghost.mini{width:auto;padding:5px 12px;margin:0;font-size:11.5px;border-radius:9px;flex:none}
  .ghost.mini[disabled]{opacity:.35;cursor:not-allowed}
  .surge-chip{display:flex;align-items:center;gap:6px}
  .surge-bar{display:inline-block;width:52px;height:4px;border-radius:9px;
    background:rgba(255,255,255,.08);overflow:hidden;vertical-align:middle}
  .surge-bar b{display:block;height:100%;width:100%;border-radius:9px;
    background:linear-gradient(90deg,#1fb9a4,#6bffe4);transition:width .08s linear}
  .surge-chip.hot .surge-bar b{background:linear-gradient(90deg,#e8fffb,#7bffe8);
    box-shadow:0 0 8px rgba(110,255,230,.85)}

  /* ───────── Overlay ───────── */
  #overlay{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(ellipse at 50% 38%,rgba(10,26,38,.72),rgba(3,7,11,.93) 70%);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .32s ease;
  }
  #overlay.on{opacity:1;pointer-events:auto}
  .card{
    width:min(476px,100%);background:rgba(8,17,25,.86);border:1px solid rgba(110,180,200,.16);
    border-radius:22px;padding:26px 28px 22px;text-align:center;
    box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
    animation:pop .34s cubic-bezier(.2,1.2,.4,1) both;
    /* 設定項目變多之後，小視窗會超出畫面 → 卡片自己捲動 */
    max-height:calc(100vh - 48px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(120,180,200,.35) transparent;
  }
  .card::-webkit-scrollbar{width:6px}
  .card::-webkit-scrollbar-thumb{background:rgba(120,180,200,.28);border-radius:99px}
  @keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .eyebrow{font-size:10px;letter-spacing:.34em;color:#3f6473;margin-bottom:10px;font-weight:600}
  h1{font-size:34px;font-weight:800;letter-spacing:.03em;margin-bottom:12px;
    background:linear-gradient(180deg,#f2fffc,#7fe8d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card p.lead{font-size:13.5px;line-height:1.78;color:#93aab9;margin-bottom:20px}
  .card p.lead b{color:#d8f4ee;font-weight:650}
  .agg-title{font-size:11.5px;color:#7e97a8;letter-spacing:.08em;margin-bottom:9px}
  .seg{display:flex;gap:6px;justify-content:center;margin-bottom:9px}
  .capnum{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}
  .capnum input{width:78px;padding:9px 10px;border-radius:10px;border:1px solid rgba(120,220,210,.26);
    background:rgba(10,26,32,.7);color:#e6fffb;font:600 15px ui-sans-serif,system-ui,sans-serif;
    text-align:center;outline:none}
  .capnum input:focus{border-color:rgba(70,235,208,.7);box-shadow:0 0 0 3px rgba(70,235,208,.14)}
  .capnum span{font-size:11.5px;color:#7e97a8}
  .seg button{
    flex:1;padding:9px 0;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);color:#8ba3b2;
    transition:all .16s ease;
  }
  .seg button:hover{background:rgba(255,255,255,.08);color:#cfe3ec}
  .seg button.on{
    background:rgba(46,230,200,.14);border-color:rgba(46,230,200,.5);color:#b6fff2;
    box-shadow:0 0 18px rgba(46,230,200,.16),inset 0 0 12px rgba(46,230,200,.08)
  }
  .agg-note{font-size:10.5px;color:#5c7686;margin-bottom:20px;line-height:1.6}
  .primary{
    width:100%;padding:13px 0;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:700;letter-spacing:.06em;color:#04241f;
    background:linear-gradient(180deg,#4df0d6,#1fc9ae);border:none;
    box-shadow:0 8px 26px rgba(46,230,200,.28);transition:transform .12s ease,box-shadow .16s ease;
  }
  .primary:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(46,230,200,.4)}
  .primary:active{transform:translateY(0) scale(.99)}
  .ghost{
    width:100%;padding:11px 0;margin-top:9px;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:13px;color:#9db4c2;background:transparent;border:1px solid rgba(255,255,255,.1);
    transition:all .16s ease;
  }
  .ghost:hover{background:rgba(255,255,255,.05);color:#d6e7ef}
  .foot{margin-top:16px;font-size:10.5px;color:#4f6674;letter-spacing:.04em}
  .stat-row{display:flex;gap:10px;margin:18px 0 22px}
  .stat{flex:1;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
    border-radius:12px;padding:11px 8px}
  .stat .k{font-size:10px;color:#6a8496;letter-spacing:.1em;margin-bottom:5px}
  .stat .v{font-size:19px;font-weight:750;color:#e6f5fa;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;font-weight:500;color:#7e97a8;margin-left:2px}

  #toast{
    position:fixed;left:50%;bottom:76px;transform:translate(-50%,10px);z-index:15;
    padding:9px 18px;border-radius:99px;background:rgba(8,18,26,.9);
    border:1px solid rgba(120,180,200,.16);font-size:12.5px;color:#cfe6ef;
    opacity:0;pointer-events:none;transition:all .3s ease;white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .card{padding:24px 20px 18px}
    h1{font-size:27px}
    .rivals{min-width:0}
    .hud-bottom{display:none}
  }
html[lang="en"] .hud-bottom{font-size:10px;gap:6px;letter-spacing:0}
html[lang="en"] .hud-bottom kbd{min-width:auto!important;padding:0 4px}
html[lang="en"] #hud .k,html[lang="en"] #rivals .k{letter-spacing:0}
html[lang="en"] #hud .row{gap:6px}
html[lang="en"] .agg-note{letter-spacing:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-row">
    <div class="panel era-panel" id="leftPanel">
      <div class="panel-head"><span class="ph-title">狀態</span><button class="fold" data-fold="left">▾</button></div>
      <div class="panel-body">
      <div class="era-line"><span class="lbl">區塊</span><span class="num" id="zoneNum">1</span><span class="of" id="zoneSize">28 × 19</span></div>
      <div class="bar"><i id="ownBar"></i></div>
      <div class="era-sub"><b id="ownPct">0%</b> 已佔領<span style="opacity:.4">·</span>剩 <b id="leftCells">0</b> 格</div>
      <div class="mini-row"><span>已開放 <b id="zoneCount">1</b> 塊</span><span>縮放 <b id="zoomPct">100%</b></span></div>
      <div class="mini-row"><span>主城 <b id="capCount">0 / 0</b></span><span>地區 <b id="distCount">0</b></span></div>
      <div class="mini-row"><span>人口 <b id="popCount">0</b></span><span>兵力 野/守 <b id="menCount">0</b></span></div>
        <div class="mini-row"><span>城內野戰 <b id="storeCount">0</b> 座</span><span>儲備 <b id="storeMen">0</b></span></div>
      <div class="mini-row army-row" id="armyToggle">
        <span>兵團 <b id="armyCount">0</b></span><span>守軍 <b id="garCount">0</b><i class="caret">▾</i></span>
      </div>
      <div class="army-list" id="armyRows"></div>
      </div>
    </div>
    <div class="panel rivals" id="rightPanel">
      <div class="panel-head"><span class="ph-title">國際關係</span><button class="fold" data-fold="right">▾</button></div>
      <div class="panel-body"><div id="rivals"></div>
        <div class="rel-actions">
          <button class="mini-act" data-allpeace="1">一鍵全和平</button>
          <button class="mini-act" data-allwar="1">一鍵全宣戰</button>
        </div>
        <div class="war-box" id="warBox"></div>
        <button class="rebel-btn" id="rebelBtn" data-rebel="1">叛亂</button>
      </div>
    </div>
  </div>
  <div class="hud-bottom">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</div>
    <div class="surge-chip"><kbd style="min-width:56px">SPACE</kbd> 衝鋒 <i class="surge-bar"><b id="surgeFill"></b></i></div>
    <div><kbd>Q</kbd> 切換兵團</div>
    <div><kbd>O</kbd> 集結</div>
    <div><kbd>P</kbd> 歸位</div>
    <div class="agg-chip" id="draftChip">M 征召 <b id="draftCd">就緒</b></div>
    <div class="agg-chip clickable" id="dipChip" style="display:none">外交</div>
    <div class="agg-chip clickable" id="nextChip" style="display:none">開啟下一輪</div>
    <div><kbd>滾輪</kbd> 縮放</div>
    <div class="agg-chip" id="warChip" style="display:none">戰役模式</div>
    <div class="agg-chip">AI 對你 <b id="aggLabel">中</b></div>
    <div class="agg-chip">敵勢 <b id="powMul">×1.0</b></div>
    <div><kbd>ESC</kbd> 暫停</div>
  </div>
</div>

<div id="overlay"></div>
<div id="legionPop"></div>
<div id="toast"></div>

<script>
(function () {
'use strict';

/* ═══════════════════════════ 常數 ═══════════════════════════ */
const TAU = Math.PI * 2;
const HP_MAX = 1.5;
const DMG = 11.5;
const NEUTRAL = -1;

/* 世界由「區塊」拼成：每塊 28×19 格，相鄰的區塊之間靠十字走廊連通 */
const ZW = 24, ZH = 16;
const WCOL = 12, WROW = 9;   // v21：放大世界，讓可開區塊數達到 60
const WORLD_W = ZW * WCOL;
const WORLD_H = ZH * WROW;
const LAT_X0 = 0, LAT_Y0 = 0;   // 區塊格線直接鋪滿整個世界
let WORLD_SEED = 20261112;
let worldLand = null;       // 整張世界的地形（只留最大陸塊）
let zoneLandCnt = null;     // 每個格子有多少陸地
let zoneOpenGrid = null;    // 每個格子是否已開放
let LAKE_PTS = [];          // 內陸湖中心，開局優先在湖邊

const CFG = {
  landRatio: 0.56,
  rimWarp: 0.34,
  playerSpeed: 7.4,
  aiSpeedBase: 5.55,
  aiSpeedPerZone: 0.10,
  aiSpeedMax: 7.05,

let worldBiome = null;

function biomeAt(wx, wy) {
  if (!worldBiome) return 0;
  const x = wx | 0, y = wy | 0;
  if (x < 0 || y < 0 || x >= WORLD_W || y >= WORLD_H) return 0;
  return worldBiome[y * WORLD_W + x];
}
function biomeOf(wx, wy) { return BIOMES[biomeAt(wx, wy)]; }

function buildBiomes() {
  const n = WORLD_W * WORLD_H;
  worldBiome = new Uint8Array(n);
  const cnt = [0, 0, 0, 0];
  for (let y = 0; y < WORLD_H; y++) {
    for (let x = 0; x < WORLD_W; x++) {
      const temp = fbm(x * 0.021 + 31, y * 0.021 + 7, WORLD_SEED + 101, 3);
      const moist = fbm(x * 0.024 + 5, y * 0.024 + 41, WORLD_SEED + 211, 3);
      let bi = 0;
      if (temp < 0.42) bi = 1;                       // 冷 → 雪原
      else if (temp > 0.60 && moist < 0.47) bi = 2;  // 熱乾 → 沙漠
      else if (moist > 0.55) bi = 3;                 // 濕 → 雨林
      worldBiome[y * WORLD_W + x] = bi;
      if (worldLand && worldLand[y * WORLD_W + x]) cnt[bi]++;
    }
  }
  /* 保險：整張大陸至少要有兩種地質，不然整局都同一種長相 */
  let kinds = 0;
  for (let i = 0; i < 4; i++) if (cnt[i] > WORLD_W * WORLD_H * 0.02) kinds++;
  if (kinds < 2) {
    const alt = (cnt[0] >= cnt[1]) ? 2 : 3;
    for (let y = 0; y < WORLD_H; y++) {
      for (let x = 0; x < WORLD_W; x++) {
        if (hash2i(x, y, 91) < 0.45) worldBiome[y * WORLD_W + x] = alt;
      }
    }
  }
}

/* ═══════════════════════════ 小工具 ═══════════════════════════ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

function hash2i(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 144665);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2i(xi, yi, s),     b = hash2i(xi + 1, yi, s);
  const c = hash2i(xi, yi + 1, s), d = hash2i(xi + 1, yi + 1, s);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y, s, oct) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * vnoise(x * freq, y * freq, s + i * 37);
    norm += amp;
    amp *= 0.5;
    freq *= 2.07;
  }
  return sum / norm;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function packRGBA(r, g, b, a) {
  return ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
}

/* ═══════════════════════════ 世界棋盤 ═══════════════════════════ */
class Board {
  constructor(w, h) {
    this.w = w;
    this.h = h;
    this.n = w * h;
    this.terrain = new Uint8Array(this.n);
    this.owner = new Int8Array(this.n).fill(NEUTRAL);
    this.hp = new Float32Array(this.n);
    this.stamp = new Int32Array(this.n);
    this.stampId = 0;
    this.lock = new Float32Array(this.n);
    this.time = 0;
    this.cnt = new Int32Array(24);   // v21：owner 最多 15，cnt 需要 owner+1 的空間
    this.landCount = 0;
    this.dirty = true;
    this.boxX0 = w; this.boxY0 = h; this.boxX1 = 0; this.boxY1 = 0;
    this.boxDirty = true;
  }
  isLand(x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return false;
    return this.terrain[y * this.w + x] === 1;
  }
  idx(x, y) { return y * this.w + x; }
  setOwner(i, o) {
    const p = this.owner[i];
    if (p === o) return;
    this.cnt[p + 1]--;
    this.cnt[o + 1]++;
    this.owner[i] = o;
    this.dirty = true;
  }
  growBox(x, y) {
    if (x < this.boxX0) { this.boxX0 = x; this.boxDirty = true; }
    if (y < this.boxY0) { this.boxY0 = y; this.boxDirty = true; }
    if (x > this.boxX1) { this.boxX1 = x; this.boxDirty = true; }
    if (y > this.boxY1) { this.boxY1 = y; this.boxDirty = true; }
  }
}

/* ═══════════ 世界地形 ═══════════
   整張世界一次生成，區塊只是「揭露範圍」。
   這樣相鄰區塊的海岸線會自然接起來，不會每塊都是一座被海包住的孤島。 */
function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

/* 大陸遮罩：世界中心幾乎一定是陸地，海只出現在最外圍。
   內陸再用低頻雜訊長出高地/低地，讓同一塊大陸有顏色層次。 */
function worldScore(wx, wy) {
  const nx = (wx - WORLD_W * 0.5) / (WORLD_W * 0.52);
  const ny = (wy - WORLD_H * 0.5) / (WORLD_H * 0.56);
  const rad = Math.sqrt(nx * nx + ny * ny);
  const warp = (fbm(wx * 0.030 + 3.7, wy * 0.030 + 9.1, WORLD_SEED + 17, 3) - 0.5) * CFG.rimWarp;
  const mask = 1 - smoothstep(0.58, 1.02, rad + warp);
  let h = fbm(wx * 0.075 + 11.0, wy * 0.075 + 5.0, WORLD_SEED, 4) * 0.55
        + fbm(wx * 0.19 + 2.0, wy * 0.19 + 13.0, WORLD_SEED + 31, 3) * 0.20
        + (fbm(wx * 0.045 + 7.0, wy * 0.045 + 21.0, WORLD_SEED + 61, 3) - 0.5) * 0.26;
  h = clamp((h - 0.46) * 2.2 + 0.5, 0, 1);      // 拉開對比，內陸才長得出海灣
  return h * 0.58 + mask * 0.42;
}

/* 只保留最大陸塊：其他零碎小島一律沉回海裡，不會出現走不到的島 */
function largestComponent(land) {
  const n = land.length;
  const comp = new Int32Array(n).fill(-1);
  const q = new Int32Array(n);
  let best = -1, bestSize = 0, id = 0;
  for (let i = 0; i < n; i++) {
    if (!land[i] || comp[i] >= 0) continue;
    let qh = 0, qt = 0, size = 0;
    q[qt++] = i; comp[i] = id;
    while (qh < qt) {
      const k = q[qh++]; size++;
      const x = k % WORLD_W, y = (k / WORLD_W) | 0;
      if (x > 0) { const j = k - 1; if (land[j] && comp[j] < 0) { comp[j] = id; q[qt++] = j; } }
      if (x < WORLD_W - 1) { const j = k + 1; if (land[j] && comp[j] < 0) { comp[j] = id; q[qt++] = j; } }
      if (y > 0) { const j = k - WORLD_W; if (land[j] && comp[j] < 0) { comp[j] = id; q[qt++] = j; } }
      if (y < WORLD_H - 1) { const j = k + WORLD_W; if (land[j] && comp[j] < 0) { comp[j] = id; q[qt++] = j; } }
    }
    if (size > bestSize) { bestSize = size; best = id; }
    id++;
  }
  return { comp: comp, id: best, size: bestSize };
}

function keepLargest(land) {
  const r = largestComponent(land);
  for (let i = 0; i < land.length; i++) if (land[i] && r.comp[i] !== r.id) land[i] = 0;
  return r.size;
}

/* 內陸湖：1~2 個，位置與形狀每次不同；挖完檢查大陸有沒有被切成兩半 */
function carveLakes(land, size0) {
  LAKE_PTS = [];
  const count = hash2i(WORLD_SEED, 3, 29) < 0.55 ? 2 : 1;
  let size = size0;
  for (let li = 0; li < count; li++) {
    for (let attempt = 0; attempt < 7; attempt++) {
      const cx = WORLD_W * (0.30 + hash2i(WORLD_SEED, li * 7 + attempt * 3 + 1, 11) * 0.40);
      const cy = WORLD_H * (0.28 + hash2i(WORLD_SEED, li * 7 + attempt * 3 + 2, 13) * 0.44);
      const rx = 5 + hash2i(WORLD_SEED, li * 7 + attempt * 3 + 3, 17) * 6;
      const ry = 3.5 + hash2i(WORLD_SEED, li * 7 + attempt * 3 + 4, 19) * 4;
      const nx = (cx - WORLD_W * 0.5) / (WORLD_W * 0.52);
      const ny = (cy - WORLD_H * 0.5) / (WORLD_H * 0.56);
      if (Math.sqrt(nx * nx + ny * ny) > 0.55) continue;   // 太靠邊就不挖，避免挖穿海岸
      const back = Uint8Array.from(land);
      let carved = 0;
      for (let y = Math.floor(cy - ry - 2); y <= Math.ceil(cy + ry + 2); y++) {
        for (let x = Math.floor(cx - rx - 2); x <= Math.ceil(cx + rx + 2); x++) {
          if (x < 1 || y < 1 || x >= WORLD_W - 1 || y >= WORLD_H - 1) continue;
          const dx = (x - cx) / rx, dy = (y - cy) / ry;
          const wob = (fbm(x * 0.25 + li * 31, y * 0.25 + li * 17, WORLD_SEED + 71, 2) - 0.5) * 0.55;
          if (dx * dx + dy * dy + wob > 1) continue;
          const i = y * WORLD_W + x;
          if (land[i]) carved++;
          land[i] = 0;
        }
      }
      if (!carved) { land.set(back); continue; }
      const after = keepLargest(land);
      if (after < size * 0.90) { land.set(back); continue; }   // 切斷大陸就換個位置重挖
      size = after;
      LAKE_PTS.push({ x: cx, y: cy, r: Math.max(rx, ry) });
      break;
    }
  }
  return size;
}

/* 接縫補強：只在「本來就有陸地」的接縫上把它加寬成 5~6 格，
   海面上的接縫一律不動，免得海裡長出一格一格的人工堤防 */
function sealSeam(land, sx, sy, vertical) {
  const len = vertical ? ZH : ZW;
  const need = 6;
  const at = function (k) { return vertical ? (sy + k) * WORLD_W + sx : sy * WORLD_W + (sx + k); };
  let cnt = 0, first = -1;
  for (let k = 0; k < len; k++) if (land[at(k)]) { cnt++; if (first < 0) first = k; }
  if (cnt === 0 || cnt >= need) return;
  const mid = first >= 0 ? first : (len >> 1);
  for (let d = -1; d <= 3; d++) {
    const k = clamp(mid + d, 1, len - 2);
    land[at(k)] = 1;
    if (vertical) { if (at(k) > 0) land[at(k) - 1] = 1; if (at(k) + 1 < land.length) land[at(k) + 1] = 1; }
    else { if (at(k) - WORLD_W >= 0) land[at(k) - WORLD_W] = 1; if (at(k) + WORLD_W < land.length) land[at(k) + WORLD_W] = 1; }
  }
}

function buildWorld() {
  const n = WORLD_W * WORLD_H;
  const score = new Float32Array(n);
  for (let wy = 0; wy < WORLD_H; wy++) {
    for (let wx = 0; wx < WORLD_W; wx++) score[wy * WORLD_W + wx] = worldScore(wx, wy);
  }
  const sorted = Float32Array.from(score).sort();
  const thr = sorted[Math.floor(n * (1 - CFG.landRatio))];
  const land = new Uint8Array(n);
  for (let i = 0; i < n; i++) land[i] = score[i] > thr ? 1 : 0;

  let size = keepLargest(land);
  size = carveLakes(land, size);

  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      if (gx + 1 < WCOL) sealSeam(land, (gx + 1) * ZW, gy * ZH, true);
      if (gy + 1 < WROW) sealSeam(land, gx * ZW, (gy + 1) * ZH, false);
    }
  }
  keepLargest(land);

  worldLand = land;
  zoneLandCnt = new Int32Array(WCOL * WROW);
  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      let c = 0;
      for (let y = 0; y < ZH; y++) {
        for (let x = 0; x < ZW; x++) if (land[(gy * ZH + y) * WORLD_W + (gx * ZW + x)]) c++;
      }
      zoneLandCnt[gy * WCOL + gx] = c;
    }
  }
  buildBiomes();
  zoneOpenGrid = new Uint8Array(WCOL * WROW);
  paintShadow();
}

function paintShadow() {
  if (!shadowCv) {
    shadowCv = document.createElement('canvas');
    shadowCv.width = WORLD_W;
    shadowCv.height = WORLD_H;
  }
  const c = shadowCv.getContext('2d');
  c.clearRect(0, 0, WORLD_W, WORLD_H);
  const n = WORLD_W * WORLD_H;
  const img = c.createImageData(WORLD_W, WORLD_H);
  const u32 = new Uint32Array(img.data.buffer);

  /* 距離場：從已開放的區塊往外擴散，越遠越暗。
     這樣「已探索 / 未探索」的邊界是漸層，不會是一刀切的直線。 */
  const dist = new Int16Array(n).fill(99);
  const q = new Int32Array(n);
  let qh = 0, qt = 0;
  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      if (!zoneOpenGrid[gy * WCOL + gx]) continue;
      for (let y = 0; y < ZH; y++) {
        for (let x = 0; x < ZW; x++) {
          const i = (gy * ZH + y) * WORLD_W + (gx * ZW + x);
          if (dist[i] === 0) continue;
          dist[i] = 0; q[qt++] = i;
        }
      }
    }
  }
  while (qh < qt) {
    const i = q[qh++];
    const d = dist[i] + 1;
    if (d > 12) continue;
    const x = i % WORLD_W, y = (i / WORLD_W) | 0;
    if (x > 0 && dist[i - 1] > d) { dist[i - 1] = d; q[qt++] = i - 1; }
    if (x < WORLD_W - 1 && dist[i + 1] > d) { dist[i + 1] = d; q[qt++] = i + 1; }
    if (y > 0 && dist[i - WORLD_W] > d) { dist[i - WORLD_W] = d; q[qt++] = i - WORLD_W; }
    if (y < WORLD_H - 1 && dist[i + WORLD_W] > d) { dist[i + WORLD_W] = d; q[qt++] = i + WORLD_W; }
  }

  for (let i = 0; i < n; i++) {
    if (!worldLand[i]) continue;
    const d = dist[i];
    if (d <= 1) continue;
    const a = Math.min(146, (d - 1) * 15);
    if (a > 3) u32[i] = packRGBA(14, 32, 42, a);
  }
  c.putImageData(img, 0, 0);
}

/* 這格是「已經看得到的陸地」嗎：未開放的區塊要當成海，邊界才會長出沙灘 */
function knownLand(wx, wy) {
  if (wx < 0 || wy < 0 || wx >= WORLD_W || wy >= WORLD_H) return false;
  if (!worldLand[wy * WORLD_W + wx]) return false;
  return zoneOpenGrid[((wy / ZH) | 0) * WCOL + ((wx / ZW) | 0)] === 1;
}

function zoneLandOf(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= WCOL || gy >= WROW) return 0;
  return zoneLandCnt[gy * WCOL + gx];
}

/* 起始區塊：從世界中央附近挑陸地最多的那塊 */
function pickStartZone() {
  const cx = WCOL >> 1, cy = WROW >> 1;
  let best = { gx: cx, gy: cy }, bestD = 1e9;
  /* 優先在湖邊開局：第一眼就看得到水，不是一整片單調的實心陸地 */
  for (const lp of LAKE_PTS) {
    const gx = clamp(Math.floor(lp.x / ZW), 0, WCOL - 1);
    const gy = clamp(Math.floor(lp.y / ZH), 0, WROW - 1);
    if (zoneLandOf(gx, gy) >= 150) return { gx: gx, gy: gy };
  }
  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      if (Math.max(Math.abs(gx - cx), Math.abs(gy - cy)) > 1) continue;
      const l = zoneLandOf(gx, gy);
      if (l < 150) continue;                       // 太小的不適合當起點
      const d = Math.abs(l - 380);                 // 目標：約 380 格，節奏剛好
      if (d < bestD) { bestD = d; best = { gx: gx, gy: gy }; }
    }
  }
  return best;
}

/* ═══════════════════════════ 區塊 ═══════════════════════════ */
function zoneRect(gx, gy) {
  return { x0: LAT_X0 + gx * ZW, y0: LAT_Y0 + gy * ZH, w: ZW, h: ZH };
}

function zoneAt(gx, gy) {
  for (const z of G.zones) if (z.gx === gx && z.gy === gy) return z;
  return null;
}

/* 以起始區塊為圓心，一圈一圈往外開：先內圈、再外圈，
   同一個圈裡按角度繞（順時針），而且一定要跟已開放的區塊接得到 */
function seamPassable(sx, sy, vertical) {
  const len = vertical ? ZH : ZW;
  let pairs = 0;
  for (let k = 0; k < len; k++) {
    const wx = vertical ? sx : sx + k;
    const wy = vertical ? sy + k : sy;
    const a = worldLand[wy * WORLD_W + wx];
    const bx = vertical ? wx - 1 : wx;
    const by = vertical ? wy : wy - 1;
    const b2 = (bx >= 0 && by >= 0 && bx < WORLD_W && by < WORLD_H) ? worldLand[by * WORLD_W + bx] : 0;
    if (a && b2) pairs++;
  }
  return pairs;
}

function openNextZone() {
  const home = G.home || { gx: WCOL >> 1, gy: WROW >> 1 };
  const cand = [];
  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      if (zoneOpenGrid[gy * WCOL + gx]) continue;                 // 已開
      if (zoneLandOf(gx, gy) < 170) continue;                     // 幾乎全是海，不開放
      let passable = 0, nb = 0;
      if (gx > 0 && zoneOpenGrid[gy * WCOL + gx - 1]) { nb++; passable += seamPassable(gx * ZW, gy * ZH, true); }
      if (gx < WCOL - 1 && zoneOpenGrid[gy * WCOL + gx + 1]) { nb++; passable += seamPassable((gx + 1) * ZW, gy * ZH, true); }
      if (gy > 0 && zoneOpenGrid[(gy - 1) * WCOL + gx]) { nb++; passable += seamPassable(gx * ZW, gy * ZH, false); }
      if (gy < WROW - 1 && zoneOpenGrid[(gy + 1) * WCOL + gx]) { nb++; passable += seamPassable(gx * ZW, (gy + 1) * ZH, false); }
      if (!nb || passable < 2) continue;                          // 接不到就不要開
      const ring = Math.max(Math.abs(gx - home.gx), Math.abs(gy - home.gy));
      const ang = Math.atan2(gy - home.gy, gx - home.gx);
      cand.push({ gx: gx, gy: gy, ring: ring, ang: ang, nb: nb, passable: passable });
    }
  }
  if (!cand.length) return false;
  cand.sort(function (a, c) {
    if (a.ring !== c.ring) return a.ring - c.ring;          // 先開內圈
    if (a.ang !== c.ang) return a.ang - c.ang;              // 同一圈按角度繞
    if (c.passable !== a.passable) return c.passable - a.passable;   // 接口寬的先開
    return c.nb - a.nb;
  });
  openZone(cand[0].gx, cand[0].gy);
  return true;
}

function localLand(t, lx, ly, r, b) {
  if (lx >= 0 && ly >= 0 && lx < ZW && ly < ZH) return t[ly * ZW + lx] === 1;
  return b.isLand(r.x0 + lx, r.y0 + ly);
}

function terrainColorAt(wx, wy) {
  const n = clamp((fbm(wx * 0.13 + 17, wy * 0.13 + 9, WORLD_SEED + 5, 3) - 0.28) / 0.44, 0, 1);
  const m = clamp((fbm(wx * 0.31 + 5, wy * 0.31 + 21, WORLD_SEED + 41, 2) - 0.34) / 0.4, 0, 1);
  const P = BIOMES[biomeAt(wx, wy)];
  let cr, cg, cb;
  if (n < 0.45) {
    const k = n / 0.45;
    cr = lerp(P.low[0], P.mid[0], k);
    cg = lerp(P.low[1], P.mid[1], k);
    cb = lerp(P.low[2], P.mid[2], k);
  } else {
    const k = (n - 0.45) / 0.55;
    cr = lerp(P.mid[0], P.hi[0], k);
    cg = lerp(P.mid[1], P.hi[1], k);
    cb = lerp(P.mid[2], P.hi[2], k);
  }
  cr = lerp(cr, cr * 0.82, m * 0.55);
  cg = lerp(cg, cg * 0.92, m * 0.55);
  cb = lerp(cb, cb * 0.78, m * 0.55);
  let seaSides = 0;
  if (!knownLand(wx - 1, wy)) seaSides++;
  if (!knownLand(wx + 1, wy)) seaSides++;
  if (!knownLand(wx, wy - 1)) seaSides++;
  if (!knownLand(wx, wy + 1)) seaSides++;
  if (seaSides > 0) {
    const k = Math.min(1, seaSides / 3) * 0.55;
    cr = lerp(cr, 226, k); cg = lerp(cg, 208, k); cb = lerp(cb, 162, k);
  }
  const shade = 0.97 + hash2i(wx, wy, 7) * 0.06;
  return packRGBA(
    clamp(cr * shade, 0, 255) | 0,
    clamp(cg * shade, 0, 255) | 0,
    clamp(cb * shade, 0, 255) | 0, 255);
}

/* 可達性保險：矩形揭露可能把新區塊裡的一小撮陸地切成孤島，玩家走不到就永遠清不完。
   遇到這種情況，就從最近的已可達格鑿一條 2 格寬的陸橋過去（天然地峽的長相），
   而不是把地刪掉 —— 刪掉會讓畫面出現莫名其妙的方塊空洞。 */
function connectUnreachable(t, r) {
  const b = G.board, W = b.w, H = b.h;
  const openCell = function (i) {
    const gx = ((i % W) / ZW) | 0, gy = (((i / W) | 0) / ZH) | 0;
    return zoneOpenGrid[gy * WCOL + gx] === 1;
  };
  let sx = -1, sy = -1;
  const u = controlledUnit() || armyOf(0)[0];
  if (u) { sx = clamp(Math.floor(u.x), 0, W - 1); sy = clamp(Math.floor(u.y), 0, H - 1); }
  else {
    let bestD = 1e9;
    for (let y = 0; y < ZH; y++) {
      for (let x = 0; x < ZW; x++) {
        if (!t[y * ZW + x]) continue;
        const d = (x - ZW / 2) * (x - ZW / 2) + (y - ZH / 2) * (y - ZH / 2);
        if (d < bestD) { bestD = d; sx = r.x0 + x; sy = r.y0 + y; }
      }
    }
  }
  if (sx < 0 || sy < 0 || !b.terrain[sy * W + sx]) return 0;
  const startIdx = sy * W + sx;

  const flood = function () {
    const seen = new Uint8Array(W * H);
    const q = new Int32Array(W * H);
    let qh = 0, qt = 0;
    seen[startIdx] = 1; q[qt++] = startIdx;
    while (qh < qt) {
      const i = q[qh++]; const x = i % W, y = (i / W) | 0;
      if (x > 0)     { const j = i - 1; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (x < W - 1) { const j = i + 1; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (y > 0)     { const j = i - W; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (y < H - 1) { const j = i + W; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
    }
    return seen;
  };

  let bridges = 0;
  for (let guard = 0; guard < 4; guard++) {
    const seen = flood();
    let bad = -1;
    for (let y = 0; y < ZH && bad < 0; y++) {
      for (let x = 0; x < ZW; x++) {
        if (!t[y * ZW + x]) continue;
        const wi = (r.y0 + y) * W + (r.x0 + x);
        if (!seen[wi]) { bad = wi; break; }
      }
    }
    if (bad < 0) break;

    /* 只在「已開放」的範圍裡找路，避免把陸橋鑿到還沒開放的區塊上 */
    const parent = new Int32Array(W * H).fill(-1);
    const dist = new Int16Array(W * H).fill(-1);
    const q = new Int32Array(W * H);
    let qh = 0, qt = 0;
    for (let i = 0; i < W * H; i++) if (seen[i]) { dist[i] = 0; q[qt++] = i; }
    let hit = -1;
    while (qh < qt && hit < 0) {
      const i = q[qh++];
      if (dist[i] >= 24) continue;
      const x = i % W, y = (i / W) | 0;
      const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
      for (const j of nb) {
        if (j < 0 || dist[j] >= 0 || !openCell(j)) continue;
        dist[j] = dist[i] + 1;
        parent[j] = i;
        q[qt++] = j;
        if (j === bad) { hit = j; break; }
      }
    }

    if (hit < 0) {
      /* 真的接不到（被未開放區塊隔開）：把那一小撮沉回海裡，至少不會卡死 */
      for (let y = 0; y < ZH; y++) {
        for (let x = 0; x < ZW; x++) {
          if (!t[y * ZW + x]) continue;
          const wi = (r.y0 + y) * W + (r.x0 + x);
          if (seen[wi]) continue;
          t[y * ZW + x] = 0;
          b.terrain[wi] = 0;
        }
      }
      break;
    }

    /* 沿著找到的路把海改成陸，並加寬成 2 格，看起來像天然地峽 */
    let cur = hit;
    const path = [];
    while (cur >= 0 && dist[cur] > 0) { path.push(cur); cur = parent[cur]; }
    for (const i of path) {
      const x = i % W, y = (i / W) | 0;
      const cells = [i];
      if (x < W - 1) cells.push(i + 1);
      for (const j of cells) {
        if (b.terrain[j]) continue;
        const zx = (j % W) - r.x0, zy = ((j / W) | 0) - r.y0;
        const inNew = zx >= 0 && zy >= 0 && zx < ZW && zy < ZH;
        b.terrain[j] = 1;
        if (inNew) {
          t[zy * ZW + zx] = 1;          // 這一格會被繪製流程一起算進 land
        } else {
          const zg = zoneAt(((j % W) / ZW) | 0, (((j / W) | 0) / ZH) | 0);
          if (!zg) { b.terrain[j] = 0; continue; }
          worldLand[j] = 1;
          b.landCount++;
          b.cnt[0]++;
          zg.land++;
          repaintCell(j % W, (j / W) | 0);
        }
      }
    }
    bridges++;
  }
  return bridges;
}

function repaintCell(wx, wy) {
  const img = terrainCtx.createImageData(1, 1);
  new Uint32Array(img.data.buffer)[0] = terrainColorAt(wx, wy);
  terrainCtx.putImageData(img, wx, wy);
}

function openZone(gx, gy, isHome) {
  const b = G.board;
  const r = zoneRect(gx, gy);
  const seed = (G.baseSeed + G.zones.length * 7919) | 0;
  /* 地形不再自己長，直接切世界地圖的一塊出來 */
  const t = new Uint8Array(ZW * ZH);
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) t[y * ZW + x] = worldLand[(r.y0 + y) * WORLD_W + (r.x0 + x)];
  }
  zoneOpenGrid[gy * WCOL + gx] = 1;
  /* 先寫進 board，可達性檢查才知道新陸地接不接得上 */
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      if (t[y * ZW + x]) b.terrain[(r.y0 + y) * WORLD_W + (r.x0 + x)] = 1;
    }
  }
  connectUnreachable(t, r);

  const img = terrainCtx.createImageData(ZW, ZH);
  const u32 = new Uint32Array(img.data.buffer);
  let land = 0;
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      const li = y * ZW + x;
      if (!t[li]) continue;
      land++;
      b.growBox(r.x0 + x, r.y0 + y);
      u32[li] = terrainColorAt(r.x0 + x, r.y0 + y);
    }
  }
  terrainCtx.putImageData(img, r.x0, r.y0);

  b.landCount += land;
  b.cnt[0] += land;

  const z = {
    gx, gy, x0: r.x0, y0: r.y0, w: ZW, h: ZH,
    land, open: true, reveal: 1, seed
  };
  G.zones.push(z);

  buildZoneCoast(t, r);
  paintShadow();
  terrDirty = true;

  buildDistricts(z, t);
  G.newPlayerArmy = null;
  assignOwners(z, isHome ? pickHomeDistrict(z) : -1);
  if (G.newPlayerArmy && G.player) { G.player.sel = G.newPlayerArmy; G.newPlayerArmy = null; }
  G.grace = CFG.enterGrace;
  const br = Math.min(4, 2 + Math.floor(G.zones.length / 4));
  for (const a of G.armies) if (a.owner === 0) a.brush = br;
  // 鏡頭只往新區塊偏過去一點，不要整個把玩家甩出畫面
  const u = G.player && G.player.sel;
  const tcx = r.x0 + ZW / 2, tcy = r.y0 + ZH / 2;
  if (u) camPanTo(lerp(u.x, tcx, 0.42), lerp(u.y, tcy, 0.42), 1.1);
  toast('新的領土浮現　·　第 ' + G.zones.length + ' 塊');
  if (!G.warMode && G.zones.length >= 4) {
    G.warMode = true;
    setTimeout(function () { toast('戰役模式　·　敵地只能從自己的領土往外推'); }, 1500);
    blip(220, 0.3, 0.05, 'sawtooth');
  }
  return z;
}

function buildZoneCoast(t, r) {
  const b = G.board;
  const p = new Path2D();
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      if (!t[y * ZW + x]) continue;
      const wx = r.x0 + x, wy = r.y0 + y;
      if (!b.isLand(wx, wy - 1)) { p.moveTo(wx, wy); p.lineTo(wx + 1, wy); }
      if (!b.isLand(wx, wy + 1)) { p.moveTo(wx, wy + 1); p.lineTo(wx + 1, wy + 1); }
      if (!b.isLand(wx - 1, wy)) { p.moveTo(wx, wy); p.lineTo(wx, wy + 1); }
      if (!b.isLand(wx + 1, wy)) { p.moveTo(wx + 1, wy); p.lineTo(wx + 1, wy + 1); }
    }
  }
  coastPath.addPath(p);
}

/* ═══════════════════════════ 單位 ═══════════════════════════ */
class Unit {
  constructor(owner, x, y, speed, brush) {
    this.owner = owner;
    this.x = x;
    this.y = y;
    this.fx = 0;
    this.fy = 1;
    this.speed = speed;
    this.brush = brush;
    this.alive = true;
    this.phase = Math.random() * TAU;
    this.stunned = false;
    this.breath = 0;
  }
}

function canStand(b, x, y, r) {
  return b.isLand(Math.floor(x - r), Math.floor(y)) &&
         b.isLand(Math.floor(x + r), Math.floor(y)) &&
         b.isLand(Math.floor(x), Math.floor(y - r)) &&
         b.isLand(Math.floor(x), Math.floor(y + r));
}

/* v15：兵團有體積，但**不再被推走**。
   把「推擠」改成「擋住」：移動時若目標點跟別的兵團距離 < UNIT_R 就不許通過。
   移動本身是分軸判定（先 X 再 Y），所以會自然沿著對方滑過去，
   不會被彈開，也就不會出現「被推到遠處、沿途一路佔地」或「被擠進水裡卡死」。
   玩家正在操控的那支一樣只會被擋，不會被任何人推動。 */
const UNIT_R = 0.55;
const CELL_CAP = 2;          // v15.1：同一格最多兩支兵團，多的排隊

/* v25：每幀建一次「格子 → 部隊」索引。
   不然每支兵團移動時都要掃過全部兵團（600 支 = 每幀 140 萬次比對，直接掉到 30fps）。 */
let _uidx = null, _uidxFrame = -1;
function unitIndex() {
  if (_uidxFrame === G.frameN && _uidx) return _uidx;
  _uidxFrame = G.frameN;
  const map = new Map();
  for (const a of G.armies) {
    if (!a.alive) continue;
    const k = Math.floor(a.x) * 4096 + Math.floor(a.y);
    let b = map.get(k);
    if (!b) map.set(k, b = []);
    b.push(a);
  }
  _uidx = map;
  return map;
}

function blockedByUnit(b, u, x, y) {
  const idx = unitIndex();
  const cx = Math.floor(x), cy = Math.floor(y);
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const arr = idx.get((cx + dx) * 4096 + (cy + dy));
      if (!arr) continue;
      for (const o of arr) {
        if (o === u || !o.alive) continue;
        if (sameLegion(u, o)) continue;          // v28：同統合兵團彼此穿透
        const ddx = o.x - x, ddy = o.y - y;
        if (ddx * ddx + ddy * ddy < UNIT_R * UNIT_R) return true;
      }
    }
  }
  return false;
}

/* 同一格已經站了兩支就擋住，讓後面排隊等前一支先出去 */
function sameLegion(u, o) {
  return !!(u && o && u.legion > 0 && u.legion === o.legion);
}

function cellArmyCount(except, cx, cy) {
  const arr = unitIndex().get(cx * 4096 + cy);
  if (!arr) return 0;
  let n = 0;
  for (const o of arr) {
    if (o === except || !o.alive) continue;
    if (sameLegion(except, o)) continue;      // v28：同統合兵團不佔位
    n++;
  }
  return n;
}

function cellHasRoom(u, x, y, fromX, fromY) {
  const cx = Math.floor(x), cy = Math.floor(y);
  if (cx === fromX && cy === fromY) return true;      // 同格內微調不受限
  return cellArmyCount(u, cx, cy) < CELL_CAP;
}

/* 出生點：不跟人重疊、又站得住（同一個主城連續出兵也不會疊在一起） */
/* v26：城池四周找一個沒人站的空地（由內往外繞） */
function freeRingSpot(cap, r) {
  const b = G.board;
  const steps = 14;
  const off = Math.random() * TAU;
  for (let k = 0; k < steps; k++) {
    const ang = off + (k / steps) * TAU;
    const x = cap.x + Math.cos(ang) * r;
    const y = cap.y + Math.sin(ang) * r;
    if (!canStand(b, x, y, 0.3)) continue;
    if (blockedByUnit(b, null, x, y)) continue;
    if (cellArmyCount(null, Math.floor(x), Math.floor(y)) >= CELL_CAP) continue;
    return [x, y];
  }
  return null;
}

function freeSpotNear(x, y) {
  const b = G.board;
  const okAt = function (nx, ny) {
    if (!canStand(b, nx, ny, 0.3)) return false;
    if (blockedByUnit(b, null, nx, ny)) return false;
    return cellArmyCount(null, Math.floor(nx), Math.floor(ny)) < CELL_CAP;
  };
  if (okAt(x, y)) return [x, y];
  for (const r of [0.75, 1.2, 1.7, 2.2, 2.9]) {
    for (let k = 0; k < 8; k++) {
      const t = (k / 8) * TAU + r;
      const nx = x + Math.cos(t) * r, ny = y + Math.sin(t) * r;
      if (!okAt(nx, ny)) continue;
      return [nx, ny];
    }
  }
  return [x, y];
}

/* ══════════ v24：野戰軍 / 守備軍 的數值區分 ══════════
   野戰軍：跑得快、打人痛（對外作戰用）。
   守備軍：跑得慢、打人不痛，但被打很耐（守城用），而且站在自家城邊時
          會讓敵人的圍城進度只剩一半（時間翻倍）。 */
function unitSpeed(u) {
  return u.garrison ? 0.78 : 1.28;      // 守備軍 -22%，野戰軍 +28%
}
function unitAtk(u) {
  return u.garrison ? 0.72 : 1.34;      // 守備軍 傷害 -28%，野戰軍 +34%
}
function unitDef(u) {
  return u.garrison ? 1.55 : 1.0;       // 守備軍 受到的傷害 ÷1.55（約 -35%）
}

/* ══════════ v28：統合兵團（可以有很多隊） ══════════
   每支兵團自己標記要加入哪一隊（a.legion，0 = 不加入）。
   同一隊的成員彼此穿透、不推擠，但對外隊／敵人仍然有碰撞。
   陣法用 1–4 切換（套用在「你正在操控的那支所屬的隊伍」）。
   成員平常維持陣型；附近有敵人就交给原本的對敵 AI 去打。 */
const LEGION_MAX = 4;
const FORMATIONS = [
  { name: '方陣', off: function (i, n) {
      const cols = Math.max(1, Math.ceil(Math.sqrt(n)));
      const rows = Math.ceil(n / cols);
      return [((i % cols) - (cols - 1) / 2) * 1.1, (Math.floor(i / cols) - (rows - 1) / 2) * 1.1];
    } },
  { name: '一字長蛇', off: function (i, n) {
      /* v28：一列 10 支，多的往後排，變成一個長方形 */
      const cols = 10;
      const rows = Math.ceil(n / cols);
      return [((i % cols) - (cols - 1) / 2) * 1.15, (Math.floor(i / cols) - (rows - 1) / 2) * 1.15];
    } },
  { name: '卻月陣', off: function (i, n) {
      const t = n <= 1 ? 0 : (i / (n - 1)) * 2 - 1;
      return [t * 2.6, 1.4 - Math.cos(t * 1.15) * 1.5];
    } },
  { name: '雁行陣', off: function (i, n) {
      const t = n <= 1 ? 0 : (i / (n - 1)) * 2 - 1;
      return [t * 2.7, Math.abs(t) * 1.9 - 1.3];
    } }
];

function ensureLegions() {
  if (!Array.isArray(G.legions)) G.legions = [];
  for (let i = 0; i < LEGION_MAX; i++) {
    if (!G.legions[i]) G.legions[i] = { id: i + 1, form: 0 };
  }
  return G.legions;
}

function legionById(id) {
  ensureLegions();
  return G.legions.find(function (L) { return L.id === id; }) || null;
}

function legionMembersOf(id) {
  return G.armies.filter(function (a) {
    return a.alive && a.owner === 0 && a.legion === id;   /* v41：守備軍也能編入統合兵團 */
  }).sort(function (p, q) { return p.uid - q.uid; });
}

function legionLeaderOf(id) {
  const sel = G.player && G.player.sel;
  if (sel && sel.alive && sel.owner === 0 && sel.legion === id) return sel;
  const mem = legionMembersOf(id);
  return mem.length ? mem[0] : null;
}

function openLegionPop(uid, cx, cy) {
  const el = document.getElementById('legionPop');
  if (!el) return;
  let h = '<div class="lp-title">編入統合兵團</div>';
  for (let i = 1; i <= LEGION_MAX; i++) {
    h += '<button class="mini-act" data-lpassign="' + uid + ':' + i + '">' + i + ' 隊</button>';
  }
  h += '<button class="mini-act" data-lpassign="' + uid + ':0">退出兵團</button>';
  el.innerHTML = h;
  el.classList.add('on');
  const w = 120, hgt = 40 + LEGION_MAX * 26;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, cx - w / 2)) + 'px';
  el.style.top = Math.max(8, Math.min(window.innerHeight - hgt - 8, cy - 20)) + 'px';
}

function closeLegionPop() {
  const el = document.getElementById('legionPop');
  if (el) el.classList.remove('on');
}

function assignArmyLegion(uid, id) {
  const a = G.armies.find(function (x) { return x.uid === uid && x.alive; });
  if (!a) return;
  a.legion = id;
  a.farT = 0;
  toast('兵團 ' + uid + '　·　' + (id ? ('統合兵團 ' + id) : '退出統合兵團'));
  armySig = '';
  closeLegionPop();
  updateHUD();
}

function cycleArmyLegion(uid) {
  const a = G.armies.find(function (x) { return x.uid === uid && x.alive; });
  if (!a) return;   /* v41：守備軍也可以編進統合兵團 */
  ensureLegions();
  a.legion = (a.legion || 0) + 1;
  if (a.legion > LEGION_MAX) a.legion = 0;
  const nm = a.legion ? ('統合兵團 ' + a.legion) : '不加入統合兵團';
  toast('兵團 ' + a.uid + '　·　' + nm);
  armySig = '';
  updateHUD();
}

function setFormation(i) {
  const sel = G.player && G.player.sel;
  const id = sel && sel.legion ? sel.legion : 1;
  const L = legionById(id);
  if (!L) return;
  L.form = i % FORMATIONS.length;
  toast('統合兵團 ' + id + '　·　' + FORMATIONS[L.form].name);
  armySig = '';
  updateHUD();
}

/* 這支兵團在隊形裡的位置（世界座標） */
function legionSlotOf(a) {
  if (!a.legion) return null;
  const L = legionById(a.legion);
  if (!L) return null;
  const lead = legionLeaderOf(a.legion);
  if (!lead || lead === a) return null;
  const mem = legionMembersOf(a.legion);
  const idx = mem.indexOf(a);
  if (idx < 0) return null;
  const n = mem.length;
  const form = FORMATIONS[L.form % FORMATIONS.length] || FORMATIONS[0];
  const enc = formationEnemyNear(lead);
  const scale = enc ? 1.0 : 1.45;
  const [dx, dy] = form.off(idx, n);
  const ang = Math.atan2(lead.fy || 0, lead.fx || 1) + Math.PI / 2;
  const rx = dx * Math.cos(ang) - dy * Math.sin(ang);
  const ry = dx * Math.sin(ang) + dy * Math.cos(ang);
  return { x: lead.x + rx * scale, y: lead.y + ry * scale };
}

function formationEnemyNear(lead) {
  for (const o of G.armies) {
    if (!o.alive || o.owner === lead.owner) continue;
    if (!hostileTo(o.owner, lead.owner)) continue;
    if (Math.hypot(o.x - lead.x, o.y - lead.y) < 12) return true;
  }
  return false;
}

/* 自己附近有沒有敵人（有 → 交給一般對敵 AI） */
function enemyNearMe(a, rad) {
  for (const o of G.armies) {
    if (!o.alive || o.owner === a.owner) continue;
    if (!hostileTo(o.owner, a.owner)) continue;
    if (Math.hypot(o.x - a.x, o.y - a.y) <= (rad || 9)) return true;
  }
  return false;
}

/* v41：統合兵團成員跟不上主將時加速追趕（守備軍本來就慢，不加速會一直被甩開） */
function gapSpeed(a, dist) {
  if (dist <= 2.5) return 1;
  if (a.garrison) return 1.7;
  return 1.35;
}

/* v41：陣位若落在海裡（隊形跨過水岸）就退而求其次，改站主將旁邊的陸地，
   否則成員會一直想把水格當終點、卡在岸邊被主將甩開。 */
function legionSpotSafe(a) {
  const sp = legionSlotOf(a);
  if (sp && G.board.isLand(Math.floor(sp.x), Math.floor(sp.y))) return sp;
  const lead = a.legion ? legionLeaderOf(a.legion) : null;
  if (!lead) return sp;
  for (const r of [1.2, 2.0, 2.8, 3.6]) {
    for (let k = 0; k < 8; k++) {
      const ang = k * (TAU / 8) + 0.4;
      const x = lead.x + Math.cos(ang) * r, y = lead.y + Math.sin(ang) * r;
      if (G.board.isLand(Math.floor(x), Math.floor(y))) return { x: x, y: y };
    }
  }
  return { x: lead.x, y: lead.y };
}

function legionTotals() {
  ensureLegions();
  let n = 0, men = 0;
  for (const L of G.legions) {
    const mem = legionMembersOf(L.id);
    if (!mem.length) continue;
    n++;
    for (const a of mem) men += a.men;
  }
  return { legions: n, men: men };
}

function garrisonNear(cap, owner) {
  for (const a of G.armies) {
    if (!a.alive || !a.garrison || a.owner !== owner) continue;
    if (Math.hypot(a.x - cap.x, a.y - cap.y) < 3.2) return true;
  }
  return false;
}

function moveUnit(b, u, dx, dy, dt, mult) {
  if (u.stunned) return;
  const len = Math.hypot(dx, dy);
  if (len < 1e-5) return;
  dx /= len; dy /= len;
  /* v39：方向鎖 —— 0.15 秒內不允許反向，濾掉來回抖動 */
  const nowT = G.t || 0;
  if (u._mx !== undefined && nowT - (u._mt || 0) < 0.15) {
    if (dx * u._mx + dy * u._my < -0.25) { dx = u._mx; dy = u._my; }
  }
  u._mx = dx; u._my = dy; u._mt = nowT;
  u._mvT = nowT;                 // v39.1：記錄「這一幀有被要求移動」
  u.fx = lerp(u.fx, dx, 0.28);
  u.fy = lerp(u.fy, dy, 0.28);
  const step = u.speed * unitSpeed(u) * (mult || 1) * BIOMES[biomeAt(u.x, u.y)].move * dt;
  const R = 0.32;
  const nx = u.x + dx * step;
  const fx = Math.floor(u.x), fy = Math.floor(u.y);
  if (canStand(b, nx, u.y, R) && !blockedByUnit(b, u, nx, u.y) &&
      cellHasRoom(u, nx, u.y, fx, fy)) u.x = nx;
  const gx2 = Math.floor(u.x), gy2 = Math.floor(u.y);
  const ny = u.y + dy * step;
  if (canStand(b, u.x, ny, R) && !blockedByUnit(b, u, u.x, ny) &&
      cellHasRoom(u, u.x, ny, gx2, gy2)) u.y = ny;
}

/* ═══════════════════════ v15：尋路 ═══════════════════════
   以前所有兵團都朝目標直線走，遇到海灣就貼著牆抖動、永遠到不了。
   現在改成：直線可走就走直線；走不通就在陸地上做一次 BFS，
   沿著格子的最短路人走。每幀最多算 2 條路徑，避免大後期卡幀。 */
const _pfDist = new Int32Array(WORLD_W * WORLD_H);
const _pfQ = new Int32Array(WORLD_W * WORLD_H);
let pathBudget = 4;   // v39.1：2 → 4，兵團變多以後常常排不到路徑

function lineClear(b, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const n = Math.min(18, Math.ceil(Math.hypot(dx, dy) / 0.55));
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (!b.isLand(Math.floor(x0 + dx * t), Math.floor(y0 + dy * t))) return false;
  }
  return true;
}

/* 從終點反推距離場，再從起點往下坡走回一條路；回傳格子索引陣列（起點→終點） */
function buildPath(b, sx, sy, gx, gy) {
  const W = b.w, H = b.h, n = W * H;
  const s = sy * W + sx, g = gy * W + gx;
  if (s < 0 || g < 0 || s >= n || g >= n) return null;
  if (!b.terrain[s] || !b.terrain[g]) return null;
  _pfDist.fill(-1);
  let qh = 0, qt = 0, visited = 0;
  _pfDist[g] = 0; _pfQ[qt++] = g;
  while (qh < qt) {
    const i = _pfQ[qh++];
    if (i === s) break;
    if (++visited > 14000) return null;        // 走太遠就不算了，退回直線
    const d = _pfDist[i] + 1;
    const x = i % W, y = (i / W) | 0;
    if (x > 0)     { const j = i - 1; if (_pfDist[j] < 0 && b.terrain[j]) { _pfDist[j] = d; _pfQ[qt++] = j; } }
    if (x < W - 1) { const j = i + 1; if (_pfDist[j] < 0 && b.terrain[j]) { _pfDist[j] = d; _pfQ[qt++] = j; } }
    if (y > 0)     { const j = i - W; if (_pfDist[j] < 0 && b.terrain[j]) { _pfDist[j] = d; _pfQ[qt++] = j; } }
    if (y < H - 1) { const j = i + W; if (_pfDist[j] < 0 && b.terrain[j]) { _pfDist[j] = d; _pfQ[qt++] = j; } }
  }
  if (_pfDist[s] < 0) return null;
  const path = [s];
  let cur = s, guard = 0;
  while (cur !== g && guard++ < 3000) {
    const x = cur % W, y = (cur / W) | 0;
    let nxt = -1, want = _pfDist[cur] - 1;
    if (x > 0 && _pfDist[cur - 1] === want) nxt = cur - 1;
    else if (x < W - 1 && _pfDist[cur + 1] === want) nxt = cur + 1;
    else if (y > 0 && _pfDist[cur - W] === want) nxt = cur - W;
    else if (y < H - 1 && _pfDist[cur + W] === want) nxt = cur + W;
    if (nxt < 0) break;
    cur = nxt;
    path.push(cur);
  }
  return path.length > 1 ? path : null;
}

/* 朝目標走一步：直線通就直接走，不通就沿路徑走 */
/* v39.1：從自己往外一圈一圈找最近的「非我方」陸地（給吃地 AI 用） */
function nearestFreeCell(a, maxR) {
  const b = G.board;
  const ax = a.x, ay = a.y;
  const R = maxR || 40;
  for (let r = 2; r <= R; r += 2) {
    let best = null, bd = 1e9;
    const N = 20;
    for (let k = 0; k < N; k++) {
      const ang = (k / N) * TAU + r * 1.7;
      const x = Math.round(ax + Math.cos(ang) * r);
      const y = Math.round(ay + Math.sin(ang) * r);
      if (x < 1 || y < 1 || x >= b.w - 1 || y >= b.h - 1) continue;
      const i = y * b.w + x;
      if (!b.terrain[i]) continue;
      if (b.owner[i] === a.owner) continue;
      if (b.owner[i] > 0 && !hostileTo(a.owner, b.owner[i])) continue;
      const d = (x - ax) * (x - ax) + (y - ay) * (y - ay);
      if (d < bd) { bd = d; best = { x: x + 0.5, y: y + 0.5 }; }
    }
    if (best) return best;
  }
  return null;
}

/* v42：某個勢力「國界線上」的敵國／中立地區（貼著自己領土的地區），
   兵團吃地只往這些地方推，不會隨機亂走。每 4 秒重算一次。 */
function borderDistrictsFor(owner) {
  G._bd = G._bd || {};
  const e = G._bd[owner];
  if (e && G.t - e.stamp < 4) return e.list;
  const b = G.board;
  const out = [];
  for (const z of G.zones) {
    for (const d of z.districts) {
      if (!d || !d.cells || !d.cells.length) continue;
      if (d.owner === owner) continue;
      if (d.cap && d.cap.owner === owner) continue;
      if (d.owner >= 0 && !hostileTo(d.owner, owner)) continue;   // 和平的不打
      const n = d.cells.length;
      const stride = Math.max(1, (n / 14) | 0);
      let touch = false, sx = 0, sy = 0, cn = 0;
      for (let k = 0; k < n; k += stride) {
        const i = d.cells[k];
        const x = i % WORLD_W, y = (i / WORLD_W) | 0;
        if (b.owner[i] !== NEUTRAL) { sx += x; sy += y; cn++; }
        if (touch) continue;
        if (x > 0 && b.owner[i - 1] === owner) touch = true;
        else if (x < WORLD_W - 1 && b.owner[i + 1] === owner) touch = true;
        else if (y > 0 && b.owner[i - WORLD_W] === owner) touch = true;
        else if (y < WORLD_H - 1 && b.owner[i + WORLD_W] === owner) touch = true;
      }
      if (!touch || !cn) continue;
      out.push({ cx: sx / cn + 0.5, cy: sy / cn + 0.5, owner: d.owner, dist: d });
    }
  }
  G._bd[owner] = { stamp: G.t, list: out };
  return out;
}

function borderTarget(a) {
  const list = borderDistrictsFor(a.owner);
  if (!list.length) return null;
  const hx = a.home ? a.home.x : a.x, hy = a.home ? a.home.y : a.y;
  const R = 46 * aggroMul();
  let bs = 1e9, best = null;
  for (const d of list) {
    if (Math.hypot(d.cx - hx, d.cy - hy) > R) continue;
    /* 中立地優先（便宜），敵國地其次；再按距離挑最近的 */
    const s = Math.hypot(d.cx - a.x, d.cy - a.y) + (d.owner === NEUTRAL ? 5 : 0);
    if (s < bs) { bs = s; best = d; }
  }
  if (!best) return null;
  return { x: best.cx, y: best.cy };
}

function stepTo(b, a, tx, ty, dt, mult) {
  const dx = tx - a.x, dy = ty - a.y;
  const d = Math.hypot(dx, dy);
  if (d < 0.12) return;
  const gx = Math.floor(tx), gy = Math.floor(ty);
  const now = b.time;
  /* v39：一旦走了尋路就沿著路走完（1.2 秒內），不要直線/尋路兩邊來回切，
     否則兵團會在同一格左右抖動。 */
  const onPath = !!(a.path && a.path.length && a.pathGoal &&
    now < (a.pathAt || 0) &&
    Math.abs(a.pathGoal[0] - gx) + Math.abs(a.pathGoal[1] - gy) < 2);
  if (!onPath && d < 26 && lineClear(b, a.x, a.y, tx, ty)) {
    a.path = null;
    moveUnit(b, a, dx / d, dy / d, dt, mult);
    return;
  }
  const goalMoved = !a.pathGoal || Math.abs(a.pathGoal[0] - gx) + Math.abs(a.pathGoal[1] - gy) > 1;
  if (goalMoved || !a.path || now > (a.pathAt || 0)) {
    if (pathBudget > 0) {
      pathBudget--;
      a.path = buildPath(b, Math.floor(a.x), Math.floor(a.y), gx, gy);
      a.pathGoal = [gx, gy];
      a.pathAt = now + 1.2;
      a.pathI = 0;
    }
  }
  if (!a.path || !a.path.length) {            // 找不到路就先直線貼牆
    moveUnit(b, a, dx / d, dy / d, dt, mult);
    return;
  }
  const W = b.w;
  while (a.pathI < a.path.length - 1) {
    const c0 = a.path[a.pathI];
    const c0x = (c0 % W) + 0.5, c0y = ((c0 / W) | 0) + 0.5;
    if (Math.hypot(c0x - a.x, c0y - a.y) < 0.5) a.pathI++;
    else break;
  }
  const c = a.path[Math.min(a.pathI, a.path.length - 1)];   // v39：走當前路徑點，不要跳格
  const cx = (c % W) + 0.5, cy = ((c / W) | 0) + 0.5;
  const ndx = cx - a.x, ndy = cy - a.y, nd = Math.hypot(ndx, ndy) || 1;
  moveUnit(b, a, ndx / nd, ndy / nd, dt, mult);
}

const _bx = new Int16Array(512);const _by = new Int16Array(512);
const _bd = new Uint8Array(512);

function collectBrush(b, u, cb, rOverride) {
  const cx = Math.floor(u.x), cy = Math.floor(u.y);
  if (!b.isLand(cx, cy)) return;
  const r = rOverride === undefined ? u.brush : rOverride;
  const id = ++b.stampId;
  let qh = 0, qt = 0;
  _bx[qt] = cx; _by[qt] = cy; _bd[qt] = 0; qt++;
  b.stamp[cy * b.w + cx] = id;
  while (qh < qt) {
    const x = _bx[qh], y = _by[qh], d = _bd[qh]; qh++;
    cb(x, y);
    if (d >= r) continue;
    for (let k = 0; k < 4; k++) {
      const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
      const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (!b.isLand(nx, ny)) continue;
      const ni = ny * b.w + nx;
      if (b.stamp[ni] === id) continue;
      b.stamp[ni] = id;
      if (qt >= 512) continue;
      _bx[qt] = nx; _by[qt] = ny; _bd[qt] = d + 1; qt++;
    }
  }
}

function applyBrush(b, u, dt) {
  if (!u.alive || u.stunned) return;
  const surging = u.owner === 0 && G.surge.t > 0;
  const dmg = DMG * dt * (surging ? CFG.surgeDmg : 1);
  const now = b.time;
  /* 進場保護：剛開新區塊的幾秒內，AI 不能直接吃掉玩家的地 */
  const grace = u.owner !== 0 && G.grace > 0;
  collectBrush(b, u, (x, y) => {
    const i = y * b.w + x;
    if (b.lock[i] > now) return;
    const o = b.owner[i];
    if (o === u.owner) return;
    /* v17：敵國之間結盟，不能互相吃地 */
    if (u.owner > 0 && o > 0) return;
    /* v14 外交：和平狀態下雙方都不能吃對方的地 */
    if (o !== NEUTRAL && !hostileTo(u.owner, o)) return;   // v21b：依關係矩陣
    if (grace && o === 0) return;
    if (o === NEUTRAL) {
      b.setOwner(i, u.owner);
      b.hp[i] = HP_MAX;
      b.lock[i] = now + CFG.captureLock;
      if (u.owner === 0 && Math.random() < 0.05) {
        spawnPart(x + 0.5, y + 0.5, COLORS[0].css, 0.16, 0.55);
      }
    } else {
      /* 戰役模式：敵格只能從自己的領土往外推 */
      if (G.warMode && !supplied(b, i, u.owner)) return;
      b.hp[i] -= dmg;
      if (b.hp[i] <= 0) {
        b.setOwner(i, u.owner);
        b.hp[i] = HP_MAX;
        b.lock[i] = now + CFG.captureLock;
        spawnBurst(x + 0.5, y + 0.5, COLORS[o].css);
        if (u.owner === 0) sfxFlip();
      }
    }
  }, surging ? u.brush + 1 : undefined);
}

/* 戰役模式：只能從自己的領土往外推 —— 敵格必須緊鄰自己的地才打得動 */
function supplied(b, i, owner) {
  const x = i % b.w, y = (i / b.w) | 0;
  if (x > 0 && b.owner[i - 1] === owner) return true;
  if (x < b.w - 1 && b.owner[i + 1] === owner) return true;
  if (y > 0 && b.owner[i - b.w] === owner) return true;
  if (y < b.h - 1 && b.owner[i + b.w] === owner) return true;
  return false;
}

/* ═══════════════════════════ 人口與兵團 ═══════════════════════════ */
function playerPop() {
  let p = 0;
  for (const cap of G.caps) if (cap.owner === 0) p += cap.pop || 0;
  return p;
}

/* v16：全國總兵力（野戰兵團 + 守軍，分開算） */
function playerMen() {
  let s = 0;
  for (const a of G.armies) if (a.alive && a.owner === 0) s += a.men;
  return s;
}
function playerFieldMen() {
  let s = 0;
  for (const a of G.armies) if (a.alive && a.owner === 0 && !a.garrison) s += a.men;
  return s;
}
function playerGarrisonMen() {
  let s = 0;
  for (const a of G.armies) if (a.alive && a.owner === 0 && a.garrison) s += a.men;
  for (const c of G.caps) if (c.owner === 0) s += (c.held || 0);   // v26：城裡的守軍數字
  return s;
}
function playerCapCount() {
  let n = 0;
  for (const c of G.caps) if (c.owner === 0) n++;
  return n;
}
/* v16：兵團上限不再是固定值、也不能在 ESC 調；初始 5，之後跟著城池數長 */
function armyCapOf() {
  return Math.max(5, playerCapCount());
}
function ownerMen(owner) {
  let s = 0;
  for (const a of G.armies) if (a.alive && a.owner === owner) s += a.men;
  return s;
}

/* v10：人口 → 兵力轉化。
   每滿 10000 人成軍一次。攻下主城拿到的這批人口會立刻結算，
   不用等到下一個 30 秒週期；丟城時把已結算的額度收回到現有人口，
   否則會留下負債，之後要先把缺口補回來才會再成軍。 */
function convertPlayerPop() {
  const total = playerPop();
  if (G.popPaid > total) G.popPaid = total;
  let n = 0;
  /* v15：人口不再直接成軍，改成累積「可徵人力」，再均分到各城當守軍 */
  while (total - G.popPaid >= 10000 && n < 40) {
    G.popPaid += 10000;
    G.garrisonPool += CFG.poolPer10k;
    n++;
  }
  if (n) distributePool();
}

/* ═══════════════════ v15 守軍與補編 ═══════════════════ */
function garrisonCapOf(cap) {
  const size = cap.district ? cap.district.size : 60;
  return Math.max(CFG.garrisonMinCap, Math.round(size * CFG.garrisonPerCell));
}

/* ══════════ v26：守備軍「進城消失，只留數字」 ══════════
   cap.held 是城裡的守軍人數。城中沒有敵人時守軍不佔位（不會跟野戰軍卡在一起），
   被圍攻、或被集結令點名時才 materialize 成實際部隊。 */
function capGarrison(cap) {
  for (const a of G.armies) {
    if (a.alive && a.owner === cap.owner && a.garrison && a.home === cap) return a;
  }
  return null;
}

function garrisonMen(cap) {
  const g = capGarrison(cap);
  return g ? g.men : (cap.held || 0);
}

function addGarrison(cap, men) {
  const g = capGarrison(cap);
  if (g) {
    g.men += men;
    g.g0 = Math.max(g.g0 || 0, g.men);
    return g;
  }
  cap.held = (cap.held || 0) + men;
  return null;
}

/* 把數字變成實際部隊（城外空位） */
function materializeGarrison(cap) {
  if (!cap) return null;
  const have = cap.held || 0;
  if (have <= 0) return capGarrison(cap);
  const sp = freeSpotNear(cap.x + 0.5, cap.y + 0.5);
  const a = addArmy(cap.owner, sp[0], sp[1], have, cap, cap.zone);
  a.garrison = true;
  a.g0 = have;
  cap.held = 0;
  return a;
}

/* 部隊回到自家城裡 → 變成數字消失 */
function absorbGarrison(g) {
  if (!g || !g.alive || !g.home) return;
  const cap = g.home;
  if (cap.owner !== g.owner) return;
  cap.held = (cap.held || 0) + g.men;
  killArmy(g, true);
}

/* ══════════ v43：城內野戰儲備 ══════════
   野戰兵團回到自己的主城、附近又沒有敵人，就「收進城」變成一串數字：
   不再留在野外無意義繞圈、卡在地圖邊緣或被硬傳送。要打仗時再從城裡召喚。 */
const FIELD_ARMY_MAX = 5000;      // 單支野戰軍人數上限
let fieldStoreT = 0;

function capFieldMen(cap) {
  return Math.max(0, Math.round((cap && cap.field) || 0));
}

function playerStoredField() {
  let men = 0, n2 = 0;
  for (const c of G.caps) {
    if (c.owner !== 0) continue;
    const f = capFieldMen(c);
    if (f > 0) { men += f; n2++; }
  }
  return { men: men, n: n2 };
}

/* 回城 → 變成數字（不算戰損、不跳戰報） */
function absorbFieldArmy(a) {
  if (!a || !a.alive || a.garrison) return false;
  const c = a.home;
  if (!c || c.owner !== a.owner) return false;
  c.field = capFieldMen(c) + Math.round(a.men);
  a.alive = false;
  a.men = 0;
  const i = G.armies.indexOf(a);
  if (i >= 0) G.armies.splice(i, 1);
  if (G.player && G.player.sel === a) {
    const rest = G.armies.filter(function (x) { return x.alive && x.owner === 0 && !x.garrison; });
    G.player.sel = rest.length ? rest[0] : null;
  }
  return true;
}

/* 從城裡叫出一支野戰軍（單支上限 5000 人） */
function materializeFieldArmy(cap, want) {
  if (!cap) return null;
  const have = capFieldMen(cap);
  if (have < 50) return null;
  if (cap.owner === 0) {
    const cnt = G.armies.filter(function (a) { return a.alive && a.owner === 0 && !a.garrison; }).length;
    if (cnt >= armyCapOf()) return null;
  }
  const men = Math.min(have, Math.min(want || FIELD_ARMY_MAX, FIELD_ARMY_MAX));
  cap.field = have - men;
  const a = cap.owner === 0
    ? addArmy(0, cap.x + 0.5, cap.y + 0.5, men, cap, cap.zone)
    : spawnEnemyFieldAt(cap, men);
  if (!a) { cap.field = have; return null; }
  a.think = 0.2;
  if (cap.owner === 0 && G.player && !G.player.sel) G.player.sel = a;
  for (let k = 0; k < 8; k++) spawnPart(a.x, a.y, COLORS[a.owner].css, 0.8, 0.5);
  return a;
}

/* 玩家：把城裡的儲備叫出來，count 支以內，離 ref 最近的城優先 */
function summonStoredField(count, ref) {
  count = Math.max(1, count || 1);
  const caps = G.caps.filter(function (c) { return c.owner === 0 && capFieldMen(c) >= 50; });
  if (!caps.length) return 0;
  const p = ref || controlledUnit() || { x: cam.x, y: cam.y };
  caps.sort(function (m, o) {
    return Math.hypot(m.x - p.x, m.y - p.y) - Math.hypot(o.x - p.x, o.y - p.y);
  });
  let made = 0;
  for (const c of caps) {
    if (made >= count) break;
    if (materializeFieldArmy(c, FIELD_ARMY_MAX)) made++;
  }
  if (made) toast('召喚野戰軍　·　' + made + ' 支出城');
  return made;
}

/* 這個勢力是不是正在打仗（敵國對敵國也算） */
function factionAtWar(owner) {
  if (owner <= 0) return true;
  if (!G.diplo) return true;
  if (getRel(0, owner) === 'war') return true;
  for (const r of G.rivals) {
    if (r.dead || r.owner === owner) continue;
    if (getRel(owner, r.owner) === 'war') return true;
  }
  return false;
}

/* 敵方：有戰爭才派兵；沒戰爭就把人留在主城裡繼續堆數字 */
let enemyFieldT = 0;
function enemyFieldTick(dt) {
  enemyFieldT += (dt || 0);
  if (enemyFieldT < 4) return;
  enemyFieldT = 0;
  for (const c of G.caps) {
    if (c.owner <= 0) continue;
    if (capFieldMen(c) < 600) continue;
    if (!factionAtWar(c.owner)) continue;
    if (G.armies.length >= ENEMY_SCALE.maxArmies) break;
    materializeFieldArmy(c, FIELD_ARMY_MAX);
  }
}

/* 這支兵團旁邊有沒有敵方主城（正在圍城就不算閒置） */
function hostileCapNear(a, rad) {
  for (const c of G.caps) {
    if (c.owner < 0 || c.owner === a.owner) continue;
    if (!hostileTo(c.owner, a.owner)) continue;
    if (Math.hypot(c.x - a.x, c.y - a.y) <= rad) return c;
  }
  return null;
}

/* 每 0.5 秒定期定位每支野戰軍：
   1) 已經回到自家城邊、附近沒敵人 → 直接收進城變成數字
   2) 無交戰又卡住 12 秒 → 派回家（到家同樣變成數字）
   3) 找不到目標閒晃 25 秒 → 派回家 */
function updateFieldStore(dt) {
  fieldStoreT += dt;
  if (fieldStoreT < 0.5) return;
  fieldStoreT = 0;
  const sel = G.player && G.player.sel;
  for (const a of G.armies.slice()) {
    if (!a.alive || a.garrison) continue;
    if (a.storeT > 0) { a.storeT -= 0.5; continue; }
    if (a.owner === 0 && a === sel) continue;        // 玩家正在操控的不收
    if (a.rally > 0) { a.noGoalT = 0; continue; }
    const home = a.home;
    if (!home || home.owner !== a.owner) { a.home = null; continue; }
    if (enemyNearMe(a, 7) || hostileCapNear(a, 3.5)) { a.noGoalT = 0; a._stkT = 0; continue; }
    if (Math.hypot(a.x - home.x, a.y - home.y) <= 2.4) { absorbFieldArmy(a); continue; }
    if (a.assign && a.assign.cap) a.noGoalT = 0;
    else if (!a.goal) a.noGoalT = (a.noGoalT || 0) + 0.5;
    else a.noGoalT = 0;
    if ((a._stkT || 0) >= 12 || a.noGoalT >= 25) {
      a.noGoalT = 0;
      a._stkT = 0;
      a.rally = 0;
      a.assign = null;
      a.returning = true;
      a.think = 0;
      const hp = homePoint(a);
      if (hp) a.goal = { x: hp.x, y: hp.y };
    }
  }
}

/* 這座城現在有沒有威脅（敵人貼近） */
function cityThreatened(cap) {
  for (const a of G.armies) {
    if (!a.alive || a.owner === cap.owner) continue;
    if (!hostileTo(a.owner, cap.owner)) continue;
    if (Math.hypot(a.x - cap.x, a.y - cap.y) < 4.5) return a;
  }
  return null;
}

function takeGarrison(cap, amount) {
  const g = capGarrison(cap);
  if (g) {
    const t = Math.min(amount, g.men);
    g.men -= t;
    return t;
  }
  const held = cap.held || 0;
  const t = Math.min(amount, held);
  cap.held = held - t;
  return t;
}

function setGarrison(cap, men) {
  const g = capGarrison(cap);
  if (g) {
    g.men = men;
    g.g0 = Math.max(g.g0 || 0, men);
  } else {
    cap.held = men;
  }
}

/* 把待分配的人力均分到各城守軍，滿了就換下一座 */
function distributePool() {
  if (G.garrisonPool < 10) { G.garrisonPool = 0; return; }
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  if (!caps.length) { G.garrisonPool = 0; return; }
  let guard = 0;
  while (G.garrisonPool >= 10 && guard++ < 240) {
    const open = caps.filter(function (c) {
      return garrisonMen(c) < garrisonCapOf(c);
    });
    if (!open.length) break;
    const per = Math.max(10, Math.floor(G.garrisonPool / open.length));
    let moved = 0;
    for (const c of open) {
      if (G.garrisonPool < 10) break;
      const room = garrisonCapOf(c) - garrisonMen(c);
      const take = Math.min(per, room, G.garrisonPool);
      if (take < 10) continue;
      addGarrison(c, take);
      G.garrisonPool -= take;
      moved += take;
    }
    if (!moved) break;
  }
}

/* 野戰軍不足上限時，從各城守軍抽人補滿（守軍最低留 100） */
function topUpArmy(a) {
  if (!a || !a.alive) return 0;
  let need = Math.round(G.armyFillCap) - a.men;
  if (need <= 0) return 0;
  const caps = G.caps.filter(function (c) { return c.owner === a.owner; });
  caps.sort(function (p, q) {
    return garrisonMen(q) - garrisonMen(p);
  });
  let got = 0;
  for (const c of caps) {
    if (need <= 0) break;
    const gm = garrisonMen(c);
    if (gm <= 100) continue;
    const take = Math.min(need, Math.floor(gm - 100));
    takeGarrison(c, take);
    a.men += take;
    need -= take;
    got += take;
  }
  return got;
}

/* v16：城池成立時自動調撥 500 人成一支野戰軍 */
/* ══════════ v25：敵方成長 ══════════
   玩家越強，所有敵國就跟著變強（兩種地圖模式都一樣）：
   1) 玩家城池 > 10 之後，每多 5 座 → 敵方每座城的守軍 +2000。
   2) 玩家每擁有 200 支守備軍 → 敵方每座城 +5 支野戰軍。
   3) 玩家每擁有 200 支野戰軍 → 敵方每座城 +5 支守備軍（換算 2500 兵）。
   數字都在下面這幾個常數裡，想調直接改。 */
const ENEMY_SCALE = {
  cityStart: 10,      // 玩家超過幾座城才開始算
  cityStep: 5,        // 每多幾座城觸發一次
  cityGarMen: 2000,   // 每次每座敵城加多少守軍
  menStep: 200,       // 玩家每多少名士兵換一次
  enemyPerStep: 5,    // 每 200 名換成多少名敵軍（每座城）
  fieldBatch: 240,    // 累積到多少名才實際生出一支野戰軍
  maxArmies: 650      // 全域部隊上限，避免爆幀
};

function spawnEnemyFieldAt(cap, men) {
  if (!cap || cap.owner <= 0) return null;
  if (G.armies.length >= ENEMY_SCALE.maxArmies) return null;
  const sp = freeSpotNear(cap.x + 0.6, cap.y + 0.6);
  const a = addArmy(cap.owner, sp[0], sp[1], Math.min(men, FIELD_ARMY_MAX), cap, cap.zone);
  a.garrison = false;
  return a;
}

/* v25.1：改成「兵力換算」——
   我的守備軍每 200 名 → 敵方每座城 +5 名野戰軍
   我的野戰軍每 200 名 → 敵方每座城 +5 名守備軍
   （先累積在 cap.fRes，夠一批才真的生出一支部隊，免得滿地都是一人兵團） */
/* ══════════ v32：敵軍分兵 ══════════
   敵軍優勢生效後，主城無憂的野戰兵團會分兵（每支最多 2 個分兵團、各 ≤10% 兵力），
   分兵團專門去打玩家的城；同一支主兵團的分兵可以同時盯上 2 座不同的城。 */
/* ══════════ v33：敵軍守軍定期轉野戰軍 ══════════
   每 30 秒，敵方每座城的守軍抽出 10% 變成一支野戰軍（出城作戰）。 */
/* ══════════ v34：敵方人口轉守軍 ══════════
   每 15 秒，敵方每座城把人口的一部分轉成守軍；單城守軍上限 20000。 */
function popToGarrisonTick() {
  const CAP = 20000;
  for (const c of G.caps) {
    if (c.owner <= 0 || c.sieged) continue;   // v36：被圍攻中不徵兵
    const pop = c.pop || 0;
    if (pop < 400) continue;
    const held = c.held || 0;
    if (held >= CAP) continue;
    const take = Math.min(Math.floor(pop * 0.02), CAP - held, Math.floor(pop * 0.25));
    if (take < 20) continue;
    c.pop = pop - take;
    c.held = held + take;
  }
}

function garrisonConvertTick() {
  let made = 0;
  for (const c of G.caps) {
    if (c.owner <= 0 || c.sieged) continue;   // v36：被圍攻中不徵兵
    const held = c.held || 0;
    if (held < 500) continue;
    const take = Math.floor(held * 0.10);
    if (take < 100) continue;
    if (!factionAtWar(c.owner)) {     // v43：沒戰爭 → 留在城裡堆數字，不出城
      c.held = held - take;
      c.field = capFieldMen(c) + take;
      continue;
    }
    const a = spawnEnemyFieldAt(c, take);
    if (!a) continue;                 // 觸及部隊上限就不扣守軍
    c.held = held - take;
    made++;
  }
  if (made) rivalSig = '';
}

/* ══════════ v39：兵團合併（每國上限 250 支） ══════════
   超過上限時，把「人數最少的兵團」併進最近的友軍，人數全部吸收不損失。
   每次 tick 最多處理 20 次合併，避免一次大爆炸卡幀。 */
const ARMY_PER_FACTION = 250;

function mergeArmiesTick() {
  const byOwner = new Map();
  for (const a of G.armies) {
    if (!a.alive || a.garrison) continue;
    let list = byOwner.get(a.owner);
    if (!list) byOwner.set(a.owner, list = []);
    list.push(a);
  }
  let done = 0;
  for (const [own, list] of byOwner) {
    let arr = list;
    let guard = 0;
    while (arr.length > ARMY_PER_FACTION && guard++ < 20) {
      /* 找最小的一支，併進它最近的友軍 */
      let wi = 0;
      for (let i = 1; i < arr.length; i++) if (arr[i].men < arr[wi].men) wi = i;
      const weak = arr[wi];
      let best = null, bd = 1e9;
      for (const o of arr) {
        if (o === weak) continue;
        const d = Math.hypot(o.x - weak.x, o.y - weak.y);
        if (d < bd) { bd = d; best = o; }
      }
      if (!best) break;
      best.men += weak.men;
      best.g0 = Math.max(best.g0 || 0, best.men);
      killArmy(weak, true);
      arr = arr.filter(function (x) { return x !== weak; });
      done++;
    }
  }
  return done;
}

/* ══════════ v39.1：卡住的兵團自動脫困 ══════════
   每 0.5 秒取樣一次位移；連續 6 秒幾乎沒動、又不是守軍／集結／歸位／排隊，
   就往目標方向找一個空地把它挪過去（不會傳到很遠的地方）。 */
/* ══════════ v40：守備軍打完自己回城 ══════════
   出城作戰的守軍，只要城邊沒有敵人，就強制目標＝自家主城；
   走到 2.2 格內就直接「進城」變回數字（cap.held），不再站在野外。
   不受 think 計時器影響，所以不會出現「站著發呆」。 */
function updateGarrisons(dt) {
  G.garT = (G.garT || 0) + dt;
  if (G.garT < 0.5) return;
  G.garT = 0;
  for (const a of G.armies) {
    if (!a.alive || !a.garrison || !a.home) continue;
    /* v41：已經編進統合兵團的守備軍跟著主將跑，不強制回城、也不自動進城 */
    if (a.legion > 0) { a.returnHome = false; continue; }
    const cap = a.home;
    if (cap.owner !== a.owner) { a.returnHome = false; continue; }
    /* 城邊 8 格內有敵人 → 繼續作戰 */
    let threat = false;
    for (const o of G.armies) {
      if (!o.alive || o.owner === a.owner) continue;
      if (!hostileTo(a.owner, o.owner)) continue;
      if (Math.hypot(o.x - cap.x, o.y - cap.y) < 8) { threat = true; break; }
    }
    if (threat) { a.returnHome = false; continue; }
    const d = Math.hypot(a.x - cap.x, a.y - cap.y);
    a.returnHome = true;
    a.goal = { x: cap.x, y: cap.y };
    a.think = 0.8;
    const busy = (G.player && G.player.sel === a) || a.rally > 0 || a.returning;
    if (d < 2.2 && !busy) absorbGarrison(a);
  }
}

function updateStuckArmies(dt) {
  G.stuckT = (G.stuckT || 0) + dt;
  if (G.stuckT < 0.5) return;
  G.stuckT = 0;
  for (const a of G.armies) {
    if (!a.alive || a.garrison) continue;
    if (a.returning || a.rally > 0) { a._stkT = 0; continue; }
    if (a.assign && a.assign.hover) { a._stkT = 0; continue; }
    const lx = a._lkx, ly = a._lky;
    if (lx === undefined) { a._lkx = a.x; a._lky = a.y; continue; }
    if (Math.hypot(a.x - lx, a.y - ly) < 0.35) a._stkT = (a._stkT || 0) + 0.5;
    else a._stkT = 0;
    a._lkx = a.x; a._lky = a.y;
    /* v42：貼著地圖邊界卡住 → 先把目標換成「往內陸」的一個點，別沿著邊界磨 */
    if (a._stkT >= 2.0) {
      const M = 4;
      const nearEdge = a.x < M || a.y < M || a.x > WORLD_W - M || a.y > WORLD_H - M;
      if (nearEdge) {
        const cx = WORLD_W * 0.5, cy = WORLD_H * 0.5;
        const hx = a.home ? a.home.x : cx, hy = a.home ? a.home.y : cy;
        const tx = hx * 0.55 + cx * 0.45 + (Math.random() - 0.5) * 20;
        const ty = hy * 0.55 + cy * 0.45 + (Math.random() - 0.5) * 20;
        a.goal = { x: clamp(tx, M, WORLD_W - M), y: clamp(ty, M, WORLD_H - M) };
        a.path = null; a.pathI = 0;
        a.think = 3.5;
        a._stkT = 0;
        continue;
      }
    }
    if (a._stkT >= 6) {
      a._stkT = 0;
      const goal = a.goal;
      if (goal) {
        const ang = Math.atan2(goal.y - a.y, goal.x - a.x);
        const r = 4.0;
        for (let k = 0; k < 8; k++) {
          const x = a.x + Math.cos(ang + (k - 3.5) * 0.35) * r;
          const y = a.y + Math.sin(ang + (k - 3.5) * 0.35) * r;
          if (!G.board.isLand(Math.floor(x), Math.floor(y))) continue;
          if (blockedByUnit(G.board, a, x, y)) continue;
          if (cellArmyCount(a, Math.floor(x), Math.floor(y)) >= CELL_CAP) continue;
          a.x = x; a.y = y;
          a.goal = null; a.think = 0;
          break;
        }
      }
    }
  }
}

function enemySplitTick() {
  if (!enemyBuff() && G.zones.length < 11) return;
  const playerCaps = G.caps.filter(function (c) { return c.owner === 0; });
  if (!playerCaps.length) return;
  let budget = 10;
  for (const a of G.armies.slice()) {
    if (budget <= 0) break;
    if (!a.alive || a.owner <= 0 || a.garrison || a.split) continue;
    if ((a.splitsMade || 0) >= 2) continue;
    if (a.men < 900) continue;
    if (!a.home || a.home.owner !== a.owner) continue;
    if (cityThreatened(a.home)) continue;              // 主城無憂才分兵
    const near = playerCaps.slice().sort(function (p, q) {
      return Math.hypot(p.x - a.x, p.y - a.y) - Math.hypot(q.x - a.x, q.y - a.y);
    }).slice(0, 2);
    if (!near.length) continue;
    if (Math.hypot(near[0].x - a.x, near[0].y - a.y) > 90) continue;
    const tgt = near[(a.splitsMade || 0) % near.length];
    const men = Math.max(80, Math.round(a.men * 0.10));
    a.men -= men;
    const sp = freeSpotNear(a.x + (Math.random() - 0.5) * 0.9, a.y + (Math.random() - 0.5) * 0.9);
    const na = addArmy(a.owner, sp[0], sp[1], men, a.home, a.home.zone);
    na.split = true;
    na.parent = a.uid;
    na.target = tgt;
    na.legion = 0;
    a.splitsMade = (a.splitsMade || 0) + 1;
    budget--;
  }
}

function enemyScaleTick() {
  const mine = G.caps.filter(function (c) { return c.owner === 0; }).length;

  /* 1) 城池里程碑 → 敵方每城守軍 +2000 */
  const cityStep = mine > ENEMY_SCALE.cityStart
    ? Math.floor((mine - ENEMY_SCALE.cityStart) / ENEMY_SCALE.cityStep) : 0;
  if (cityStep > (G.scaleCity || 0)) {
    const add = cityStep - (G.scaleCity || 0);
    G.scaleCity = cityStep;
    for (let k = 0; k < add; k++) {
      for (const c of G.caps) if (c.owner > 0) addGarrison(c, ENEMY_SCALE.cityGarMen);
    }
    toast('敵軍增援　·　各城守軍 +' + (add * ENEMY_SCALE.cityGarMen));
  }

  /* 2) 我的守備兵力 → 敵方野戰軍 */
  const gSteps = Math.floor(playerGarrisonMen() / ENEMY_SCALE.menStep);
  if (gSteps > (G.scaleGarMen || 0)) {
    const add = gSteps - (G.scaleGarMen || 0);
    G.scaleGarMen = gSteps;
    const perCity = add * ENEMY_SCALE.enemyPerStep;
    for (const c of G.caps) if (c.owner > 0) c.field = capFieldMen(c) + perCity;
    toast('敵軍擴軍　·　各城野戰軍 +' + perCity + ' 兵');
  }
