  /* 3) 我的野戰兵力 → 敵方守備軍 */
  const fSteps = Math.floor(playerFieldMen() / ENEMY_SCALE.menStep);
  if (fSteps > (G.scaleFieldMen || 0)) {
    const add = fSteps - (G.scaleFieldMen || 0);
    G.scaleFieldMen = fSteps;
    const perCity = add * ENEMY_SCALE.enemyPerStep;
    for (const c of G.caps) if (c.owner > 0) addGarrison(c, perCity);
    toast('敵軍增援　·　各城守軍 +' + perCity + ' 兵');
  }

  /* v43：不再「累積夠就派兵」。兵力留在主城裡持續堆，
     只有真的開戰（factionAtWar）才由 enemyFieldTick 叫出城，單支上限 5000。 */
}

function spawnFieldArmyAt(cap, men, free) {
  men = men || 500;
  if (!cap) return null;
  const fieldCount = armyOf(0).filter(function (a) { return !a.garrison; }).length;
  if (fieldCount >= armyCapOf()) return null;
  let have = 0;
  if (free) {
    have = Math.min(men, Math.max(0, Math.floor((cap.pop || 0) - 200)));
    cap.pop = Math.max(0, (cap.pop || 0) - have);
  } else {
    const gm = garrisonMen(cap);
    if (gm > 100) { have = Math.min(men, Math.floor(gm - 100)); takeGarrison(cap, have); }
    if (have < men && G.garrisonPool > 0) {
      const t = Math.min(men - have, G.garrisonPool);
      G.garrisonPool -= t;
      have += t;
    }
  }
  if (have < 50) return null;
  const sp = freeSpotNear(cap.x + 0.5, cap.y + 0.5);
  const a = addArmy(0, sp[0], sp[1], have, cap, cap.zone);
  assignHomes();
  return a;
}

/* N：按比例抽守軍 → 補到「野戰軍最少的那座城」，先讓每城都有 3000，之後均攤往上加 */
function draftArmy() {
  if (G.state !== 'playing') return;
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  if (!caps.length) { toast('沒有主城可以抽調'); return; }
  let total = 0;
  for (const c of caps) {
    total += Math.max(0, garrisonMen(c) - 100);
  }
  if (total < 100) { toast('守軍不夠抽調'); return; }
  const ratio = clamp(G.draftRatio || 0.1, 0.02, 0.9);
  const want = Math.max(100, Math.floor(total * ratio));
  let got = 0;
  for (const c of caps) {
    const avail = Math.max(0, garrisonMen(c) - 100);
    if (avail <= 0) continue;
    const take = Math.min(avail, Math.round(want * (avail / total)));
    if (take < 10) continue;
    takeGarrison(c, take);
    got += take;
  }
  if (got < 50) { toast('守軍不夠抽調'); return; }

  /* v17：均攤 —— 每座城都要有一支野戰軍，抽到的人平分給所有城池。
     先以「每城 3000」為目標補；抽到的量不夠 3000 時，就照相同比例均分下去。 */
  const share = Math.max(1, Math.floor(got / caps.length));
  let rest = got;
  let created = 0;
  let touched = 0;

  for (const c of caps) {
    if (rest <= 0) break;
    let list = armyOf(0).filter(function (a) { return !a.garrison; });
    let army = list.find(function (a) { return a.home === c; });

    if (!army) {
      if (list.length + created >= armyCapOf()) {
        /* 兵團上限不夠 → 這份併進人數最少的一支，不強開新團 */
        const weakest = list.slice().sort(function (p, q) { return p.men - q.men; })[0];
        if (!weakest) break;
        const give = Math.min(rest, Math.max(1, share));
        weakest.men += give;
        rest -= give;
        continue;
      }
      const sp = freeSpotNear(c.x + 0.5, c.y + 0.5);
      army = addArmy(0, sp[0], sp[1], 0, c, c.zone);
      created++;
    }
    const give = Math.min(rest, Math.max(1, share));
    army.men += give;
    rest -= give;
    touched++;
  }

  /* 平均分不完的零頭，補給目前人數最少的野戰軍 */
  let guard = 0;
  while (rest > 0 && guard++ < 60) {
    const list = armyOf(0).filter(function (a) { return !a.garrison; });
    if (!list.length) break;
    const weakest = list.slice().sort(function (p, q) { return p.men - q.men; })[0];
    const give = Math.min(rest, Math.max(1, Math.floor(rest / list.length)));
    weakest.men += give;
    rest -= give;
  }

  const fieldNow = armyOf(0).filter(function (a) { return !a.garrison; });
  if (!G.player || !G.player.sel) G.player.sel = fieldNow[0] || null;
  assignHomes();
  toast('抽調　·　' + touched + ' 座城　·　共 ' + fmtMen(got) + ' 人成軍' +
        (created ? '（新編 ' + created + ' 支）' : ''));
  blip(620, 0.16, 0.05, 'triangle');
  updateHUD();
}

/* 解散兵團：均分到各城當守軍 */
/* v18.4：把一群人平均分到各城當守軍 */
function distributeToGarrisons(men) {
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  if (!caps.length || men <= 0) return 0;
  const per = Math.floor(men / caps.length);
  let given = 0;
  if (per > 0) {
    for (const c of caps) { addGarrison(c, per); given += per; }
  }
  const rest = men - given;
  if (rest > 0) { addGarrison(caps[0], rest); given += rest; }
  return given;
}

/* 一鍵解散：所有沒在交戰的野戰兵團解散，人數均分到各城守軍 */
function disbandAllField() {
  const list = armyOf(0).filter(function (a) { return !a.garrison; });
  if (!list.length) { toast('沒有野戰兵團'); return; }
  let total = 0, n = 0, busy = 0;
  for (const a of list) {
    let inFight = false;
    for (const o of G.armies) {
      if (o.alive && o.owner !== 0 && Math.hypot(o.x - a.x, o.y - a.y) < 3) { inFight = true; break; }
    }
    if (inFight) { busy++; continue; }
    total += a.men;
    n++;
    if (G.player && G.player.sel === a) G.player.sel = null;
    killArmy(a, true);
  }
  if (!n) { toast('兵團都在交戰中，無法解散'); return; }
  distributeToGarrisons(Math.round(total));
  const rest = armyOf(0);
  if (G.player) G.player.sel = rest.length ? rest[0] : null;
  toast('解散 ' + n + ' 支野戰兵團　·　' + Math.round(total) + ' 人轉為守軍' +
        (busy ? '（' + busy + ' 支交戰中留下）' : ''));
  updateHUD();
}

/* 一鍵均分：把所有守軍人數平均分到各城 */
function balanceGarrisons() {
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  if (caps.length < 2) { toast('只有一座城，不用均分'); return; }
  let total = 0;
  for (const c of caps) total += garrisonMen(c);
  if (total < 10) { toast('沒有守軍可以均分'); return; }
  const per = Math.floor(total / caps.length);
  let rest = total - per * caps.length;
  for (const c of caps) {
    const men = per + (rest > 0 ? 1 : 0);
    if (rest > 0) rest--;
    setGarrison(c, men);
  }
  toast('守軍均分　·　每城約 ' + Math.round(total / caps.length) + ' 人');
  updateHUD();
}

function disbandArmy(uid) {
  const a = G.armies.find(function (x) { return x.alive && x.owner === 0 && x.uid === uid; });
  if (!a) return;
  if (a.garrison) { toast('守軍不能解散'); return; }
  for (const o of G.armies) {
    if (o.alive && o.owner !== 0 && Math.hypot(o.x - a.x, o.y - a.y) < 3) { toast('交戰中，無法解散'); return; }
  }
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  if (!caps.length) { toast('沒有主城可以安置'); return; }
  const men = Math.round(a.men);
  const per = Math.floor(men / caps.length);
  for (const c of caps) addGarrison(c, per);
  const rest = men - per * caps.length;
  if (rest > 0) addGarrison(caps[0], rest);
  if (G.player && G.player.sel === a) G.player.sel = null;
  killArmy(a, true);
  const rest2 = armyOf(0);
  if (!G.player.sel && rest2.length) G.player.sel = rest2[0];
  toast('兵團解散　·　' + men + ' 人轉為守軍');
  updateHUD();
}

/* 一城一野戰軍：同城有第二支就搬到沒有野戰軍的城 */
function assignHomes() {
  const caps = G.caps.filter(function (c) { return c.owner === 0; });
  const field = armyOf(0).filter(function (a) { return !a.garrison; });
  if (!caps.length || !field.length) return;
  const used = {};
  for (const a of field) {
    const k = a.home ? caps.indexOf(a.home) : -1;
    if (k >= 0) used[k] = (used[k] || 0) + 1;
  }
  for (const a of field) {
    const k = a.home ? caps.indexOf(a.home) : -1;
    if (k >= 0 && used[k] <= 1) continue;
    const free = caps.findIndex(function (c, i) { return !used[i]; });
    if (free < 0) continue;                 // 城不夠才允許重複駐扎
    if (k >= 0) used[k]--;
    used[free] = 1;
    a.home = caps[free];
    a._lz = null;
    a.zone = caps[free].zone;
  }
}

/* ═══════════════════ 兵團（v7：沒有角色，只有兵團） ═══════════════════ */
function armyOf(owner) { return G.armies.filter(function (a) { return a.alive && a.owner === owner; }); }

/* 敵國強度倍率：隨區塊數成長（1.0 → 6）
   v8.1 已回調成 v7 的曲線（`0.5×區塊數`，上限 6）。
   `CFG.lateK` 留著當旋鈕：0 = v7 行為，0.02 ≈ 區塊 4 之後每塊再 +2%。 */
function zoneMul() {
  const z = G.zones.length;
  const late = 1 + CFG.lateK * Math.max(0, z - 4);
  return clamp(z * 0.5 * late, 1, CFG.zoneMulCap);
}

function addArmy(owner, x, y, men, homeCap, z) {
  const speed = owner === 0
    ? CFG.playerSpeed * 0.94
    : Math.min(CFG.aiSpeedMax, CFG.aiSpeedBase + CFG.aiSpeedPerZone * (G.zones.length - 1));
  const spot = freeSpotNear(x, y);
  const a = new Unit(owner, spot[0], spot[1], speed, 3);
  a.kind = 'army';
  a.men = men;
  a.uid = ++G.uidSeq;
  a.home = homeCap || null;
  a._lz = null;
  a.zone = z || null;
  a.alive = true;
  a.out = false;
  a.phase = Math.random() * 6.28;
  a.retarget = 0;
  a.tx = x; a.ty = y;
  a.storeT = 10;
  G.armies.push(a);
  return a;
}

/* ───────── v9：敵軍優勢的生效條件 ─────────
   敵人的守城優勢（主城傷害／減傷／城防／圍城壓制／全民皆兵／守軍增額）
   和多兵團集結優勢，要「奪取 10 塊之後」才生效；ESC 暫停畫面可以整個關掉。
   玩家自己的主城照舊生效，不受這個閘影響。 */
function enemyBuff() {
  if (!G.buffOn) return false;
  return G.zones.length > CFG.lateGate;
}

/* ══════════ v21b 國際關係 ══════════
   三種狀態：war（交戰）/ peace（和平）/ ally（同盟）。
   - 玩家只能「和平 / 宣戰」（不能結盟）。
   - AI 之間可以和平、交戰、同盟；是否會隨時間變動由 ESC 的開關決定。
   和平與同盟都不會交戰、不能吃對方地、不能圍對方城；同盟的部隊會互相支援。 */
function relKey(a, b) { return a < b ? a + ':' + b : b + ':' + a; }

function getRel(a, b) {
  if (a === b) return 'self';
  if (!G.rel) G.rel = {};
  const k = relKey(a, b);
  const r = G.rel[k];
  if (r) return r;
  /* 預設：玩家對所有人交戰；AI 之間也交戰（v21 開局就是大亂鬥） */
  return 'war';
}

function setRel(a, b, r) {
  if (a === b) return;
  if (!G.rel) G.rel = {};
  G.rel[relKey(a, b)] = r;
  rivalSig = '';
}

function isAllied(a, b) { return getRel(a, b) === 'ally'; }
function isPeace(a, b) {
  const r = getRel(a, b);
  return r === 'peace' || r === 'ally';
}
/* 兩方能不能互相打 */
function hostileTo(a, b) {
  if (a === b) return false;
  if (!G.diplo) return true;      // 外交還沒解鎖時，見面就打
  return getRel(a, b) === 'war';
}

function atWar(owner) {
  if (owner <= 0) return true;
  if (!G.diplo) return true;
  return getRel(0, owner) === 'war';
}

function setWar(owner, on) {
  if (!G.diplo) return;
  setRel(0, owner, on ? 'war' : 'peace');
  const r = G.rivals.find(function (x) { return x.owner === owner; });
  const nm = (r && r.name) || COLORS[owner].name;
  toast(nm + (on ? '　·　宣戰' : '　·　締結和平'));
  updateHUD();
}

/* 逐國戰史（只記玩家 vs 該國） */
function relLogOf(owner) {
  if (!G.relLog) G.relLog = {};
  let l = G.relLog[owner];
  if (!l) l = G.relLog[owner] = { killed: 0, ownLost: 0, cities: 0, armies: 0, since: Math.round(G.t) };
  return l;
}

/* AI 外交：每 90 秒跑一次，強弱差距大就求和／宣戰／結盟 */
function aiDiploTick() {
  if (!G.aiDiplo || !G.diplo) return;
  const alive = G.rivals.filter(function (r) { return !r.dead; }).map(function (r) { return r.owner; });
  if (alive.length < 2) return;
  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i], b = alive[j];
      if (Math.random() > 0.18) continue;
      const pa = ownerMen(a) + 1, pb = ownerMen(b) + 1;
      const ratio = Math.min(pa, pb) / Math.max(pa, pb);
      const r = getRel(a, b);
      if (r === 'war' && ratio < 0.45 && Math.random() < 0.5) setRel(a, b, 'peace');
      else if (r === 'peace' && Math.random() < 0.25) {
        const strong = pa > pb ? a : b, weak = pa > pb ? b : a;
        if (pa > pb * 1.8 || pb > pa * 1.8) setRel(a, b, 'war');
        else if (Math.random() < 0.25) setRel(a, b, 'ally');
      }
    }
  }
}

/* v15：手動開啟下一輪（ESC 關掉「自動開啟下一輪」時用） */
function startNextZone() {
  if (!G.waitingNext) return;
  if ((G.nextUses || 0) <= 0) { toast('這一輪的開啟次數已經用完'); return; }
  G.nextUses--;
  if (!openNextZone()) {
    G.waitingNext = false;
    G.state = 'victory';
    renderVictory();
  } else {
    toast('第 ' + G.zones.length + ' 塊　·　還能再開 ' + Math.max(0, G.nextUses) + ' 次');
    if (G.nextUses <= 0) G.waitingNext = false;
  }
  updateHUD();
}

/* v15：自動存檔（獨立槽，每 60 秒一次，不佔用三個手動槽） */
function autoSaveTick(dt) {
  if (!G.autoSave) return;
  G.autoT = (G.autoT || 0) + dt;
  if (G.autoT < 60) return;
  G.autoT = 0;
  saveToSlot('auto');
}

/* v21：第二大陸機制已移除（整片大陸打完就是最終勝利） */

/* ───────── v8 守城優勢 ─────────
   1) capMul   ：離自己主城越近，打出去的傷害越高（傷害倍率 1.7 → 3.2）
   2) homeArmor：離自己主城越近，承受的傷害越低（0.58 → 1.0）
   兩者相乘，在自己的主城範圍內作戰大概是原本的 2~5 倍強度。
   原本只有「4.5 格內 ×1.75」一檔，城牆感很薄。 */
function capMul(a) {
  if (a.owner > 0 && !enemyBuff()) return 1;
  let best = 1;
  for (const c of G.caps) {
    if (c.owner !== a.owner) continue;
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d <= 3.5) best = Math.max(best, 3.2);
    else if (d <= 8) best = Math.max(best, 2.4);
    else if (d <= 13) best = Math.max(best, 1.7);
  }
  return best;
}

function homeArmor(a) {
  if (a.owner > 0 && !enemyBuff()) return 1;
  for (const c of G.caps) {
    if (c.owner !== a.owner) continue;
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d <= 4) return 0.58;
    if (d <= 9) return 0.78;
    if (d <= 14) return 0.92;
  }
  return 1;
}

/* ───────── v8 多兵團作戰優勢 ─────────
   同一陣營 8 格內每多一支友軍，這支的傷害 +4%（v8.1 從 28% 下調，上限維持 ×3.2）。
   敵國兵團數沒有上限，所以這條對敵國的中後期加成比較明顯；
   守軍也吃這條，等於「守城時城裡擠越多部隊越難打」。 */
function focusMul(a, arr) {
  if (a.owner > 0 && !enemyBuff()) return 1;
  arr = arr || G.armies;
  let n = 0;
  for (const o of arr) {
    if (o === a || !o.alive || o.owner !== a.owner) continue;
    if (Math.hypot(o.x - a.x, o.y - a.y) <= CFG.focusRadius) n++;
  }
  return Math.min(CFG.focusCap, 1 + CFG.focusStep * n);
}

function killArmy(a, quiet) {
  if (!a.alive) return;
  a.alive = false;
  if (a.owner === 0) warStats().armiesLost++;        // v19：戰史
  else if (a.owner > 0) warStats().killedArmies++;
  if (!quiet) for (let k = 0; k < 10; k++) spawnPart(a.x, a.y, COLORS[a.owner].css, 0.7, 0.6);
  const i = G.armies.indexOf(a);
  if (i >= 0) G.armies.splice(i, 1);
  if (G.player && G.player.sel === a) {
    const rest = armyOf(0);
    G.player.sel = rest.length ? rest[0] : null;
    if (G.player.sel) toast('兵團被殲滅　·　改由另一支接管');
  }
}

/* 兵團互撞：兵力多、離自己主城近、身邊友軍多的一方，都能讓對方消耗更快。
   v8 傷害公式：
     a 損失 = 11 · dt · (0.4 + o兵/1000) · capMul(o) · focus(o) · homeArmor(a)
   也就是「打人的那方」吃主城加成與集結加成，「挨打的那方」吃主城減傷。 */
function resolveCombat(dt) {
  const arr = G.armies.filter(function (a) { return a.alive; });
  /* 每個兵團的加成先算一次再進 O(n²) 迴圈：
     capMul / homeArmor 都要掃全城主城，放在配對迴圈裡會變成 O(n²×主城數)，
     大後期上百支兵團時會直接掉幀。 */
  for (const a of arr) {
    a._focus = focusMul(a, arr);
    a._cm = capMul(a);
    a._ar = homeArmor(a);
  }
  /* v21.2：空間分桶 —— 300+ 支兵團時 O(n²) 會吃掉整幀，
     改成一格 4 格的桶，只跟同桶與相鄰 8 桶比對。 */
  if (arr.length > 90) {
    const CELL = 4;
    const grid = new Map();
    for (const a of arr) {
      const k = ((a.x / CELL) | 0) * 4096 + ((a.y / CELL) | 0);
      let bucket = grid.get(k);
      if (!bucket) grid.set(k, bucket = []);
      bucket.push(a);
    }
    const hit = function (a, o) {
      if (!o.alive || o.owner === a.owner) return;
      if (a.owner > 0 && o.owner > 0) return;
      if (!hostileTo(a.owner, o.owner)) return;
      const dx = a.x - o.x, dy = a.y - o.y;
      if (dx * dx + dy * dy > 1.1025) return;
      const dA = 11 * dt * (0.4 + o.men / 1000) * o._cm * o._focus * a._ar * unitAtk(o) / unitDef(a);
      const dO = 11 * dt * (0.4 + a.men / 1000) * a._cm * a._focus * o._ar * unitAtk(a) / unitDef(o);
      a.men -= dA;
      o.men -= dO;
      mobOf(a.owner).lost += dA;
      mobOf(o.owner).lost += dO;
      const wlog = warStats();
      if (a.owner === 0) { wlog.ownLost += dA; wlog.killed += dO; relLogOf(o.owner).ownLost += dA; relLogOf(o.owner).killed += dO; }
      else if (o.owner === 0) { wlog.ownLost += dO; wlog.killed += dA; relLogOf(a.owner).ownLost += dO; relLogOf(a.owner).killed += dA; }
      if (Math.random() < dt * 7) spawnPart((a.x + o.x) / 2, (a.y + o.y) / 2, '#ffd6a0', 0.6, 0.5);
    };
    for (const a of arr) {
      if (!a.alive) continue;
      const gx = (a.x / CELL) | 0, gy = (a.y / CELL) | 0;
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const bucket = grid.get((gx + dx) * 4096 + (gy + dy));
          if (!bucket) continue;
          for (const o of bucket) {
            if (o === a) continue;
            if (o.uid < a.uid) continue;      // 每對只算一次
            hit(a, o);
          }
        }
      }
    }
  } else {
  for (let i = 0; i < arr.length; i++) {
    const a = arr[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < arr.length; j++) {
      const o = arr[j];
      if (!o.alive || o.owner === a.owner) continue;
      /* v17：敵國之間結盟，不自相殘殺 —— 只跟玩家打 */
      if (a.owner > 0 && o.owner > 0) continue;
      /* v14 外交：和平的兩國不交戰 */
      if (!hostileTo(a.owner, o.owner)) continue;
      if (Math.hypot(a.x - o.x, a.y - o.y) > 1.05) continue;
      const dA = 11 * dt * (0.4 + o.men / 1000) * o._cm * o._focus * a._ar * unitAtk(o) / unitDef(a);
      const dO = 11 * dt * (0.4 + a.men / 1000) * a._cm * a._focus * o._ar * unitAtk(a) / unitDef(o);
      a.men -= dA;
      o.men -= dO;
      mobOf(a.owner).lost += dA;        // v18.3：累積戰損，用來判斷要不要全國動員
      mobOf(o.owner).lost += dO;
      const wlog = warStats();          // v19：記進戰史
      if (a.owner === 0) { wlog.ownLost += dA; wlog.killed += dO; relLogOf(o.owner).ownLost += dA; relLogOf(o.owner).killed += dO; }
      else if (o.owner === 0) { wlog.ownLost += dO; wlog.killed += dA; relLogOf(a.owner).ownLost += dO; relLogOf(a.owner).killed += dA; }
      if (Math.random() < dt * 7) spawnPart((a.x + o.x) / 2, (a.y + o.y) / 2, '#ffd6a0', 0.6, 0.5);
    }
  }
  }
  for (const a of G.armies.slice()) if (a.alive && a.men <= 0.5) killArmy(a);
}

/* 兵團 AI：守自家主城 > 攔截敵軍 > 攻敵方主城 > 吃地 */
/* ══════════ v18：目標分配 ══════════
   每個國家每隔 1 秒重算一次：把能動的野戰兵團**平均分到各座敵方主城**，
   每個目標最多 3 支（前 3 支去圍城，其他的在 4.2 格外排隊遊走，不擠在城下）。
   某支打光了，下一輪分配就把排隊的補上去。 */
function nearestTargetDist(a, targets) {
  let bd = 1e9;
  for (const c of targets) {
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d < bd) bd = d;
  }
  return bd;
}
function nearestTarget(a, targets) {
  let best = null, bd = 1e9;
  for (const c of targets) {
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

/* v18.2：目標三層優先 —— 野戰軍 > 守備軍 > 城池；每層每個目標最多 3 支 */
function targetPos(t) {
  if (t.kind === 'cap') return t.c ? { x: t.c.x, y: t.c.y } : null;
  return t.a && t.a.alive ? { x: t.a.x, y: t.a.y } : null;
}

function buildTargetTiers() {
  const field = [], gar = [], caps = [];
  for (const a of G.armies) {
    if (!a.alive) continue;
    const t = { kind: 'army', a: a, owner: a.owner };
    (a.garrison ? gar : field).push(t);
  }
  for (const c of G.caps) {
    if (!c.district) continue;
    caps.push({ kind: 'cap', c: c, owner: c.owner });
  }
  return [field, gar, caps];
}

/* v18.3：動員等級
   一開始不全國總動員，只讓「搶得到攻擊名額」的局部部隊去打；
   等戰損累積到 10000 人或佔下超過總城池數 1/20，才全國總動員（所有人出擊、排隊補位）。 */
/* ══════════ v19：戰史 ══════════
   記錄「這一場戰爭」的帳：殲滅多少敵軍、我方陣亡多少、兵團損失幾支、城池淨得幾座。
   全國動員的門檻就讀這本帳。 */
function warStats() {
  if (!G.warLog) {
    G.warLog = { killed: 0, ownLost: 0, armiesLost: 0, killedArmies: 0, cities: 0, ended: false, full: false };
  }
  return G.warLog;
}

function mobOf(owner) {
  if (!G.mob) G.mob = {};
  let m = G.mob[owner];
  if (!m) m = G.mob[owner] = { lost: 0, caps: 0, full: false };
  return m;
}
/* ══════════ v20：叛亂 ══════════
   在自己國內切出一塊「連通」的地區獨立成新勢力，
   繼承該區的人口、守軍與駐扎的野戰軍；接著可以選擇要玩舊政權還是叛軍。 */
function playerDistricts() {
  const out = [];
  for (const z of G.zones) for (const d of z.districts) if (d.owner === 0) out.push(d);
  return out;
}

function freeOwnerColor() {
  const used = {};
  for (const r of G.rivals) if (!r.dead) used[r.owner] = 1;
  for (let o = 1; o < COLORS.length; o++) if (!used[o]) return o;
  return -1;
}

/* 從一個地區往外長，只挑彼此相接的，確保叛亂區是連通的 */
function pickConnectedDistricts(list, want) {
  if (!list.length) return [];
  const cellMap = new Map();
  for (const d of list) for (const i of d.cells) cellMap.set(i, d);
  const start = list[(Math.random() * list.length) | 0];
  const chosen = [start];
  /* 用物件本身當 key：地區 id 每個區塊都從 0 重編，用 id 會誤判成同一塊 */
  const seen = new Set([start]);
  const queue = [start];
  while (queue.length && chosen.length < want) {
    const cur = queue.shift();
    const nb = [];
    for (const i of cur.cells) {
      const cand = [cellMap.get(i - 1), cellMap.get(i + 1),
                    cellMap.get(i - WORLD_W), cellMap.get(i + WORLD_W)];
      for (const n of cand) {
        if (!n || seen.has(n)) continue;
        seen.add(n);
        nb.push(n);
      }
    }
    for (const n of nb) {
      if (chosen.length >= want) break;
      chosen.push(n);
      queue.push(n);
    }
  }
  return chosen;
}

function startRebellion() {
  if (G.state !== 'playing' && G.state !== 'paused') return;
  const ds = playerDistricts();
  if (ds.length < 2) { toast('至少要有 2 個地區才能叛亂'); return; }
  const R = freeOwnerColor();
  if (R < 0) { toast('沒有多餘的勢力顏色可以給叛軍'); return; }
  const maxN = Math.max(1, Math.floor(ds.length * 0.4));   // 上限 40%
  let want = G.rebelRandom ? (1 + Math.floor(Math.random() * maxN))
                           : Math.max(1, Math.min(maxN, G.rebelCount || 1));
  want = Math.max(1, Math.min(maxN, want));
  const set = pickConnectedDistricts(ds, want);
  if (!set.length) { toast('找不到可叛亂的連通地區'); return; }

  for (const d of set) {
    d.owner = R;
    if (d.cap) { d.cap.owner = R; G.board.setOwner(d.cap.i, R); }
    for (const i of d.cells) G.board.setOwner(i, R);
    mobOf(R).caps++;
  }
  /* v20.1：只把「叛亂地區的」資產轉給叛軍 ——
     1) 駐地在叛亂地區的部隊（守軍與野戰軍都算）
     2) 當下站在叛亂地區土地上的部隊
     其餘（沒叛亂地區的城池、人口、守軍、野戰軍）一律留在原政權手上。 */
  /* v20.1：只把「叛亂地區的」資產轉給叛軍 ——
     駐地在叛亂地區的部隊（守軍與野戰軍都算）才跟著走；
     路過的友軍、以及沒叛亂地區的城池／人口／守軍／野戰軍，一律留在原政權手上。 */
  const setIds = new Set(set);          // 用地區物件本身，不用 id（跨區塊 id 會重複）
  for (const a of G.armies) {
    if (!a.alive) continue;
    if (a.home && a.home.district && setIds.has(a.home.district)) a.owner = R;
  }
  const nm = '叛軍';
  G.rivals.push({ owner: R, name: nm, dead: false });
  rivalSig = ''; capSig = ''; armySig = '';
  G.rebelChoice = { owner: R, count: set.length };
  G.state = 'paused';
  renderRebelChoice(R, set);
  updateHUD();
}

/* 選邊站之後換手：把 0 與 R 兩邊的資產互換，玩家就變成另一邊 */
function swapSides(R) {
  const bd = G.board;
  for (let i = 0; i < bd.n; i++) {
    const o = bd.owner[i];
    if (o === 0) bd.setOwner(i, R);
    else if (o === R) bd.setOwner(i, 0);
  }
  for (const c of G.caps) {
    if (c.owner === 0) c.owner = R;
    else if (c.owner === R) c.owner = 0;
  }
  for (const z of G.zones) {
    for (const d of z.districts) {
      if (d.owner === 0) d.owner = R;
      else if (d.owner === R) d.owner = 0;
    }
  }
  for (const a of G.armies) {
    if (a.owner === 0) a.owner = R;
    else if (a.owner === R) a.owner = 0;
  }
  const ri = G.rivals.findIndex(function (r) { return r.owner === R && !r.dead; });
  if (ri >= 0) G.rivals.splice(ri, 1);
  G.rivals.push({ owner: R, name: '舊王朝', dead: false });
  delete G.wars[R];
  G.warLog = null;          // 換邊 = 新的一場戰爭
  G.mob = {};
  G.player = { sel: null };
  const mine = armyOf(0);
  G.player.sel = mine.length ? mine[0] : null;
  rivalSig = ''; capSig = ''; armySig = '';
}

function fullMob(owner) {
  if (owner === 0) {
    const w = warStats();
    if (w.full) return true;
    const capNeed = Math.max(1, Math.ceil(G.caps.length / 20));
    if (w.ownLost >= 10000 || w.cities >= capNeed) {
      w.full = true;
      toast('全國總動員　·　所有兵團出擊');
      return true;
    }
    return false;
  }
  const m = mobOf(owner);
  if (m.full) return true;
  const capNeed = Math.max(1, Math.ceil(G.caps.length / 20));
  if (m.lost >= 10000 || m.caps >= capNeed) {
    m.full = true;
    return true;
  }
  return false;
}

function assignTargets() {
  const sel = G.player && G.player.sel;
  const pending = [];
  for (const a of G.armies) {
    if (!a.alive || a === sel || a.garrison) continue;
    if (a.returning || a.rally > 0) { a.assign = null; continue; }
    a.assign = null;
    pending.push(a);
  }
  if (!pending.length) return;
  const tiers = buildTargetTiers();

  /* 依優先層一層一層填：先野戰軍，再守備軍，最後才是城池 */
  for (let pri = 0; pri < 3 && pending.length; pri++) {
    const list = tiers[pri];
    if (!list.length) continue;
    const scored = [];
    for (const t of list) {
      const p = targetPos(t);
      if (!p) continue;
      /* v42：兵力不足以圍下有守軍的城 → 不要排這個目標（避免整隊衝進敵人大本營被圍毆） */
      if (t.c) {
        const def = capDefenders(t.c, 8);
        let mine = 0;
        for (const a of pending) {
          if (!inLocalZones(a, p.x, p.y)) continue;
          if (Math.abs(a.x - p.x) > 18 || Math.abs(a.y - p.y) > 18) continue;
          mine += a.men;
        }
        if (mine < def * 0.55 + 200) continue;
      }
      let bd = 1e9;
      for (const a of pending) {
        if (t.owner === a.owner) continue;
        if (!inLocalZones(a, p.x, p.y)) continue;
        const d = Math.hypot(p.x - a.x, p.y - a.y);
        if (d < bd) bd = d;
      }
      if (bd < 1e9) scored.push({ t: t, d: bd });
    }
    scored.sort(function (p, q) { return p.d - q.d; });
    for (const s of scored) {
      let n = 0;
      while (n < 3 && pending.length) {
        const p = targetPos(s.t);
        if (!p) break;
        let bi = -1, bd = 1e9;
        for (let i = 0; i < pending.length; i++) {
          const a = pending[i];
          if (s.t.owner === a.owner) continue;
          if (!hostileTo(a.owner, s.t.owner)) continue;   // v21b：不打和平／同盟
          if (!inLocalZones(a, p.x, p.y)) continue;       // v22：就近
          const d = Math.hypot(p.x - a.x, p.y - a.y);
          if (d < bd) { bd = d; bi = i; }
        }
        if (bi < 0) break;
        const a = pending.splice(bi, 1)[0];
        a.assign = { kind: s.t.kind, a: s.t.a || null, c: s.t.c || null, slot: n, hover: false };
        n++;
      }
    }
  }

  /* 還是沒派到工的 → 在最近的敵人外圈排隊等補位 */
  for (const a of pending) {
    let best = null, bd = 1e9;
    for (let pri = 0; pri < 3; pri++) {
      for (const t of tiers[pri]) {
        if (t.owner === a.owner) continue;
        if (!hostileTo(a.owner, t.owner)) continue;
        const p = targetPos(t);
        if (!p || !inLocalZones(a, p.x, p.y)) continue;
        if (!p) continue;
        const d = Math.hypot(p.x - a.x, p.y - a.y);
        if (d < bd) { bd = d; best = t; }
      }
      if (best && pri === 0) break;      // 有野戰軍目標就不再往低層找
    }
    if (best && fullMob(a.owner)) {
      /* 只有全國總動員之後才允許「排隊等補位」；局部階段搶不到名額就留在家裡 */
      a.assign = { kind: best.kind, a: best.a || null, c: best.c || null, slot: -1, hover: true };
    }
  }
}

function assignValid(a) {
  const t = a.assign;
  if (!t) return false;
  if (t.kind === 'cap') return !!(t.c && t.c.district && t.c.owner !== a.owner);
  return !!(t.a && t.a.alive && t.a.owner !== a.owner);
}

/* 站位：城池站 120° 三方位；追擊部隊時錯開一點；排隊的在外圈 */
function assignSpot(a) {
  const t = a.assign;
  if (!t) return null;
  const b = G.board;
  const pos = targetPos(t);
  if (!pos) return null;
  if (t.hover) {
    const ang = (a.uid % 12) * (TAU / 12) + 0.3;
    for (const r of [4.2, 5.0, 3.6]) {
      const x = pos.x + Math.cos(ang) * r, y = pos.y + Math.sin(ang) * r;
      if (b.isLand(Math.floor(x), Math.floor(y))) return { x: x, y: y };
    }
    return null;
  }
  const ang = t.slot * (TAU / 3) + 0.5;
  const rads = t.kind === 'cap' ? [1.15, 1.45, 0.9] : [0.55, 0.8, 0.4];
  for (const r of rads) {
    const x = pos.x + Math.cos(ang) * r, y = pos.y + Math.sin(ang) * r;
    if (b.isLand(Math.floor(x), Math.floor(y))) return { x: x, y: y };
  }
  return { x: pos.x, y: pos.y };
}

/* ══════════ v22：就近原則 ══════════
   兵團只在「自家主城所在區塊 + 緊鄰區塊」活動，不會再長途跋涉去打遠方的城。 */
function zoneAt(x, y) {
  if (!G.zoneMap || G.zoneMapN !== G.zones.length) {
    G.zoneMap = new Map();
    for (const z of G.zones) G.zoneMap.set(z.gx + ',' + z.gy, z);
    G.zoneMapN = G.zones.length;
  }
  return G.zoneMap.get(Math.floor(x / ZW) + ',' + Math.floor(y / ZH)) || null;
}

function localZoneKeys(a) {
  if (a._lz) return a._lz;
  const out = new Set();
  const z = a.home ? zoneAt(a.home.x, a.home.y) : zoneAt(a.x, a.y);
  if (z) {
    out.add(z.gx + ',' + z.gy);
    for (const d of [[1,0],[-1,0],[0,1],[0,-1]]) {
      out.add((z.gx + d[0]) + ',' + (z.gy + d[1]));
    }
  }
  a._lz = out;
  return out;
}

function inLocalZones2(a, x, y) {
  const z = a.home ? zoneAt(a.home.x, a.home.y) : zoneAt(a.x, a.y);
  if (!z) return true;
  const gx = Math.floor(x / ZW), gy = Math.floor(y / ZH);
  return Math.abs(gx - z.gx) <= 2 && Math.abs(gy - z.gy) <= 2;
}

function inLocalZones(a, x, y) {
  return localZoneKeys(a).has(Math.floor(x / ZW) + ',' + Math.floor(y / ZH));
}

function armyThink(a, dt, b) {
  /* v39.1：抵達目標後一直站著 → 1.5 秒後清掉目標讓 AI 重新選 */
  if (a.goal && !a.garrison && !a.assign && !a.returning && a.rally <= 0) {
    if (Math.hypot(a.goal.x - a.x, a.goal.y - a.y) < 0.4) {
      a.arriveT = (a.arriveT || 0) + dt;
      if (a.arriveT > 1.5) { a.goal = null; a.think = 0; a.arriveT = 0; }
    } else {
      a.arriveT = 0;
    }
  }
  /* v32：分兵團直奔目標城池 */
  if (a.split && a.target && a.target.owner === 0) {
    a.goal = { x: a.target.x, y: a.target.y };
    a.think = 0.5;
    stepTo(b, a, a.target.x, a.target.y, dt, 1);
    applyBrush(b, a, dt);
    return;
  }
  /* v31：統合兵團——盡可能維持隊形；敵人貼到 7 格內才交回對敵 AI；
     離主將太遠超過 3 秒就直接傳送回隊形（避免掉隊卡住）。 */
  if (a.owner === 0 && a.legion > 0) {
    const lead0 = legionLeaderOf(a.legion);
    if (lead0 && lead0 !== a) {
      const dist = Math.hypot(a.x - lead0.x, a.y - lead0.y);
      /* v41：牽繩——只有「真的在打」（自己或主將 2.6 格內有敵人）才放寬；
         其餘任何情況，離主將超過 8 格 1.5 秒就拉回陣位，絕不放著他亂跑。 */
      const engaged = enemyNearMe(a, 2.6) || enemyNearMe(lead0, 3.0);
      const leash = engaged ? 8.5 : 6.0;
      const doTeleport = function () {
        const sp0 = legionSpotSafe(a);
        if (sp0 && G.board.isLand(Math.floor(sp0.x), Math.floor(sp0.y))) {
          a.x = sp0.x; a.y = sp0.y;
          a.farT = 0; a.growT = 0; a.lastDist = 0;
          a.think = 0.2;
          return true;
        }
        return false;
      };
      if (dist > leash) {
        a.farT = (a.farT || 0) + dt;
        if (a.farT >= (engaged ? 2.5 : 1.2)) { if (doTeleport()) return; }
      } else {
        a.farT = 0;
      }
      a.lastDist = dist;
      a.growT = 0;
      /* v41：集結令優先——按 O 時整隊（含守備軍）一起湊到你身邊，不是站回陣位 */
      if (a.rally > 0) {
        a.rally = Math.max(0, a.rally - dt);   /* 這條分支會 return，倒數要在這裡自己做 */
        const cu0 = controlledUnit();
        if (cu0 && cu0 !== a) {
          a.goal = { x: cu0.x, y: cu0.y };
          a.think = 0.4;
          stepTo(b, a, cu0.x, cu0.y, dt, gapSpeed(a, dist));
          applyBrush(b, a, dt);
          return;
        }
      }
      /* v41：隊形優先——只有自己或主將 5 格內真的開打才離隊，
         而且離陣位超過 4 格就先回去，避免成員「隨便跑」。 */
      const slotA = legionSpotSafe(a);
      const offSlot = slotA ? Math.hypot(a.x - slotA.x, a.y - slotA.y) : 0;
      const wantFight = enemyNearMe(a, 5) || enemyNearMe(lead0, 5);
      if (!wantFight || offSlot > 4) {
        if (slotA) {
          a.goal = { x: slotA.x, y: slotA.y };
          a.think = 0.4;
          stepTo(b, a, slotA.x, slotA.y, dt, gapSpeed(a, dist));
          applyBrush(b, a, dt);
          return;
        }
      }
    }
  }
  /* v18：有派工就照派工走（站到自己的方位），不受一般 AI 干擾 */
  if (a.assign) {
    if (!assignValid(a)) {
      a.assign = null;
    } else {
      const spot = assignSpot(a);
      if (spot) {
        a.goal = { x: spot.x, y: spot.y };
        a.think = 0.6;
        stepTo(b, a, spot.x, spot.y, dt, 1);
        applyBrush(b, a, dt);
        return;
      }
    }
  }
  // 已經站在敵方主城上：守著把圍城跑完，不要中途跑去吃地
  if (a.goal && a.goal.prog !== undefined && a.goal.owner !== a.owner &&
      Math.hypot(a.goal.x - a.x, a.goal.y - a.y) < 2.0) {
    a.think = 0.6;
    const hx2 = a.goal.x - a.x, hy2 = a.goal.y - a.y, hd2 = Math.hypot(hx2, hy2);
    if (hd2 > 0.06) moveUnit(b, a, hx2 / hd2, hy2 / hd2, dt, 1);
    applyBrush(b, a, dt);
    return;
  }
  if (a.rally > 0) a.rally = Math.max(0, a.rally - dt);   // v10 集結倒數
  a.think = (a.think || 0) - dt;
  if (a.think <= 0 || !a.goal) {
    a.think = 0.7 + Math.random() * 0.7;
    a.goal = null;
    /* v10 集結令：被召集的本國野戰兵團直接往你操控的那支靠攏。
       v13 歸位令：被派回原地的兵團往自家主城走，到了就停在城邊待命。
       守軍兩條都不跟（城還是要有人看）。 */
    if (a.owner === 0 && a.garrison && a.rally > 0) {
      /* v26：守軍被集結令點名 → 出城跟著玩家走（原本這裡被 !a.garrison 擋掉） */
      const cu = controlledUnit();
      if (cu && cu !== a) a.goal = { x: cu.x, y: cu.y };
      stepTo(b, a, a.goal.x, a.goal.y, dt, 1);
      applyBrush(b, a, dt);
      return;
    }
    if (a.owner === 0 && !a.garrison) {
      if (a.rally > 0) {
        const cu = controlledUnit();
        if (cu && cu !== a) a.goal = { x: cu.x, y: cu.y };
      } else if (a.returning) {
        /* 回程或駐地時被敵人貼上就自動解除歸位、正常接戰，不要站著挨打 */
        let foe = false;
        for (const o of G.armies) {
          if (!o.alive || o.owner === a.owner) continue;
          if (Math.hypot(o.x - a.x, o.y - a.y) < 8) { foe = true; break; }
        }
        if (foe) {
          a.returning = false;
          a.idleT = 0;
        } else {
          const hp = homePoint(a);
          if (hp) {
            const homeD = Math.hypot(hp.x - a.x, hp.y - a.y);
            if (homeD <= 1.4) {
              /* v39.2：抵達後「待命」20 秒就恢復正常 AI。
                 原本 a.returning 永遠不清，兵團回到家就再也不出門，
                 整張地圖的野戰軍全擠在城上發呆。 */
              a.idleT = (a.idleT || 0) + dt;
              if (a.idleT >= 20) {
                a.returning = false;
                a.idleT = 0;
                a.goal = null;
                a.think = 1.0 + Math.random() * 0.8;
              } else {
                a.goal = { x: hp.x, y: hp.y };
                a.think = 1.2;
              }
            } else {
              a.idleT = 0;
              a.goal = { x: hp.x, y: hp.y };
            }
          } else {
            a.returning = false;
          }
        }
      }
    }
    if (a.garrison && a.home && a.returnHome) {
      /* v40：已經被標記「該回家了」→ 直接往城走，不再重新挑敵人 */
      const hp0 = a.home;
      a.goal = { x: hp0.x, y: hp0.y };
      stepTo(b, a, hp0.x, hp0.y, dt, 1);
      applyBrush(b, a, dt);
      return;
    }
    if (!a.goal && a.garrison && a.home) {
      let foe = null, fd = 1e9;
      for (const o of G.armies) {
        if (!o.alive || o.owner === a.owner) continue;
        if (a.owner > 0 && o.owner > 0) continue;              // v17：敵國結盟
        if (!hostileTo(a.owner, o.owner)) continue;
        const d = Math.hypot(o.x - a.x, o.y - a.y);
        if (d < fd) { fd = d; foe = o; }
      }
      /* v17：守備軍不主動出戰 —— 只有敵人貼到城下（6 格內）或集結令點名才動 */
      if (foe && fd < 6) a.goal = foe;
      else a.goal = { x: a.home.x, y: a.home.y };
      stepTo(b, a, a.goal.x, a.goal.y, dt, 1);   // v15：守軍也會繞路
      applyBrush(b, a, dt);
      return;
    }
    // 1) 自家主城被敵人圍 → 回防（v8：32 格內所有部隊都會回防，不只守軍）
    if (a.home && a.home.owner === a.owner) {
      const sg = siegerOf(a.home);
      if (sg !== -2 && sg !== a.owner) a.goal = a.home;
    }
    if (!a.goal && a.owner > 0) {
      for (const c of G.caps) {
        if (c.owner !== a.owner) continue;
        if (Math.hypot(c.x - a.x, c.y - a.y) > 32) continue;
        const sg = siegerOf(c);
        if (sg !== -2 && sg !== a.owner) { a.goal = c; break; }
      }
    }
    // 2) 敵軍在附近 → 攔截；友軍已經在打同一個目標就一起上（v8 集結）
    if (!a.goal) {
      let near = null, nd = 1e9;
      for (const o of G.armies) {
        if (!o.alive || o.owner === a.owner) continue;
        if (a.owner > 0 && o.owner > 0) continue;            // v17：敵國結盟，只打玩家
        /* v14 外交：不去打已經和平的國家，也不被和平國家的部隊引走 */
        if (!hostileTo(a.owner, o.owner)) continue;
        if (!inLocalZones(a, o.x, o.y)) continue;     // v22：只打附近區塊的敵人
        const d = Math.hypot(o.x - a.x, o.y - a.y);
        let eff = d;
        if (a.owner > 0 && d < 30) {
          for (const m of G.armies) {
            if (m === a || !m.alive || m.owner !== a.owner) continue;
            if (Math.hypot(m.x - o.x, m.y - o.y) < 9) { eff = d * 0.72; break; }
          }
        }
        if (eff < nd) { nd = eff; near = o; }
      }
      if (G.grace > 0 && near && near.owner === 0) near = null;
      if (near && nd < 16 + 16 * aggroMul()) {
        // v8 撤退判斷改成看「附近友軍的總兵力」：不再因為自己一支比較小就全線逃跑
        let allyMen = 0;
        if (a.owner > 0) {
          for (const m of G.armies) {
            if (!m.alive || m.owner !== a.owner) continue;
            if (Math.hypot(m.x - near.x, m.y - near.y) < 12) allyMen += m.men;
          }
        }
        if (a.owner > 0 && a.home && allyMen < near.men * 0.45) a.goal = a.home;
        else a.goal = near;
      }
    }
    // 3) 敵方主城在附近 → 去打（AI 才有壓迫感）
    if (!a.goal && a.owner > 0 && G.zones.length > 1) {
      let best = null, bd = 1e9;
      const hx = a.home ? a.home.x : a.x, hy = a.home ? a.home.y : a.y;
      for (const c of G.caps) {
        if (c.owner === a.owner) continue;
        if (c.owner > 0) continue;                        // v17：只打玩家的城
        if (!hostileTo(a.owner, c.owner)) continue;
        if (!inLocalZones2(a, c.x, c.y)) continue;    // v34：敵軍可以打兩圈內的城
        if (Math.hypot(c.x - hx, c.y - hy) > 60 * aggroMul()) continue;
        const d = Math.hypot(c.x - a.x, c.y - a.y);
        if (d < bd) { bd = d; best = c; }
      }
      /* v42：兵力不夠就不要去敵人大本營送死（守軍算 8 格內的援軍） */
      if (best) {
        const need = capDefenders(best, 8) * 0.8 + 300;
        let mine = a.men;
        for (const m of G.armies) {
          if (m === a || !m.alive || m.owner !== a.owner) continue;
          if (Math.abs(m.x - best.x) > 15 || Math.abs(m.y - best.y) > 15) continue;
          mine += m.men;
        }
        if (mine < need) { best = null; a._weakT = 6; }
      }
      if (best && bd < 60 * aggroMul() && G.grace <= 0 && Math.random() < Math.min(1, 0.85 * aggroMul())) a.goal = best;
    }
    // 4) 沒有別的事就吃地 —— v42：優先吃「貼著我們國界線」的敵國／中立領土
    if (!a.goal) {
      let best = borderTarget(a);
      if (!best) {
        // 主要在原出生地附近活動；被玩家帶到遠處時，就地在腳下吃地
        const awayFromHome = a.home && Math.hypot(a.x - a.home.x, a.y - a.home.y) > 16;
        const cxw = awayFromHome ? a.x : (a.home ? a.home.x : a.x);
        const cyw = awayFromHome ? a.y : (a.home ? a.home.y : a.y);
        const gx = Math.floor(cxw) - (ZW >> 1);
        const gy = Math.floor(cyw) - (ZH >> 1);
        let bd = 1e9;
        for (let k = 0; k < 44; k++) {
          const wx = gx + ((Math.random() * ZW) | 0);
          const wy = gy + ((Math.random() * ZH) | 0);
          if (wx < 0 || wy < 0 || wx >= WORLD_W || wy >= WORLD_H) continue;
          /* v42：不要把目標丟在地圖最外圈 —— 兵團會貼著邊界磨 */
          if (wx < 3 || wy < 3 || wx > WORLD_W - 4 || wy > WORLD_H - 4) continue;
          const i2 = wy * WORLD_W + wx;
          if (!b.terrain[i2]) continue;
          if (b.owner[i2] === a.owner) continue;
          const d = Math.hypot(wx + 0.5 - a.x, wy + 0.5 - a.y);
          const score = d * (b.owner[i2] === NEUTRAL ? 1 : 0.7 / aggroMul());
          if (score < bd) { bd = score; best = { x: wx + 0.5, y: wy + 0.5 }; }
        }
      }
      /* v39.1：原本找不到就 goal = 自己 → 站著發呆。
         改成往外環找最近的「非我方」陸地，找不到才真的待命。 */
      if (!best) best = nearestFreeCell(a, 44);
      a.goal = best || { x: a.x, y: a.y };
      a.goalT = G.t;
    }
  }
  const g = a.goal;
  stepTo(b, a, g.x, g.y, dt, 1);              // v15：直線不通就繞路
  applyBrush(b, a, dt);
}

/* 野戰兵團被打光時，守軍抽一半出城打野戰（不然敵國只剩龜縮） */
let garT = 0;
function mobilizeGarrisons(dt) {
  garT -= dt;
  if (garT > 0) return;
  garT = 1.2;
  for (const r of G.rivals) {
    if (r.dead) continue;
    // v8：自己的主城正在被圍就不要抽守軍出城（抽走等於直接把城送掉）
    let underSiege = false;
    for (const c of G.caps) {
      if (c.owner !== r.owner) continue;
      const sg = siegerOf(c);
      if (sg !== -2 && sg !== r.owner) { underSiege = true; break; }
    }
    if (underSiege) continue;
    const list = armyOf(r.owner);
    if (list.some(function (a) { return !a.garrison; })) continue;  // 還有野戰軍就不用動
    const gar = list.filter(function (a) { return a.garrison; });
    if (gar.length < 2) continue;
    const n = Math.max(1, Math.floor(gar.length / 2));
    for (let i = 1; i <= n && i < gar.length; i++) {
      const g = gar[i];
      g.garrison = false;
      g.think = 0;
      g.goal = null;
      g.tx = g.ty = 0;
      g.retarget = 0;
    }
    if (Date.now() - (G.mobFlash[r.owner] || 0) > 15000) {
      G.mobFlash[r.owner] = Date.now();
      toast('敵軍調動　·　' + rivalName(r.owner) + ' 的守軍出城了');
    }
  }
}

/* v8：守軍沒被貼著打的時候會在城裡補員（回滿到最初的人數上限）。
   避免玩家用「打一下就跑」的游擊把守軍磨光，攻城必須真的打進去。 */
let garRegenT = 0;
function regenGarrisons(dt) {
  garRegenT -= dt;
  if (garRegenT > 0) return;
  garRegenT = 1;
  for (const a of G.armies) {
    if (!a.alive || !a.garrison || !a.home) continue;
    if (a.home.owner !== a.owner) continue;
    if (a.g0 === undefined) a.g0 = a.men;
    let foe = false;
    for (const o of G.armies) {
      if (!o.alive || o.owner === a.owner) continue;
      if (Math.hypot(o.x - a.x, o.y - a.y) < 6) { foe = true; break; }
    }
    if (foe) continue;
    if (a.men < a.g0) a.men = Math.min(a.g0, a.men + a.g0 * 0.012);
  }
}

/* v15.1：P 歸位的兵團如果卡住超過 3 秒（沒位移），直接傳送回主城。
   只作用在「按過 P、正在回城」的本國野戰兵團；已經在城邊的不動。 */
function updateReturnTeleport(dt) {
  for (const a of G.armies) {
    if (!a.alive || a.owner !== 0 || a.garrison || !a.returning) { a.stillT = 0; continue; }
    const mv = Math.hypot(a.x - (a.rx === undefined ? a.x : a.rx),
                          a.y - (a.ry === undefined ? a.y : a.ry));
    a.rx = a.x; a.ry = a.y;
    if (mv < 0.02) a.stillT = (a.stillT || 0) + dt;
    else a.stillT = 0;
    if (a.stillT < 3) continue;
    const hp = homePoint(a);
    a.stillT = 0;
    if (!hp || Math.hypot(hp.x - a.x, hp.y - a.y) <= 2.5) { a.returning = false; continue; }
    const sp = freeSpotNear(hp.x + 0.5, hp.y + 0.5);
    a.x = sp[0]; a.y = sp[1];
    a.path = null; a.pathGoal = null;
    a.returning = false;
    a.think = 0;
    for (let k = 0; k < 14; k++) spawnPart(a.x, a.y, '#9df3e6', 0.9, 0.7);
    toast('兵團卡住　·　已傳送回 ' + (hp.name || '主城'));
  }
}

function updateArmies(dt, b) {
  const sel = G.player && G.player.sel;
  mobilizeGarrisons(dt);
  regenGarrisons(dt);
  updateFieldStore(dt);
  enemyFieldTick(dt);
  for (const a of G.armies.slice()) {
    if (!a.alive || a === sel) continue;
    armyThink(a, dt, b);
  }
  resolveCombat(dt);
}

/* v14：兵團佔位 —— 兩個兵團不能疊在同一個點上。
   用軟性推擠（每幀只推開一半重疊量），不會像硬碰撞一樣抖動；
   推的方向如果會掉進海裡就不推，避免被擠下水。 */
/* v15：推擠整組移除（改用 moveUnit 的體積阻擋） */

function controlledUnit() {
  if (!G.player) return null;
  const a = G.player.sel;
  return a && a.alive ? a : null;
}

function selectArmy(dir) {
  let mine = armyOf(0);
  if (!mine.length) {                       // v43：場上沒有兵團 → 從最近的城召喚儲備
    if (!summonStoredField(1)) { toast('你已經沒有兵團了'); return; }
    mine = armyOf(0);
  }
  if (!mine.length) { toast('你已經沒有兵團了'); return; }
  const i = mine.indexOf(G.player.sel);
  const n = mine.length;
  const k = i < 0 ? 0 : ((i + (dir || 1)) % n + n) % n;
  G.player.sel = mine[k];
  G.surge.t = 0;
  toast('兵團 ' + (k + 1) + ' / ' + n + '　·　' + Math.round(mine[k].men) + ' 人');
  camPanTo(mine[k].x, mine[k].y, 0.5);
  updateHUD();
}

/* v10：按 O 集結 —— 本國所有野戰兵團往你操控的那支靠攏 */
/* v11：緊急征召令 —— 立刻抽 1% 人口成軍，冷卻 30 秒。
   人口先按各主城人口比例扣掉，再從主城出兵；兵團已達上限時
   spawnArmy 會把這批人併進最弱的一支（人口已經扣過，不會白送兵）。 */
function emergencyDraft() {
  if (G.state !== 'playing') return;
  if (G.draftCd > 0) {
    toast('征召冷卻中　·　' + Math.ceil(G.draftCd) + ' 秒');
    return;
  }
  const caps = G.caps.filter(function (c) { return c.owner === 0 && (c.pop || 0) > 100; });
  if (!caps.length) { toast('沒有主城可以征召'); return; }
  const pop = playerPop();
  const men = Math.floor(pop * G.draftPct);
  if (men < 50) { toast('人口不足，無法征召'); return; }

  let need = men;
  const byPop = caps.slice().sort(function (p, q) { return (q.pop || 0) - (p.pop || 0); });
  for (const c of byPop) {
    if (need <= 0) break;
    const share = Math.round(men * ((c.pop || 0) / pop));
    const take = Math.min(need, share, Math.max(0, Math.floor((c.pop || 0) - 100)));
    if (take > 0) { c.pop -= take; need -= take; }
  }
  if (need > 0) {                       // 零頭由人口最多的主城補
    for (const c of byPop) {
      if (need <= 0) break;
      const take = Math.min(need, Math.max(0, Math.floor((c.pop || 0) - 100)));
      if (take > 0) { c.pop -= take; need -= take; }
    }
  }
  const granted = men - need;
  if (granted < 50) { toast('人口不足，無法征召'); return; }

  G.draftCd = CFG.draftCd;
  /* v17：征召改成「補充守備軍」，不再直接拉出野戰軍 */
  G.garrisonPool += granted;
  distributePool();
  toast('緊急征召　·　' + fmtMen(granted) + ' 人轉為守備軍');
  blip(760, 0.18, 0.05, 'square');
  updateHUD();
}

/* v13：兵團的「原所在地」＝自家主城；主城丟了就往最近的自家主城 */
function homePoint(a) {
  if (a.home && a.home.owner === a.owner) return a.home;
  let best = null, bd = 1e9;
  for (const c of G.caps) {
    if (c.owner !== a.owner) continue;
    const d = Math.hypot(c.x - a.x, c.y - a.y);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

function rallyArmies() {
  let cu = controlledUnit();
  if (!cu) {                                 // v43：手上沒兵 → 先從城裡叫一支出來
    if (summonStoredField(1)) cu = controlledUnit();
  }
  if (!cu) { toast('沒有可以集結的兵團'); return; }
  /* v43：集結前先把城裡的儲備叫出來（近距離模式 3 支、全國模式全叫） */
  summonStoredField(G.rallyMode === 'all' ? 99 : 3, cu);
  /* v41：統合兵團隊員也一起響應召集令（整隊湊到主將身邊）；
     守備軍只要不是正在自家城邊待命，也算在召集名單裡。 */
  const myLegion = cu.legion || 0;
  const pool = G.armies.filter(function (a) {
    if (!a.alive || a.owner !== 0 || a === cu) return false;
    if (a.garrison) {
      /* v40：P 也要把出城作戰的守軍叫回去（在城邊的不算） */
      if (a.legion > 0) return true;                       // v41：編入兵團 → 跟著走
      return !!a.home && Math.hypot(a.x - a.home.x, a.y - a.home.y) > 2.5;
    }
    return true;
  });
  /* 集結目標點：主將後方 4.5 格（整個隊形的尾部） */
  const backAng = Math.atan2(cu.fy || 0, cu.fx || 1);
  const rallyPt = { x: cu.x - Math.cos(backAng) * 4.5, y: cu.y - Math.sin(backAng) * 4.5 };
  if (!pool.length) { toast('沒有其他兵團可以集結'); return; }
  const nearMode = G.rallyMode !== 'all';
  let list = pool;
  if (nearMode) {
    pool.sort(function (p, q) {
      return Math.hypot(p.x - cu.x, p.y - cu.y) - Math.hypot(q.x - cu.x, q.y - cu.y);
    });
    list = pool.slice(0, clamp(Math.round(G.rallyCount) || 1, 1, 20));
  }
  for (const a of list) {
    a.rally = CFG.rallyDur;
    a.returning = false;
    a.think = 0;
    a.goal = { x: rallyPt.x, y: rallyPt.y };
  }
  toast('集結令　·　' + (nearMode ? '最近的 ' : '全國 ') + list.length + ' 支兵團向你靠攏');
  blip(700, 0.14, 0.05, 'triangle');
  for (let k = 0; k < 12; k++) spawnPart(cu.x, cu.y, '#2ee6c8', 1.0, 0.8);
}

/* v13：按 P 讓閒置的本國野戰兵團回到原所在地。
   正在交戰的不叫回來，避免把打到一半的部隊硬拉走。 */
function returnArmies() {
  const cu = controlledUnit();
  let n = 0, busyCount = 0;
  for (const a of G.armies) {
    if (!a.alive || a.owner !== 0 || a.garrison || a === cu) continue;
    let busy = false;
    for (const o of G.armies) {
      if (!o.alive || o.owner === 0) continue;
      if (Math.hypot(o.x - a.x, o.y - a.y) < 3.2) { busy = true; break; }
    }
    if (busy) { busyCount++; continue; }
    const hp = homePoint(a);
    if (!hp) continue;
    a.rally = 0;
    a.returning = true;
    a.think = 0;
    a.goal = { x: hp.x, y: hp.y };
    n++;
  }
  if (n) {
    toast('歸位令　·　' + n + ' 支兵團返回駐地' + (busyCount ? '（' + busyCount + ' 支交戰中留下）' : ''));
    blip(420, 0.16, 0.05, 'sine');
  } else {
    toast(busyCount ? '兵團正在交戰，無法歸位' : '沒有閒置的兵團可以歸位');
  }
}

function reinforceArmy(amount) {
  const a = controlledUnit();
  if (!a) { toast('先選一支兵團（Q / E）'); return; }
  const mine = G.caps.filter(c => c.owner === 0);
  if (!mine.length) { toast('沒有主城可以抽兵'); return; }
  mine.sort(function (p, q) { return (q.pop || 0) - (p.pop || 0); });
  const cap = mine[0];
  const take = Math.min(amount, Math.max(0, Math.floor((cap.pop || 0) - 100)));
  if (take < 10) { toast('主城人口不夠抽兵'); return; }
  cap.pop -= take;
  a.men += take;
  for (let k = 0; k < 10; k++) spawnPart(a.x, a.y, '#ffe08a', 0.6, 0.5);
  toast('補兵 +' + take + '　·　' + Math.round(a.men) + ' 人');
  blip(560, 0.14, 0.05, 'triangle');
  updateHUD();
}

function spawnArmy(owner, atCap, men, paid) {
  owner = owner === undefined ? 0 : owner;
  men = men || (owner === 0 ? 500 : Math.min(CFG.enemySpawnCap, Math.round(CFG.enemySpawnBase * zoneMul())));
  const mine = atCap ? [atCap] : G.caps.filter(function (c) { return c.owner === owner; });
  if (!mine.length) return null;
  const cap = mine[(Math.random() * mine.length) | 0];
  const list = armyOf(owner).filter(function (a) { return !a.garrison; });
  if (owner === 0 && list.length >= armyCapOf()) {
    list.sort(function (p, q) { return p.men - q.men; });
    list[0].men += men;
    if (owner === 0) toast('兵團已達上限　·　' + men + ' 人併入既有兵團');
    return list[0];
  }
  /* paid = 人口已經由呼叫端扣掉（緊急征召令），不要重複扣 */
  if (!paid) cap.pop = Math.max(60, (cap.pop || 0) - men);
  const a = addArmy(owner, cap.x, cap.y, men, cap, cap.zone);
  for (let k = 0; k < 16; k++) spawnPart(cap.x, cap.y, '#ffe08a', 0.9, 0.75);
  if (owner === 0) {
    toast('新兵團成軍　·　' + men + ' 人　·　共 ' + armyOf(0).length + ' 支');
    if (!G.player.sel) G.player.sel = a;
    blip(640, 0.16, 0.05, 'triangle');
  }
  return a;
}

function updatePop(dt) {
  G.popT += dt;
  if (G.popT < 30) return;
  G.popT -= 30;
  for (const cap of G.caps) {
    const g = BIOMES[cap.biome || 0].grow;
    const max = Math.max(20000, (cap.district ? cap.district.size : 60) * 300);
    cap.pop = Math.min(max, (cap.pop || 0) * (1 + 0.14 * g) + 4);
  }
  /* v10：這裡每 30 秒結算一次；攻下主城的當下也會另外結算（見 captureDistrict） */
  convertPlayerPop();
  // 敵國也會從自己的人口成軍，才不會打完一輪就沒兵
  for (const r of G.rivals) {
    if (r.dead) continue;
    let p = 0;
    for (const c of G.caps) if (c.owner === r.owner) p += c.pop || 0;
    let paid = G.popPaidBy[r.owner] || 0;
    while (p - paid >= 10000) {
      paid += 10000;
      if (armyOf(r.owner).length < 24) spawnArmy(r.owner);   // v16：敵國不受玩家兵團上限限制
    }
    G.popPaidBy[r.owner] = paid;
  }
}

function ownGround(b, u) {
  const cx = Math.floor(u.x), cy = Math.floor(u.y);
  if (b.owner[cy * b.w + cx] === u.owner) return true;
  if (cx > 0 && b.owner[cy * b.w + cx - 1] === u.owner) return true;
  if (cx < b.w - 1 && b.owner[cy * b.w + cx + 1] === u.owner) return true;
  if (cy > 0 && b.owner[(cy - 1) * b.w + cx] === u.owner) return true;
  if (cy < b.h - 1 && b.owner[(cy + 1) * b.w + cx] === u.owner) return true;
  return false;
}

/* ═══════════════════════════ AI ═══════════════════════════ */
const _from = new Int32Array(WORLD_W * WORLD_H);
const _seen = new Uint8Array(WORLD_W * WORLD_H);
const _queue = new Int32Array(WORLD_W * WORLD_H);

class Brain {
  constructor(unit) {
    this.u = unit;
    this.t = 0;
    this.tx = unit.x;
    this.ty = unit.y;
    this.has = false;
    this.cap = null;        // 正在圍的城
    this.stuck = 0;
    this.lastX = unit.x;
    this.lastY = unit.y;
  }

  update(dt, b) {
    const u = this.u;
    if (!u.alive || u.stunned) return;

    /* 已經站在別人的主城上 → 站著不動就是圍城，別再抽新目標 */
    if (this.cap && this.cap.owner !== u.owner) {
      const dc = Math.hypot(this.cap.x - u.x, this.cap.y - u.y);
      if (dc < 0.85) { this.has = false; this.t = 0.2; return; }
    }

    this.t -= dt;
    if (this.t <= 0) {
      this.pick(b);
      this.t = 0.34 + Math.random() * 0.24;
    }

    if (!this.has) return;
    const dx = this.tx - u.x, dy = this.ty - u.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.5) {
      moveUnit(b, u, dx, dy, dt);
      /* 卡住偵測：兩秒內幾乎沒位移就換目標 */
      if (Math.hypot(u.x - this.lastX, u.y - this.lastY) < 0.02) {
        this.stuck += dt;
        if (this.stuck > 1.2) { this.stuck = 0; this.has = false; this.t = 0; this.cap = null; }
      } else { this.stuck = 0; }
    } else {
      this.t = Math.min(this.t, 0.1);
    }
    this.lastX = u.x; this.lastY = u.y;
  }

  /* 重新挑目標：中立地 / 玩家地 / 別人的地 / 別人的主城 */
  pick(b) {
    const u = this.u;
    const cx = Math.floor(u.x), cy = Math.floor(u.y);
    const mine = b.cnt[u.owner + 1];
    const hungry = mine < 26;
    const aggro = (u.owner !== 0) ? (AGGRO[G.aggression] || 0.8) : 1;
    const warm = G.t < CFG.warmup ? 0.2 : 1;
    const R = hungry ? 40 : 30;

    let best = -1, bestScore = 0, bestCap = null;

    /* 主城優先：強攻時會專程去拆玩家的城 */
    for (const cap of G.caps) {
      if (cap.owner === u.owner) continue;
      if (cap.owner === 0 && aggro < 1.4) continue;   // 只有「強」才會打玩家的城
      const d = Math.abs(cap.x - u.x) + Math.abs(cap.y - u.y);
      if (d > 46) continue;
      let v = cap.owner === 0 ? aggro * 2.9 * warm : 1.55;
      if (hungry) v *= 0.55;
      const sc = v / (1 + d * 0.028) * (0.9 + Math.random() * 0.2);
      if (sc > bestScore) { bestScore = sc; best = cap.i; bestCap = cap; }
    }

    for (let y = Math.max(0, cy - R); y <= Math.min(b.h - 1, cy + R); y++) {
      for (let x = Math.max(0, cx - R); x <= Math.min(b.w - 1, cx + R); x++) {
        const i = y * b.w + x;
        if (!b.terrain[i]) continue;
        const o = b.owner[i];
        if (o === u.owner) continue;
        const d = Math.abs(x - cx) + Math.abs(y - cy);
        let v;
        if (o === NEUTRAL) v = 1.0;
        else if (o === 0) v = aggro * warm * (hungry ? 0.5 : 1.0);
        else v = 2.05 * (hungry ? 0.6 : 1.0);          // 對其他 AI 永遠強
        /* 距離衰減故意放很慢：遠一點的地也吃，AI 才不會只在自己腳邊打轉 */
        const sc = v / (1 + d * 0.014) * (0.78 + Math.random() * 0.44);
        if (sc > bestScore) { bestScore = sc; best = i; bestCap = null; }
      }
    }

    this.cap = bestCap;
    if (best < 0) {
      /* 周圍真的沒東西可吃（整個區塊都是自己的）→ 往最近的未佔格走 */
      let far = -1, farD = 1e9;
      for (let k = 0; k < b.n; k++) {
        if (!b.terrain[k] || b.owner[k] === u.owner) continue;
        const d = Math.abs(k % b.w - cx) + Math.abs(((k / b.w) | 0) - cy);
        if (d < farD) { farD = d; far = k; }
      }
      if (far < 0) { this.has = false; return; }
      best = far;
    }

    const step = this.pathTo(b, cx, cy, best);
    if (step < 0) {
      /* 走不到 → 先往目標方向硬走一小段，不要罰站 */
      const tx = (best % b.w) + 0.5, ty = ((best / b.w) | 0) + 0.5;
      this.tx = tx; this.ty = ty; this.has = true;
      return;
    }
    this.tx = (step % b.w) + 0.5;
    this.ty = ((step / b.w) | 0) + 0.5;
    this.has = true;
  }

  pathTo(b, cx, cy, target) {
    const w = b.w;
    const start = cy * w + cx;
    if (start === target) return -1;
    const seen = _seen, q = _queue, from = _from;
    let qh = 0, qt = 0;
    q[qt++] = start; seen[start] = 1; from[start] = -1;
    let found = -1;
    while (qh < qt && qt < 5200) {
      const i = q[qh++];
      if (i === target) { found = i; break; }
      const x = i % w, y = (i / w) | 0;
      if (x > 0)     { const j = i - 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (x < b.w - 1) { const j = i + 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y > 0)     { const j = i - w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y < b.h - 1) { const j = i + w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
    }
    if (found < 0) {
      for (let k = 0; k < qt; k++) seen[q[k]] = 0;
      return -1;
    }
    let cur = found;
    while (from[cur] !== start && from[cur] >= 0) cur = from[cur];
    for (let k = 0; k < qt; k++) seen[q[k]] = 0;
    return cur;
  }
}

/* ═══════════════════════════ 粒子／音效 ═══════════════════════════ */
function spawnPart(x, y, c, sp, life) {
  if (G.parts.length > 420) return;
  const a = Math.random() * TAU;
  G.parts.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life, max: life, c, r: 0.1 + Math.random() * 0.1
  });
}
function spawnBurst(x, y, c) {
  for (let k = 0; k < 5; k++) spawnPart(x, y, c, 0.5 + Math.random() * 0.7, 0.28 + Math.random() * 0.3);
}

let actx = null, muted = false, lastFlip = 0;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  return actx;
}
function blip(freq, dur, gain, type) {
  const a = audio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(gain, a.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function sfxFlip() {
  if (muted) return;
  const now = performance.now();
  if (now - lastFlip < 70) return;
  lastFlip = now;
  blip(420 + Math.random() * 120, 0.05, 0.018, 'triangle');
}

/* ═══════════════════════════ 地區 ═══════════════════════════ */
/* 把一塊區塊的陸地切成 4~6 個「地區」：最遠點取樣挑種子，再多源 BFS 分地，
   所以每個地區一定是連通的一整片（不會東一塊西一塊）。 */
function buildDistricts(z, t) {
  const w = ZW, h = ZH;
  const land = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (t[y * w + x]) land.push(y * w + x);
  z.districts = [];
  z.borders = null;
  if (!land.length) return;
  const rnd = mulberry32((z.seed ^ 0x2f9e71) >>> 0);
  let k = 4 + ((rnd() * 3) | 0);                       // 4、5、6
  k = Math.max(2, Math.min(k, Math.floor(land.length / 18)));

  /* 1. 最遠點取樣：種子盡量散開，但保留一點隨機 */
  const seeds = [land[(rnd() * land.length) | 0]];
  const tmp = new Float32Array(land.length);
  while (seeds.length < k) {
    let bestD = -1;
    for (let n = 0; n < land.length; n++) {
      const c = land[n];
      let md = 1e9;
      for (let si = 0; si < seeds.length; si++) {
        const sc = seeds[si];
        const dx = (c % w) - (sc % w), dy = ((c / w) | 0) - ((sc / w) | 0);
        const dd = dx * dx + dy * dy;
        if (dd < md) md = dd;
      }
      tmp[n] = md;
      if (md > bestD) bestD = md;
    }
    const pool = [];
    for (let n = 0; n < land.length; n++) if (tmp[n] > bestD * 0.5) pool.push(land[n]);
    seeds.push(pool.length ? pool[(rnd() * pool.length) | 0] : land[(rnd() * land.length) | 0]);
  }

  /* 2. 多源 BFS：每格歸給最快走到的種子 → 每區必連通 */
  const lab = new Int8Array(w * h).fill(-1);
  const q = new Int32Array(w * h);
  let qh = 0, qt = 0;
  for (let si = 0; si < seeds.length; si++) {
    const c = seeds[si];
    if (lab[c] >= 0) continue;
    lab[c] = si; q[qt++] = c;
  }
  while (qh < qt) {
    const c = q[qh++], x = c % w, y = (c / w) | 0;
    if (x > 0)     { const n = c - 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (x < w - 1) { const n = c + 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y > 0)     { const n = c - w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y < h - 1) { const n = c + w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
  }
  for (const c of land) if (lab[c] < 0) {
    const x = c % w, y = (c / w) | 0;
    const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
    for (const n of nb) if (n >= 0 && lab[n] >= 0) { lab[c] = lab[n]; break; }
  }

  /* 3. 太小的地區併進鄰居 */
  const minCells = Math.max(9, Math.floor(land.length * 0.085));
  for (let guard = 0; guard < 14; guard++) {
    const sizes = new Int32Array(seeds.length);
    for (const c of land) if (lab[c] >= 0) sizes[lab[c]]++;
    let small = -1;
    for (let i = 0; i < sizes.length; i++) if (sizes[i] > 0 && sizes[i] < minCells) { small = i; break; }
    if (small < 0) break;
    const touch = new Int32Array(seeds.length);
    for (const c of land) {
      if (lab[c] !== small) continue;
      const x = c % w, y = (c / w) | 0;
      const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
      for (const n of nb) if (n >= 0 && lab[n] >= 0 && lab[n] !== small) touch[lab[n]]++;
    }
    let to = -1, best = -1;
    for (let i = 0; i < touch.length; i++) if (touch[i] > best) { best = touch[i]; to = i; }
    if (to < 0) break;
    for (const c of land) if (lab[c] === small) lab[c] = to;
  }

  /* 4. 建立地區物件 + 主城 */
  const groups = new Map();
  for (const c of land) {
    const l = lab[c];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(c);
  }
  let id = 0;
  for (const arr0 of groups.values()) {
    /* 這裡的索引是「區塊內座標」，換算成世界座標才拿去塗 */
    const arr = new Int32Array(arr0.length);
    for (let n = 0; n < arr0.length; n++) {
      const lc = arr0[n];
      arr[n] = (z.y0 + ((lc / w) | 0)) * WORLD_W + (z.x0 + (lc % w));
    }
    /* 主城位置要用「區塊內座標」算，arr 已是世界座標 */
    let capC = arr0[0], capScore = -1;
    for (const c of arr0) {
      const x = c % w, y = (c / w) | 0;
      let sc = 0;
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          if (Math.abs(dx) + Math.abs(dy) > 3) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          if (t[ny * w + nx]) sc++;
        }
      }
      if (sc > capScore) { capScore = sc; capC = c; }
    }
    const cx = capC % w, cy = (capC / w) | 0;
    const bi = biomeAt(z.x0 + cx, z.y0 + cy);
    z.districts.push({
      id: id++, cells: arr, size: arr.length, owner: NEUTRAL, biome: bi,
      cap: {
        lx: cx, ly: cy, x: z.x0 + cx + 0.5, y: z.y0 + cy + 0.5,
        i: (z.y0 + cy) * WORLD_W + (z.x0 + cx),
        owner: NEUTRAL, prog: 0, surr: 0, pulse: 0, flash: 0, checkT: 0,
        biome: bi, pop: 20000, zone: z, field: 0
      }
    });
  }
  for (const d of z.districts) d.cap.district = d;

  /* 5. 地區邊界線 */
  const p = new Path2D();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = y * w + x;
      if (!t[c]) continue;
      const l = lab[c], wx = z.x0 + x, wy = z.y0 + y;
      if (x < w - 1 && t[c + 1] && lab[c + 1] !== l) { p.moveTo(wx + 1, wy); p.lineTo(wx + 1, wy + 1); }
      if (y < h - 1 && t[c + w] && lab[c + w] !== l) { p.moveTo(wx, wy + 1); p.lineTo(wx + 1, wy + 1); }
    }
  }
  z.borders = p;
}

/* 把整塊區塊分給各路人馬（玩家主場則保留一個地區給玩家） */
function assignOwners(z, homeIdx) {
  const b = G.board;
  const ds = z.districts;
  if (!ds.length) return;
  /* v14：統一國家的大陸 —— 所有地區都歸同一個國家，只有玩家主場例外 */
  if (G.unified) {
    let uni = G.rivals.find(function (r) { return !r.dead && r.owner === 1; });
    if (!uni) {
      uni = { owner: 1, name: '大一統帝國', dead: false, unified: true };
      G.rivals.push(uni);
    }
    for (const r of G.rivals) if (r !== uni) r.dead = true;
  }
  const want = G.unified ? 1 : Math.min(homeIdx >= 0 ? 2 : 3, Math.max(1, ds.length - (homeIdx >= 0 ? 1 : 0)));

  /* 國家是跨區塊延續的：沿用既有敵國，不夠才開新國（最多 4 國） */
  const slots = [];
  for (const r of G.rivals) if (!r.dead && slots.indexOf(r.owner) < 0) slots.push(r.owner);
  if (G.unified) {
    slots.length = 0;
    slots.push(1);
  } else {
    for (let o = 1; o < COLORS.length && slots.length < want; o++) {
      if (slots.indexOf(o) >= 0) continue;
      G.rivals.push({ owner: o, name: makeFactionName(), dead: false });
      slots.push(o);
    }
  }

  let si = 0;
  const ownerOf = [];
  for (const d of ds) {
    if (d.id === homeIdx) { ownerOf[d.id] = 0; continue; }
    ownerOf[d.id] = slots.length ? slots[si++ % slots.length] : NEUTRAL;
  }

  /* 玩家開局至少拿兩個相鄰地區，否則人口與兵團會被 AI 壓死 */
  if (homeIdx >= 0 && ds.length >= 5) {
    const at = new Map();
    for (const d of ds) for (const i of d.cells) at.set(i, d.id);
    let bestD = -1, bestN = -1;
    for (const d of ds) {
      if (d.id === homeIdx) continue;
      let n = 0;
      for (const i of d.cells) {
        const x = i % ZW, y = (i / ZW) | 0;
        if (x > 0 && at.get(i - 1) === homeIdx) n++;
        if (x < ZW - 1 && at.get(i + 1) === homeIdx) n++;
        if (y > 0 && at.get(i - ZW) === homeIdx) n++;
        if (y < ZH - 1 && at.get(i + ZW) === homeIdx) n++;
      }
      if (n > bestN) { bestN = n; bestD = d.id; }
    }
    if (bestD >= 0 && bestN > 0) ownerOf[bestD] = 0;
  }

  /* 預填：整個地區都塗成地主的顏色（玩家主場除外） */
  for (const d of ds) {
    const o = ownerOf[d.id];
    d.owner = o;
    d.cap.owner = o;
    for (const i of d.cells) {
      b.setOwner(i, o);
      b.hp[i] = HP_MAX;
      b.lock[i] = 0;
    }
    b.setOwner(d.cap.i, o);
  }

  /* 進場走廊：接縫往中心的路、以及接縫附近的登陸場保持中立，讓玩家走得進來 */
  const cx = ZW / 2, cy = ZH / 2;
  const seams = [];
  if (zoneAt(z.gx - 1, z.gy)) seams.push([0, ZH / 2]);
  if (zoneAt(z.gx + 1, z.gy)) seams.push([ZW, ZH / 2]);
  if (zoneAt(z.gx, z.gy - 1)) seams.push([ZW / 2, 0]);
  if (zoneAt(z.gx, z.gy + 1)) seams.push([ZW / 2, ZH]);
  const clear = (lx, ly, rad) => {
    for (let y = Math.floor(ly - rad); y <= Math.ceil(ly + rad); y++) {
      for (let x = Math.floor(lx - rad); x <= Math.ceil(lx + rad); x++) {
        if (x < 0 || y < 0 || x >= ZW || y >= ZH) continue;
        if ((x - lx) * (x - lx) + (y - ly) * (y - ly) > rad * rad) continue;
        const i = (z.y0 + y) * WORLD_W + (z.x0 + x);
        if (!b.terrain[i]) continue;
        if (b.owner[i] === 0) continue;
        b.setOwner(i, NEUTRAL);
      }
    }
  };
  for (const sm of seams) {
    clear(sm[0], sm[1], 3.2);
    for (let t01 = 0; t01 <= 1.0001; t01 += 0.12) {
      clear(sm[0] + (cx - sm[0]) * t01, sm[1] + (cy - sm[1]) * t01, 1.6);
    }
  }

  /* 國家：每個佔到地的顏色都是一個國家。
     敵國每座主城的初始兵團數 = 區塊數 × 0.5（最少 1 支、最多 10 支），玩家每座主城 1 支。
     v8.1 回調成 v7 的數值。 */
  /* v32：敵軍兵力生成統一成「每座城固定 3 支野戰軍」，
     原本「幾支兵團 × 兵力加成」的總量直接均攤到這 3 支身上。 */
  const perCap = clamp(Math.round(G.zones.length * CFG.enemyArmyPerZone), 1, CFG.enemyArmyCap);
  for (const d of ds) {
    const o = ownerOf[d.id];
    if (o < 0) continue;
    if (o === 0) {
      const na = addArmy(0, d.cap.x + (Math.random() - 0.5) * 0.8, d.cap.y + (Math.random() - 0.5) * 0.8, 500, d.cap, z);
      if (!G.newPlayerArmy) G.newPlayerArmy = na;
      continue;
    }
    const totalMen = Math.min(CFG.enemyMenCap, Math.round(CFG.enemyMenBase * zoneMul())) * perCap;
    const per = Math.max(80, Math.round(totalMen / 3));
    const room = Math.max(0, Math.min(3, ENEMY_SCALE.maxArmies - G.armies.length));
    for (let k = 0; k < room; k++) {
      addArmy(o, d.cap.x + (Math.random() - 0.5) * 1.4, d.cap.y + (Math.random() - 0.5) * 1.4, per, d.cap, z);
    }
  }

  /* 每座主城配守軍：只在家門口攔截，不會跟著野戰兵團到處跑。
     v8 守軍從 100 提升到 300（上限 1200 → 4800）；
     v9 敵軍優勢未生效時回到 v7 的 100 / 上限 1200。 */
  for (const d of ds) {
    const o = ownerOf[d.id];
    if (o < 0) continue;
    const buffed = o === 0 || enemyBuff();
    const gmen = o === 0 ? 100
      : Math.min(buffed ? CFG.garrisonCap : 1200,
                 Math.round((buffed ? CFG.garrisonBase : 100) * zoneMul()));
    d.cap.held = (d.cap.held || 0) + gmen;   // v32：守軍是數字，不佔部隊位
  }

  for (const d of ds) G.caps.push(d.cap);
  rivalSig = ''; capSig = '';
}

/* 玩家主場：離區塊中心最近的那個地區 */
function pickHomeDistrict(z) {
  const cx = ZW / 2, cy = ZH / 2;
  let best = -1, bestD = 1e9;
  for (const d of z.districts) {
    const dd = (d.cap.lx - cx) * (d.cap.lx - cx) + (d.cap.ly - cy) * (d.cap.ly - cy);
    const dc = (d.cells[0] % ZW - cx) * (d.cells[0] % ZW - cx);
    if (dd < bestD) { bestD = dd; best = d.id; }
  }
  return best;
}

/* ═══════════════════════════ 開局 ═══════════════════════════ */
function freeOwnerSlot() {
  for (let o = 1; o < COLORS.length; o++) {
    let used = false;
    for (const r of G.rivals) if (!r.dead && r.owner === o) used = true;
    if (!used) return o;
  }
  return -1;
}

function spawnRivals(z) {
  const want = Math.min(3, 1 + Math.floor(G.zones.length / 3));
  let placed = 0;
  const rand = mulberry32((z.seed ^ 0x51ed270b) >>> 0);
  for (let tries = 0; tries < 260 && placed < want; tries++) {
    const lx = 3 + ((rand() * (ZW - 6)) | 0);
    const ly = 3 + ((rand() * (ZH - 6)) | 0);
    const wx = z.x0 + lx, wy = z.y0 + ly;
    const i = wy * WORLD_W + wx;
    if (!G.board.terrain[i]) continue;
    let ok = true;
    for (let dy = -1; dy <= 1 && ok; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (!G.board.terrain[i + dy * WORLD_W + dx]) { ok = false; break; }
    if (!ok) continue;
    // 不要擠在一起
    for (const r of G.rivals) {
      if (r.dead) continue;
      if (Math.abs(r.unit.x - wx) + Math.abs(r.unit.y - wy) < 9) { ok = false; break; }
    }
    if (!ok) continue;
    const slot = freeOwnerSlot();
    if (slot < 0) break;
    const u = new Unit(slot, wx + 0.5, wy + 0.5,
      Math.min(CFG.aiSpeedMax, CFG.aiSpeedBase + CFG.aiSpeedPerZone * (G.zones.length - 1)),
      Math.min(3, 1 + Math.floor((G.zones.length - 1) / 3)));
    G.rivals.push({ owner: slot, unit: u, brain: new Brain(u), dead: false });
    paintBlob(wx, wy, 2, slot);
    placed++;
  }
}

function paintBlob(cx, cy, r, owner) {
  const b = G.board;
  for (let y = cy - r; y <= cy + r; y++) {
    for (let x = cx - r; x <= cx + r; x++) {
      if (Math.abs(x - cx) + Math.abs(y - cy) > r) continue;
      if (!b.isLand(x, y)) continue;
      b.setOwner(y * b.w + x, owner);
      b.hp[y * b.w + x] = HP_MAX;
    }
  }
}


/* ══════════ v21：完整大陸開局 ══════════
   一次攤開全部區塊，重新切成 12 個政權（最大 ~50 城、也有 1–2 城的小國），
   玩家固定 4 座主城、位置隨機。 */
function fullMapInit() {
  const start = pickStartZone();
  G.home = { gx: start.gx, gy: start.gy };
  openZone(start.gx, start.gy, true);
  for (let i = 0; i < 600; i++) if (!openNextZone()) break;

  const ds = [];
  for (const z of G.zones) for (const d of z.districts) ds.push(d);
  if (!ds.length) return;
  /* 依地理順序排，這樣每個政權會拿到一整塊相連的領地 */
  ds.sort(function (a, b) { return (a.cap.y - b.cap.y) || (a.cap.x - b.cap.x); });

  /* ══════ v21.2：區塊先分好，再處理區塊內的細分 ══════
     規則：一個區塊要嘛整個給一個政權、要嘛切給幾個（通常 1 個）小政權、
     要嘛分給隔壁的政權。玩家 4 座主城集中在同一塊區塊裡。 */
  const shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };

  const zoneByG = new Map();
  for (const z of G.zones) zoneByG.set(z.gx + ',' + z.gy, z);
  const nbrZ = function (z) {
    const out = [];
    for (const dd of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const n = zoneByG.get((z.gx + dd[0]) + ',' + (z.gy + dd[1]));
      if (n) out.push(n);
    }
    return out;
  };

  /* 1) 玩家：挑一塊地區夠多的區塊，四座城都在裡面 */
  const richZones = G.zones.filter(function (z) { return z.districts.length >= 4; });
  const pzPool = richZones.length ? richZones : G.zones.slice();
  const pz = pzPool[(Math.random() * pzPool.length) | 0];
  const pDs = pz.districts.slice(0, 4);

  /* 2) 其餘區塊：每個國家拿一個種子區塊，再往外長 */
  const restZ = G.zones.filter(function (z) { return z !== pz; });
  const zoneOwner = new Map();

  let totalD = 0;
  for (const z of restZ) totalD += z.districts.length;
  const avgD = Math.max(2, totalD / Math.max(1, restZ.length));

  /* 城市目標 → 換成「要幾個區塊」 */
  const weights = [50, 38, 30, 24, 20, 16, 13, 10, 8, 6, 4, 2];
  const sumW = weights.reduce(function (a, b) { return a + b; }, 0);
  const capSize = Math.min(50, Math.max(6, Math.ceil(totalD * 0.2)));
  const sizeScale = totalD / sumW;
  const wants = weights.map(function (w) {
    return Math.max(1, Math.min(capSize, Math.round(w * sizeScale)));
  });
  let wantZones = wants.map(function (c) { return Math.max(1, Math.round(c / avgD)); });
  let zdiff = restZ.length - wantZones.reduce(function (a, b) { return a + b; }, 0);
  let zg = 0;
  while (zdiff > 0 && zg++ < 4000) {
    let idx = 0;
    for (let i = 1; i < wantZones.length; i++) if (wantZones[i] < wantZones[idx]) idx = i;
    wantZones[idx]++; zdiff--;
  }
  zg = 0;
  while (zdiff < 0 && zg++ < 4000) {
    let idx = 0;
    for (let i = 1; i < wantZones.length; i++) if (wantZones[i] > wantZones[idx]) idx = i;
    if (wantZones[idx] <= 1) break;
    wantZones[idx]--; zdiff++;
  }

  G.rivals.length = 0;
  for (let i = 0; i < wants.length; i++) {
    G.rivals.push({ owner: i + 1, name: makeFactionName(), dead: false });
  }

  /* 種子區塊 */
  const seeded = shuffle(restZ.slice());
  for (let i = 0; i < wantZones.length && i < seeded.length; i++) {
    zoneOwner.set(seeded[i], i + 1);
  }
  /* 往外長：每次挑一塊「已經屬於某國、旁邊還有空區塊」的地方擴張 */
  let growGuard = 0;
  while (growGuard++ < 6000) {
    let moved = false;
    for (let i = 0; i < wantZones.length; i++) {
      let have = 0;
      for (const [z, o] of zoneOwner) if (o === i + 1) have++;
      if (have >= wantZones[i]) continue;
      const cands = [];
      for (const [z, o] of zoneOwner) {
        if (o !== i + 1) continue;
        for (const n of nbrZ(z)) {
          if (n === pz || zoneOwner.has(n)) continue;
          cands.push(n);
        }
      }
      if (!cands.length) continue;
      const pick = cands[(Math.random() * cands.length) | 0];
      zoneOwner.set(pick, i + 1);
      moved = true;
    }
    if (!moved) break;
  }
  /* 還空的區塊 → 分給隔壁政權 */
  for (const z of restZ) {
    if (zoneOwner.has(z)) continue;
    const nb = nbrZ(z).map(function (n) { return zoneOwner.get(n); }).filter(Boolean);
    zoneOwner.set(z, nb.length ? nb[(Math.random() * nb.length) | 0] : 1);
  }

  /* 3) 區塊內的細分：大多整塊給一個政權，少數切一兩塊給隔壁 */
  for (const d of ds) d.owner = 0;
  for (const d of pDs) d.owner = 0;
  const pzNbrOwners = nbrZ(pz).map(function (n) { return zoneOwner.get(n); }).filter(Boolean);
  for (const d of pz.districts) {
    if (pDs.indexOf(d) < 0) d.owner = pzNbrOwners.length ? pzNbrOwners[0] : 1;
  }
  for (const z of restZ) {
    const own = zoneOwner.get(z);
    const list = z.districts.slice();
    for (const d of list) d.owner = own;
    /* 30% 的區塊：把 1–2 個地區讓給隔壁政權，國界才有狗牙 */
    if (Math.random() < 0.3) {
      const nbOwners = nbrZ(z).map(function (n) { return zoneOwner.get(n); }).filter(function (o) { return o && o !== own; });
      if (nbOwners.length) {
        const give = Math.min(list.length - 1, 1 + ((Math.random() * 2) | 0));
        shuffle(list);
        for (let k = 0; k < give; k++) list[k].owner = nbOwners[(Math.random() * nbOwners.length) | 0];
      }
    }
  }

  /* 寫進棋盤 */
  G.armies.length = 0;
  G.caps.length = 0;
  G.uidSeq = 0;
  const b = G.board;
  for (const d of ds) {
    const own = d.owner;
    d.cap.owner = own;
    b.setOwner(d.cap.i, own);
    for (const i of d.cells) b.setOwner(i, own);
  }
  for (const d of ds) G.caps.push(d.cap);

  /* 建軍：每座城一支守軍；玩家每城一支野戰軍；各國 4 支野戰軍 */
  for (const d of ds) {
    const own = d.owner;
    if (own < 0) continue;
    const gMen = Math.max(150, Math.round(60 + d.size * 9));
    addGarrison(d.cap, gMen);
  }
  for (const d of pDs) {
    spawnFieldArmyAt(d.cap, 900, true);
  }
  for (const r of G.rivals) {
    const mine = G.caps.filter(function (c) { return c.owner === r.owner; });
    for (let k = 0; k < 4 && mine.length; k++) {
      const c = mine[(Math.random() * mine.length) | 0];
      const a = addArmy(r.owner, c.x + 0.4, c.y + 0.4, 900, c, c.zone);
      a.owner = r.owner;
    }
  }

  G.popPaid = Math.floor(playerPop());
  G.popPaidBy = {};
  for (const r of G.rivals) {
    let pp = 0;
    for (const c of G.caps) if (c.owner === r.owner) pp += c.pop || 0;
    G.popPaidBy[r.owner] = Math.floor(pp);
  }
  G.zones.forEach(function (z) { z.reveal = 0; });
  const mine = armyOf(0);
  G.player.sel = mine.length ? mine[0] : null;
  G.garrisonPool = 0;
  G.nameIdx = 0;
  for (const c of G.caps) if (c.owner === 0) nameCity(c);
  G.mob = {};
  G.warLog = null;
  /* v23：完整大陸開局預設「全部和平」——想打誰自己宣戰 */
  G.rel = {};
  for (const r of G.rivals) setRel(0, r.owner, 'peace');
  for (let i = 0; i < G.rivals.length; i++) {
    for (let j = i + 1; j < G.rivals.length; j++) {
      setRel(G.rivals[i].owner, G.rivals[j].owner, 'peace');
    }
  }
  G.relLog = {};
  terrDirty = true;
  paintShadow();
  cam.cell = fitCell();
  if (G.player.sel) { cam.x = G.player.sel.x; cam.y = G.player.sel.y; }
  cam.tx = cam.x; cam.ty = cam.y; cam.camPan = 0;
}

function newGame(opts) {
  G.stage = 1;
  G.unified = false;
  G.diplo = true;                  // v38：兩種模式都有外交
  if (!G.diplo) G.wars = {};
  G.zones.length = 0;
  G.rivals.length = 0;
  G.caps.length = 0;
  G.parts.length = 0;
  G.t = 0;
  G.zone = 1;
  G.kills = 0;
  G.suffocate = 0;
  G.openDelay = 0;
  G.pending = false;
  G.surge.t = 0;
  G.surge.cd = 0;
  G.caps.length = 0;
  G.capSig = '';
  G.armies.length = 0;
  G.uidSeq = 0;
  G.control = -1;
  G.popT = 0;
  G.popPaid = 0;
  G.popPaidBy = {};
  G.draftCd = 0;
  G.warMode = false;
  G.startTime = performance.now();
  G.board = newBoard();

  USED_NAMES.clear();
  const forced = new URLSearchParams(location.search).get('seed');
  WORLD_SEED = forced ? (parseInt(forced, 10) >>> 0)
                      : ((Date.now() ^ ((Math.random() * 0x7fffffff) | 0)) >>> 0);
  G.baseSeed = WORLD_SEED;
  buildWorld();
  const start = pickStartZone();
  G.home = { gx: start.gx, gy: start.gy };
  G.armies = [];
  G.mobFlash = {};
  G.player = { sel: null };
  if (G.mode === 'full') { fullMapInit(); return; }
  const z0 = openZone(start.gx, start.gy, true);
  const home = z0.districts.find(d => d.owner === 0) || z0.districts[0];
  const cx = Math.floor(home ? home.cap.x : z0.x0 + (ZW >> 1));
  const cy = Math.floor(home ? home.cap.y : z0.y0 + (ZH >> 1));
  paintBlob(cx, cy, 2, 0);
  G.suffocate = 0;

  G.zones.length = 1;
  G.zones[0] = z0;
  // 開局人口視為已結算，避免一開場就被 20000 人口換出一堆兵團
  G.popPaid = Math.floor(playerPop());
  for (const r of G.rivals) {
    let pp = 0;
    for (const c of G.caps) if (c.owner === r.owner) pp += c.pop || 0;
    G.popPaidBy[r.owner] = Math.floor(pp);
  }
  if (!G.player.sel) {
    const first = armyOf(0);
    G.player.sel = first.length ? first[0] : null;
  }
  /* v15：開局就把自家城池命名，並把待分配人力清空 */
  G.garrisonPool = 0;
  G.waitingNext = false;
  G.nameIdx = 0;
  G.mob = {};                       // v18.3：新局重新從局部動員開始
  G.rel = {};                       // v21b：國際關係
  G.relLog = {};                    // v21b：逐國戰史
  G.scaleCity = 0; G.scaleGarMen = 0; G.scaleFieldMen = 0;   // v25
  G.legions = []; G.countMode = G.countMode || 'unit';   // v28：多個統合兵團
  G.deadRivals = [];                                     // v38
  G.facOpen = null;
  G.warLog = null;                  // v19：戰史歸零
  for (const c of G.caps) if (c.owner === 0) nameCity(c);
  for (const c of G.caps) if (!c.name && c.owner === 0) nameCity(c);
  cam.cell = fitCell();
  cam.x = G.player.sel ? G.player.sel.x : cam.x;
  cam.y = G.player.sel ? G.player.sel.y : cam.y;
  cam.tx = cam.x; cam.ty = cam.y;
  cam.camPan = 0;
  terrDirty = true;
}

function fitCell() {
  const z = G.zones[0];
  if (!z) return 30;
  return clamp(Math.min(CW / (ZW + 1), (CH * 0.9) / (ZH + 1)), 7, 56);
}

/* ═══════════════════════════ 相機 ═══════════════════════════ */
function camPanTo(x, y, dur) {
  cam.tx = x; cam.ty = y;
  cam.camPan = dur;
}

function clampCam() {
  const b = G.board;
  if (!b) return;
  const bw = b.boxX1 - b.boxX0 + 1, bh = b.boxY1 - b.boxY0 + 1;
  const halfW = (CW / 2) / cam.cell, halfH = (CH * 0.86 / 2) / cam.cell;
  const minX = b.boxX0 - 1 + halfW, maxX = b.boxX1 + 2 - halfW;
  const minY = b.boxY0 - 1 + halfH, maxY = b.boxY1 + 2 - halfH;
  cam.x = minX > maxX ? (b.boxX0 + b.boxX1 + 1) / 2 : clamp(cam.x, minX, maxX);
  cam.y = minY > maxY ? (b.boxY0 + b.boxY1 + 1) / 2 : clamp(cam.y, minY, maxY);
}

function zoomBy(f) {
  const before = cam.cell;
  cam.cell = clamp(cam.cell * f, 7, 58);
  if (cam.cell !== before) {
    zoomFlash = 0.25;
    updateHUD();
  }
  clampCam();
}
let zoomFlash = 0;

/* ═══════════════════════════ 更新 ═══════════════════════════ */
function update(dt) {
  G.frameN = (G.frameN || 0) + 1;
  const b = G.board;
  if (!b) return;
  if (G.state !== 'playing') { updateParts(dt); return; }
  G.t += dt;
  b.time += dt;
  if (G.grace > 0) G.grace = Math.max(0, G.grace - dt);

  if (G.surge.t > 0) {
    G.surge.t -= dt;
    if (G.surge.t <= 0) { G.surge.t = 0; G.surge.cd = CFG.surgeCd; }
  } else if (G.surge.cd > 0) {
    G.surge.cd = Math.max(0, G.surge.cd - dt);
  }
  if (G.draftCd > 0) G.draftCd = Math.max(0, G.draftCd - dt);   // v11 征召冷卻

  // 玩家操控的兵團
  const cu = controlledUnit();
  if (cu) {
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (dx || dy) moveUnit(b, cu, dx, dy, dt, G.surge.t > 0 ? CFG.surgeSpeed : 1);
    // 玩家操控的兵團不受區塊限制，想去哪就去哪；只有 AI 操控時才被鎖在出生的區塊
    applyBrush(b, cu, dt);
    if (!cu.out && cu.home && Math.hypot(cu.x - cu.home.x, cu.y - cu.home.y) > 4) {
      cu.out = true;
      toast('兵團出擊中　·　' + Math.round(cu.men) + ' 人');
    }
  }

  // 吃完當下的判定放在玩家塗抹之後：這一瞬間全歸玩家就算清盤
  /* v33：要「所有已開放的土地 + 所有主城」都歸玩家才算清盤，
     只檢查土地的話，敵方主城還活著也會被判清盤 → 開新區塊時出 bug。 */
  let allCapsMine = true;
  for (const c of G.caps) { if (c.owner !== 0) { allCapsMine = false; break; } }
