/* ═══════════════════════════ 區塊 ═══════════════════════════ */
function zoneRect(gx, gy) {
  return { x0: LAT_X0 + gx * ZW, y0: LAT_Y0 + gy * ZH, w: ZW, h: ZH };
}

function zoneAt(gx, gy) {
  for (const z of G.zones) if (z.gx === gx && z.gy === gy) return z;
  return null;
}

/* 以起始區塊為圓心，一圈一圈往外開：先內圈、再外圈，
   同一個圈裡按角度繞（順時針），而且一定要跟已開放的區塊接得到 */
function seamPassable(sx, sy, vertical) {
  const len = vertical ? ZH : ZW;
  let pairs = 0;
  for (let k = 0; k < len; k++) {
    const wx = vertical ? sx : sx + k;
    const wy = vertical ? sy + k : sy;
    const a = worldLand[wy * WORLD_W + wx];
    const bx = vertical ? wx - 1 : wx;
    const by = vertical ? wy : wy - 1;
    const b2 = (bx >= 0 && by >= 0 && bx < WORLD_W && by < WORLD_H) ? worldLand[by * WORLD_W + bx] : 0;
    if (a && b2) pairs++;
  }
  return pairs;
}

function openNextZone() {
  const home = G.home || { gx: WCOL >> 1, gy: WROW >> 1 };
  const cand = [];
  for (let gy = 0; gy < WROW; gy++) {
    for (let gx = 0; gx < WCOL; gx++) {
      if (zoneOpenGrid[gy * WCOL + gx]) continue;                 // 已開
      if (zoneLandOf(gx, gy) < 120) continue;                     // 幾乎全是海，不開放
      let passable = 0, nb = 0;
      if (gx > 0 && zoneOpenGrid[gy * WCOL + gx - 1]) { nb++; passable += seamPassable(gx * ZW, gy * ZH, true); }
      if (gx < WCOL - 1 && zoneOpenGrid[gy * WCOL + gx + 1]) { nb++; passable += seamPassable((gx + 1) * ZW, gy * ZH, true); }
      if (gy > 0 && zoneOpenGrid[(gy - 1) * WCOL + gx]) { nb++; passable += seamPassable(gx * ZW, gy * ZH, false); }
      if (gy < WROW - 1 && zoneOpenGrid[(gy + 1) * WCOL + gx]) { nb++; passable += seamPassable(gx * ZW, (gy + 1) * ZH, false); }
      if (!nb || passable < 2) continue;                          // 接不到就不要開
      const ring = Math.max(Math.abs(gx - home.gx), Math.abs(gy - home.gy));
      const ang = Math.atan2(gy - home.gy, gx - home.gx);
      cand.push({ gx: gx, gy: gy, ring: ring, ang: ang, nb: nb, passable: passable });
    }
  }
  if (!cand.length) return false;
  cand.sort(function (a, c) {
    if (a.ring !== c.ring) return a.ring - c.ring;          // 先開內圈
    if (a.ang !== c.ang) return a.ang - c.ang;              // 同一圈按角度繞
    if (c.passable !== a.passable) return c.passable - a.passable;   // 接口寬的先開
    return c.nb - a.nb;
  });
  openZone(cand[0].gx, cand[0].gy);
  return true;
}

function localLand(t, lx, ly, r, b) {
  if (lx >= 0 && ly >= 0 && lx < ZW && ly < ZH) return t[ly * ZW + lx] === 1;
  return b.isLand(r.x0 + lx, r.y0 + ly);
}

function terrainColorAt(wx, wy) {
  const n = clamp((fbm(wx * 0.13 + 17, wy * 0.13 + 9, WORLD_SEED + 5, 3) - 0.28) / 0.44, 0, 1);
  const m = clamp((fbm(wx * 0.31 + 5, wy * 0.31 + 21, WORLD_SEED + 41, 2) - 0.34) / 0.4, 0, 1);
  const P = BIOMES[biomeAt(wx, wy)];
  let cr, cg, cb;
  if (n < 0.45) {
    const k = n / 0.45;
    cr = lerp(P.low[0], P.mid[0], k);
    cg = lerp(P.low[1], P.mid[1], k);
    cb = lerp(P.low[2], P.mid[2], k);
  } else {
    const k = (n - 0.45) / 0.55;
    cr = lerp(P.mid[0], P.hi[0], k);
    cg = lerp(P.mid[1], P.hi[1], k);
    cb = lerp(P.mid[2], P.hi[2], k);
  }
  cr = lerp(cr, cr * 0.82, m * 0.55);
  cg = lerp(cg, cg * 0.92, m * 0.55);
  cb = lerp(cb, cb * 0.78, m * 0.55);
  let seaSides = 0;
  if (!knownLand(wx - 1, wy)) seaSides++;
  if (!knownLand(wx + 1, wy)) seaSides++;
  if (!knownLand(wx, wy - 1)) seaSides++;
  if (!knownLand(wx, wy + 1)) seaSides++;
  if (seaSides > 0) {
    const k = Math.min(1, seaSides / 3) * 0.55;
    cr = lerp(cr, 226, k); cg = lerp(cg, 208, k); cb = lerp(cb, 162, k);
  }
  const shade = 0.97 + hash2i(wx, wy, 7) * 0.06;
  return packRGBA(
    clamp(cr * shade, 0, 255) | 0,
    clamp(cg * shade, 0, 255) | 0,
    clamp(cb * shade, 0, 255) | 0, 255);
}

/* 可達性保險：矩形揭露可能把新區塊裡的一小撮陸地切成孤島，玩家走不到就永遠清不完。
   遇到這種情況，就從最近的已可達格鑿一條 2 格寬的陸橋過去（天然地峽的長相），
   而不是把地刪掉 —— 刪掉會讓畫面出現莫名其妙的方塊空洞。 */
function connectUnreachable(t, r) {
  const b = G.board, W = b.w, H = b.h;
  const openCell = function (i) {
    const gx = ((i % W) / ZW) | 0, gy = (((i / W) | 0) / ZH) | 0;
    return zoneOpenGrid[gy * WCOL + gx] === 1;
  };
  let sx = -1, sy = -1;
  const u = G.player && G.player.unit;
  if (u) { sx = clamp(Math.floor(u.x), 0, W - 1); sy = clamp(Math.floor(u.y), 0, H - 1); }
  else {
    let bestD = 1e9;
    for (let y = 0; y < ZH; y++) {
      for (let x = 0; x < ZW; x++) {
        if (!t[y * ZW + x]) continue;
        const d = (x - ZW / 2) * (x - ZW / 2) + (y - ZH / 2) * (y - ZH / 2);
        if (d < bestD) { bestD = d; sx = r.x0 + x; sy = r.y0 + y; }
      }
    }
  }
  if (sx < 0 || sy < 0 || !b.terrain[sy * W + sx]) return 0;
  const startIdx = sy * W + sx;

  const flood = function () {
    const seen = new Uint8Array(W * H);
    const q = new Int32Array(W * H);
    let qh = 0, qt = 0;
    seen[startIdx] = 1; q[qt++] = startIdx;
    while (qh < qt) {
      const i = q[qh++]; const x = i % W, y = (i / W) | 0;
      if (x > 0)     { const j = i - 1; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (x < W - 1) { const j = i + 1; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (y > 0)     { const j = i - W; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
      if (y < H - 1) { const j = i + W; if (b.terrain[j] && !seen[j]) { seen[j] = 1; q[qt++] = j; } }
    }
    return seen;
  };

  let bridges = 0;
  for (let guard = 0; guard < 4; guard++) {
    const seen = flood();
    let bad = -1;
    for (let y = 0; y < ZH && bad < 0; y++) {
      for (let x = 0; x < ZW; x++) {
        if (!t[y * ZW + x]) continue;
        const wi = (r.y0 + y) * W + (r.x0 + x);
        if (!seen[wi]) { bad = wi; break; }
      }
    }
    if (bad < 0) break;

    /* 只在「已開放」的範圍裡找路，避免把陸橋鑿到還沒開放的區塊上 */
    const parent = new Int32Array(W * H).fill(-1);
    const dist = new Int16Array(W * H).fill(-1);
    const q = new Int32Array(W * H);
    let qh = 0, qt = 0;
    for (let i = 0; i < W * H; i++) if (seen[i]) { dist[i] = 0; q[qt++] = i; }
    let hit = -1;
    while (qh < qt && hit < 0) {
      const i = q[qh++];
      if (dist[i] >= 24) continue;
      const x = i % W, y = (i / W) | 0;
      const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, y > 0 ? i - W : -1, y < H - 1 ? i + W : -1];
      for (const j of nb) {
        if (j < 0 || dist[j] >= 0 || !openCell(j)) continue;
        dist[j] = dist[i] + 1;
        parent[j] = i;
        q[qt++] = j;
        if (j === bad) { hit = j; break; }
      }
    }

    if (hit < 0) {
      /* 真的接不到（被未開放區塊隔開）：把那一小撮沉回海裡，至少不會卡死 */
      for (let y = 0; y < ZH; y++) {
        for (let x = 0; x < ZW; x++) {
          if (!t[y * ZW + x]) continue;
          const wi = (r.y0 + y) * W + (r.x0 + x);
          if (seen[wi]) continue;
          t[y * ZW + x] = 0;
          b.terrain[wi] = 0;
        }
      }
      break;
    }

    /* 沿著找到的路把海改成陸，並加寬成 2 格，看起來像天然地峽 */
    let cur = hit;
    const path = [];
    while (cur >= 0 && dist[cur] > 0) { path.push(cur); cur = parent[cur]; }
    for (const i of path) {
      const x = i % W, y = (i / W) | 0;
      const cells = [i];
      if (x < W - 1) cells.push(i + 1);
      for (const j of cells) {
        if (b.terrain[j]) continue;
        const zx = (j % W) - r.x0, zy = ((j / W) | 0) - r.y0;
        const inNew = zx >= 0 && zy >= 0 && zx < ZW && zy < ZH;
        b.terrain[j] = 1;
        if (inNew) {
          t[zy * ZW + zx] = 1;          // 這一格會被繪製流程一起算進 land
        } else {
          const zg = zoneAt(((j % W) / ZW) | 0, (((j / W) | 0) / ZH) | 0);
          if (!zg) { b.terrain[j] = 0; continue; }
          worldLand[j] = 1;
          b.landCount++;
          b.cnt[0]++;
          zg.land++;
          repaintCell(j % W, (j / W) | 0);
        }
      }
    }
    bridges++;
  }
  return bridges;
}

function repaintCell(wx, wy) {
  const img = terrainCtx.createImageData(1, 1);
  new Uint32Array(img.data.buffer)[0] = terrainColorAt(wx, wy);
  terrainCtx.putImageData(img, wx, wy);
}

function openZone(gx, gy, isHome) {
  const b = G.board;
  const r = zoneRect(gx, gy);
  const seed = (G.baseSeed + G.zones.length * 7919) | 0;
  /* 地形不再自己長，直接切世界地圖的一塊出來 */
  const t = new Uint8Array(ZW * ZH);
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) t[y * ZW + x] = worldLand[(r.y0 + y) * WORLD_W + (r.x0 + x)];
  }
  zoneOpenGrid[gy * WCOL + gx] = 1;
  /* 先寫進 board，可達性檢查才知道新陸地接不接得上 */
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      if (t[y * ZW + x]) b.terrain[(r.y0 + y) * WORLD_W + (r.x0 + x)] = 1;
    }
  }
  connectUnreachable(t, r);

  const img = terrainCtx.createImageData(ZW, ZH);
  const u32 = new Uint32Array(img.data.buffer);
  let land = 0;
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      const li = y * ZW + x;
      if (!t[li]) continue;
      land++;
      b.growBox(r.x0 + x, r.y0 + y);
      u32[li] = terrainColorAt(r.x0 + x, r.y0 + y);
    }
  }
  terrainCtx.putImageData(img, r.x0, r.y0);

  b.landCount += land;
  b.cnt[0] += land;

  const z = {
    gx, gy, x0: r.x0, y0: r.y0, w: ZW, h: ZH,
    land, open: true, reveal: 1, seed
  };
  G.zones.push(z);

  buildZoneCoast(t, r);
  paintShadow();
  terrDirty = true;

  buildDistricts(z, t);
  assignOwners(z, isHome ? pickHomeDistrict(z) : -1);
  G.grace = CFG.enterGrace;
  if (G.player) {
    const br = Math.min(4, 2 + Math.floor(G.zones.length / 4));
    G.player.brush = br;
    G.player.unit.brush = br;
  }
  // 鏡頭只往新區塊偏過去一點，不要整個把玩家甩出畫面
  const u = G.player && G.player.unit;
  const tcx = r.x0 + ZW / 2, tcy = r.y0 + ZH / 2;
  if (u) camPanTo(lerp(u.x, tcx, 0.42), lerp(u.y, tcy, 0.42), 1.1);
  toast('新的領土浮現　·　第 ' + G.zones.length + ' 塊');
  if (!G.warMode && G.zones.length >= 4) {
    G.warMode = true;
    setTimeout(function () { toast('戰役模式　·　敵地只能從自己的領土往外推'); }, 1500);
    blip(220, 0.3, 0.05, 'sawtooth');
  }
  return z;
}

function buildZoneCoast(t, r) {
  const b = G.board;
  const p = new Path2D();
  for (let y = 0; y < ZH; y++) {
    for (let x = 0; x < ZW; x++) {
      if (!t[y * ZW + x]) continue;
      const wx = r.x0 + x, wy = r.y0 + y;
      if (!b.isLand(wx, wy - 1)) { p.moveTo(wx, wy); p.lineTo(wx + 1, wy); }
      if (!b.isLand(wx, wy + 1)) { p.moveTo(wx, wy + 1); p.lineTo(wx + 1, wy + 1); }
      if (!b.isLand(wx - 1, wy)) { p.moveTo(wx, wy); p.lineTo(wx, wy + 1); }
      if (!b.isLand(wx + 1, wy)) { p.moveTo(wx + 1, wy); p.lineTo(wx + 1, wy + 1); }
    }
  }
  coastPath.addPath(p);
}

/* ═══════════════════════════ 單位 ═══════════════════════════ */
class Unit {
  constructor(owner, x, y, speed, brush) {
    this.owner = owner;
    this.x = x;
    this.y = y;
    this.fx = 0;
    this.fy = 1;
    this.speed = speed;
    this.brush = brush;
    this.alive = true;
    this.phase = Math.random() * TAU;
    this.stunned = false;
    this.breath = 0;
  }
}

function canStand(b, x, y, r) {
  return b.isLand(Math.floor(x - r), Math.floor(y)) &&
         b.isLand(Math.floor(x + r), Math.floor(y)) &&
         b.isLand(Math.floor(x), Math.floor(y - r)) &&
         b.isLand(Math.floor(x), Math.floor(y + r));
}

function moveUnit(b, u, dx, dy, dt, mult) {
  if (u.stunned) return;
  const len = Math.hypot(dx, dy);
  if (len < 1e-5) return;
  dx /= len; dy /= len;
  u.fx = lerp(u.fx, dx, 0.28);
  u.fy = lerp(u.fy, dy, 0.28);
  const step = u.speed * (mult || 1) * BIOMES[biomeAt(u.x, u.y)].move * dt;
  const R = 0.32;
  const nx = u.x + dx * step;
  if (canStand(b, nx, u.y, R)) u.x = nx;
  const ny = u.y + dy * step;
  if (canStand(b, u.x, ny, R)) u.y = ny;
}

const _bx = new Int16Array(512);
const _by = new Int16Array(512);
const _bd = new Uint8Array(512);

function collectBrush(b, u, cb, rOverride) {
  const cx = Math.floor(u.x), cy = Math.floor(u.y);
  if (!b.isLand(cx, cy)) return;
  const r = rOverride === undefined ? u.brush : rOverride;
  const id = ++b.stampId;
  let qh = 0, qt = 0;
  _bx[qt] = cx; _by[qt] = cy; _bd[qt] = 0; qt++;
  b.stamp[cy * b.w + cx] = id;
  while (qh < qt) {
    const x = _bx[qh], y = _by[qh], d = _bd[qh]; qh++;
    cb(x, y);
    if (d >= r) continue;
    for (let k = 0; k < 4; k++) {
      const nx = x + (k === 0 ? 1 : k === 1 ? -1 : 0);
      const ny = y + (k === 2 ? 1 : k === 3 ? -1 : 0);
      if (!b.isLand(nx, ny)) continue;
      const ni = ny * b.w + nx;
      if (b.stamp[ni] === id) continue;
      b.stamp[ni] = id;
      if (qt >= 512) continue;
      _bx[qt] = nx; _by[qt] = ny; _bd[qt] = d + 1; qt++;
    }
  }
}

function applyBrush(b, u, dt) {
  if (!u.alive || u.stunned) return;
  const surging = u.owner === 0 && G.surge.t > 0;
  const dmg = DMG * dt * (surging ? CFG.surgeDmg : 1);
  const now = b.time;
  /* 進場保護：剛開新區塊的幾秒內，AI 不能直接吃掉玩家的地 */
  const grace = u.owner !== 0 && G.grace > 0;
  collectBrush(b, u, (x, y) => {
    const i = y * b.w + x;
    if (b.lock[i] > now) return;
    const o = b.owner[i];
    if (o === u.owner) return;
    if (grace && o === 0) return;
    if (o === NEUTRAL) {
      b.setOwner(i, u.owner);
      b.hp[i] = HP_MAX;
      b.lock[i] = now + CFG.captureLock;
      if (u.owner === 0 && Math.random() < 0.05) {
        spawnPart(x + 0.5, y + 0.5, COLORS[0].css, 0.16, 0.55);
      }
    } else {
      /* 戰役模式：敵格只能從自己的領土往外推 */
      if (G.warMode && !supplied(b, i, u.owner)) return;
      b.hp[i] -= dmg;
      if (b.hp[i] <= 0) {
        b.setOwner(i, u.owner);
        b.hp[i] = HP_MAX;
        b.lock[i] = now + CFG.captureLock;
        spawnBurst(x + 0.5, y + 0.5, COLORS[o].css);
        if (u.owner === 0) sfxFlip();
      }
    }
  }, surging ? u.brush + 1 : undefined);
}

/* 戰役模式：只能從自己的領土往外推 —— 敵格必須緊鄰自己的地才打得動 */
function supplied(b, i, owner) {
  const x = i % b.w, y = (i / b.w) | 0;
  if (x > 0 && b.owner[i - 1] === owner) return true;
  if (x < b.w - 1 && b.owner[i + 1] === owner) return true;
  if (y > 0 && b.owner[i - b.w] === owner) return true;
  if (y < b.h - 1 && b.owner[i + b.w] === owner) return true;
  return false;
}

/* ═══════════════════════════ 人口與兵團 ═══════════════════════════ */
function playerPop() {
  let p = 0;
  for (const cap of G.caps) if (cap.owner === 0) p += cap.pop || 0;
  return p;
}

function controlledUnit() {
  if (!G.player) return null;
  if (G.control < 0) return G.player.unit;
  const a = G.armies[G.control];
  if (!a || !a.alive) { G.control = -1; return G.player.unit; }
  return a;
}

function cycleControl() {
  const n = G.armies.length;
  if (!n) { toast('還沒有兵團　·　人口每 1 萬會自動成軍'); return; }
  G.control++;
  if (G.control >= n) G.control = -1;
  const cu = controlledUnit();
  if (G.control < 0) toast('操控：本體');
  else toast('操控：兵團 ' + (G.control + 1) + '（' + G.armies[G.control].men + ' 人）');
  camPanTo(cu.x, cu.y, 0.5);
  if (G.player) { G.surge.t = 0; }
}

function spawnArmy() {
  const mine = G.caps.filter(c => c.owner === 0);
  if (!mine.length) return;
  const cap = mine[(Math.random() * mine.length) | 0];
  cap.pop = Math.max(60, (cap.pop || 0) - 500);
  const a = new Unit(0, cap.x, cap.y, CFG.playerSpeed * 0.86, 3);
  a.kind = 'army';
  a.men = 500;
  a.home = cap;
  a.out = false;
  G.armies.push(a);
  for (let k = 0; k < 16; k++) spawnPart(cap.x, cap.y, '#ffe08a', 0.9, 0.75);
  toast('新兵團成軍　·　' + (cap.district && cap.district.biome !== undefined
        ? BIOMES[cap.district.biome].name : '') + '　·　共 ' + G.armies.length + ' 支');
  blip(640, 0.16, 0.05, 'triangle');
}

function updatePop(dt) {
  G.popT += dt;
  if (G.popT < 30) return;
  G.popT -= 30;
  for (const cap of G.caps) {
    const g = BIOMES[cap.biome || 0].grow;
    const max = (cap.district ? cap.district.size : 60) * 300;
    cap.pop = Math.min(max, (cap.pop || 0) * (1 + 0.14 * g) + 4);
  }
  const total = playerPop();
  while (total - G.popPaid >= 10000) {
    G.popPaid += 10000;
    spawnArmy();
  }
}

function ownGround(b, u) {
  const cx = Math.floor(u.x), cy = Math.floor(u.y);
  if (b.owner[cy * b.w + cx] === u.owner) return true;
  if (cx > 0 && b.owner[cy * b.w + cx - 1] === u.owner) return true;
  if (cx < b.w - 1 && b.owner[cy * b.w + cx + 1] === u.owner) return true;
  if (cy > 0 && b.owner[(cy - 1) * b.w + cx] === u.owner) return true;
  if (cy < b.h - 1 && b.owner[(cy + 1) * b.w + cx] === u.owner) return true;
  return false;
}

/* ═══════════════════════════ AI ═══════════════════════════ */
const _from = new Int32Array(WORLD_W * WORLD_H);
const _seen = new Uint8Array(WORLD_W * WORLD_H);
const _queue = new Int32Array(WORLD_W * WORLD_H);

class Brain {
  constructor(unit) {
    this.u = unit;
    this.t = 0;
    this.tx = unit.x;
    this.ty = unit.y;
    this.has = false;
    this.cap = null;        // 正在圍的城
    this.stuck = 0;
    this.lastX = unit.x;
    this.lastY = unit.y;
  }

  update(dt, b) {
    const u = this.u;
    if (!u.alive || u.stunned) return;

    /* 已經站在別人的主城上 → 站著不動就是圍城，別再抽新目標 */
    if (this.cap && this.cap.owner !== u.owner) {
      const dc = Math.hypot(this.cap.x - u.x, this.cap.y - u.y);
      if (dc < 0.85) { this.has = false; this.t = 0.2; return; }
    }

    this.t -= dt;
    if (this.t <= 0) {
      this.pick(b);
      this.t = 0.34 + Math.random() * 0.24;
    }

    if (!this.has) return;
    const dx = this.tx - u.x, dy = this.ty - u.y;
    const d = Math.hypot(dx, dy);
    if (d > 0.5) {
      moveUnit(b, u, dx, dy, dt);
      /* 卡住偵測：兩秒內幾乎沒位移就換目標 */
      if (Math.hypot(u.x - this.lastX, u.y - this.lastY) < 0.02) {
        this.stuck += dt;
        if (this.stuck > 1.2) { this.stuck = 0; this.has = false; this.t = 0; this.cap = null; }
      } else { this.stuck = 0; }
    } else {
      this.t = Math.min(this.t, 0.1);
    }
    this.lastX = u.x; this.lastY = u.y;
  }

  /* 重新挑目標：中立地 / 玩家地 / 別人的地 / 別人的主城 */
  pick(b) {
    const u = this.u;
    const cx = Math.floor(u.x), cy = Math.floor(u.y);
    const mine = b.cnt[u.owner + 1];
    const hungry = mine < 26;
    const aggro = (u.owner !== 0) ? (AGGRO[G.aggression] || 0.8) : 1;
    const warm = G.t < CFG.warmup ? 0.2 : 1;
    const R = hungry ? 40 : 30;

    let best = -1, bestScore = 0, bestCap = null;

    /* 主城優先：強攻時會專程去拆玩家的城 */
    for (const cap of G.caps) {
      if (cap.owner === u.owner) continue;
      if (cap.owner === 0 && aggro < 1.4) continue;   // 只有「強」才會打玩家的城
      const d = Math.abs(cap.x - u.x) + Math.abs(cap.y - u.y);
      if (d > 46) continue;
      let v = cap.owner === 0 ? aggro * 2.9 * warm : 1.55;
      if (hungry) v *= 0.55;
      const sc = v / (1 + d * 0.028) * (0.9 + Math.random() * 0.2);
      if (sc > bestScore) { bestScore = sc; best = cap.i; bestCap = cap; }
    }

    for (let y = Math.max(0, cy - R); y <= Math.min(b.h - 1, cy + R); y++) {
      for (let x = Math.max(0, cx - R); x <= Math.min(b.w - 1, cx + R); x++) {
        const i = y * b.w + x;
        if (!b.terrain[i]) continue;
        const o = b.owner[i];
        if (o === u.owner) continue;
        const d = Math.abs(x - cx) + Math.abs(y - cy);
        let v;
        if (o === NEUTRAL) v = 1.0;
        else if (o === 0) v = aggro * warm * (hungry ? 0.5 : 1.0);
        else v = 2.05 * (hungry ? 0.6 : 1.0);          // 對其他 AI 永遠強
        /* 距離衰減故意放很慢：遠一點的地也吃，AI 才不會只在自己腳邊打轉 */
        const sc = v / (1 + d * 0.014) * (0.78 + Math.random() * 0.44);
        if (sc > bestScore) { bestScore = sc; best = i; bestCap = null; }
      }
    }

    this.cap = bestCap;
    if (best < 0) {
      /* 周圍真的沒東西可吃（整個區塊都是自己的）→ 往最近的未佔格走 */
      let far = -1, farD = 1e9;
      for (let k = 0; k < b.n; k++) {
        if (!b.terrain[k] || b.owner[k] === u.owner) continue;
        const d = Math.abs(k % b.w - cx) + Math.abs(((k / b.w) | 0) - cy);
        if (d < farD) { farD = d; far = k; }
      }
      if (far < 0) { this.has = false; return; }
      best = far;
    }

    const step = this.pathTo(b, cx, cy, best);
    if (step < 0) {
      /* 走不到 → 先往目標方向硬走一小段，不要罰站 */
      const tx = (best % b.w) + 0.5, ty = ((best / b.w) | 0) + 0.5;
      this.tx = tx; this.ty = ty; this.has = true;
      return;
    }
    this.tx = (step % b.w) + 0.5;
    this.ty = ((step / b.w) | 0) + 0.5;
    this.has = true;
  }

  pathTo(b, cx, cy, target) {
    const w = b.w;
    const start = cy * w + cx;
    if (start === target) return -1;
    const seen = _seen, q = _queue, from = _from;
    let qh = 0, qt = 0;
    q[qt++] = start; seen[start] = 1; from[start] = -1;
    let found = -1;
    while (qh < qt && qt < 5200) {
      const i = q[qh++];
      if (i === target) { found = i; break; }
      const x = i % w, y = (i / w) | 0;
      if (x > 0)     { const j = i - 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (x < b.w - 1) { const j = i + 1; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y > 0)     { const j = i - w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
      if (y < b.h - 1) { const j = i + w; if (!seen[j] && b.terrain[j]) { seen[j] = 1; from[j] = i; q[qt++] = j; } }
    }
    if (found < 0) {
      for (let k = 0; k < qt; k++) seen[q[k]] = 0;
      return -1;
    }
    let cur = found;
    while (from[cur] !== start && from[cur] >= 0) cur = from[cur];
    for (let k = 0; k < qt; k++) seen[q[k]] = 0;
    return cur;
  }
}

/* ═══════════════════════════ 粒子／音效 ═══════════════════════════ */
function spawnPart(x, y, c, sp, life) {
  if (G.parts.length > 420) return;
  const a = Math.random() * TAU;
  G.parts.push({
    x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life, max: life, c, r: 0.1 + Math.random() * 0.1
  });
}
function spawnBurst(x, y, c) {
  for (let k = 0; k < 5; k++) spawnPart(x, y, c, 0.5 + Math.random() * 0.7, 0.28 + Math.random() * 0.3);
}

let actx = null, muted = false, lastFlip = 0;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  return actx;
}
function blip(freq, dur, gain, type) {
  const a = audio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(gain, a.currentTime + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function sfxFlip() {
  if (muted) return;
  const now = performance.now();
  if (now - lastFlip < 70) return;
  lastFlip = now;
  blip(420 + Math.random() * 120, 0.05, 0.018, 'triangle');
}

/* ═══════════════════════════ 地區 ═══════════════════════════ */
/* 把一塊區塊的陸地切成 4~6 個「地區」：最遠點取樣挑種子，再多源 BFS 分地，
   所以每個地區一定是連通的一整片（不會東一塊西一塊）。 */
function buildDistricts(z, t) {
  const w = ZW, h = ZH;
  const land = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (t[y * w + x]) land.push(y * w + x);
  z.districts = [];
  z.borders = null;
  if (!land.length) return;
  const rnd = mulberry32((z.seed ^ 0x2f9e71) >>> 0);
  let k = 4 + ((rnd() * 3) | 0);                       // 4、5、6
  k = Math.max(2, Math.min(k, Math.floor(land.length / 18)));

  /* 1. 最遠點取樣：種子盡量散開，但保留一點隨機 */
  const seeds = [land[(rnd() * land.length) | 0]];
  const tmp = new Float32Array(land.length);
  while (seeds.length < k) {
    let bestD = -1;
    for (let n = 0; n < land.length; n++) {
      const c = land[n];
      let md = 1e9;
      for (let si = 0; si < seeds.length; si++) {
        const sc = seeds[si];
        const dx = (c % w) - (sc % w), dy = ((c / w) | 0) - ((sc / w) | 0);
        const dd = dx * dx + dy * dy;
        if (dd < md) md = dd;
      }
      tmp[n] = md;
      if (md > bestD) bestD = md;
    }
    const pool = [];
    for (let n = 0; n < land.length; n++) if (tmp[n] > bestD * 0.5) pool.push(land[n]);
    seeds.push(pool.length ? pool[(rnd() * pool.length) | 0] : land[(rnd() * land.length) | 0]);
  }

  /* 2. 多源 BFS：每格歸給最快走到的種子 → 每區必連通 */
  const lab = new Int8Array(w * h).fill(-1);
  const q = new Int32Array(w * h);
  let qh = 0, qt = 0;
  for (let si = 0; si < seeds.length; si++) {
    const c = seeds[si];
    if (lab[c] >= 0) continue;
    lab[c] = si; q[qt++] = c;
  }
  while (qh < qt) {
    const c = q[qh++], x = c % w, y = (c / w) | 0;
    if (x > 0)     { const n = c - 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (x < w - 1) { const n = c + 1; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y > 0)     { const n = c - w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
    if (y < h - 1) { const n = c + w; if (t[n] && lab[n] < 0) { lab[n] = lab[c]; q[qt++] = n; } }
  }
  for (const c of land) if (lab[c] < 0) {
    const x = c % w, y = (c / w) | 0;
    const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
    for (const n of nb) if (n >= 0 && lab[n] >= 0) { lab[c] = lab[n]; break; }
  }

  /* 3. 太小的地區併進鄰居 */
  const minCells = Math.max(9, Math.floor(land.length * 0.085));
  for (let guard = 0; guard < 14; guard++) {
    const sizes = new Int32Array(seeds.length);
    for (const c of land) if (lab[c] >= 0) sizes[lab[c]]++;
    let small = -1;
    for (let i = 0; i < sizes.length; i++) if (sizes[i] > 0 && sizes[i] < minCells) { small = i; break; }
    if (small < 0) break;
    const touch = new Int32Array(seeds.length);
    for (const c of land) {
      if (lab[c] !== small) continue;
      const x = c % w, y = (c / w) | 0;
      const nb = [x > 0 ? c - 1 : -1, x < w - 1 ? c + 1 : -1, y > 0 ? c - w : -1, y < h - 1 ? c + w : -1];
      for (const n of nb) if (n >= 0 && lab[n] >= 0 && lab[n] !== small) touch[lab[n]]++;
    }
    let to = -1, best = -1;
    for (let i = 0; i < touch.length; i++) if (touch[i] > best) { best = touch[i]; to = i; }
    if (to < 0) break;
    for (const c of land) if (lab[c] === small) lab[c] = to;
  }

  /* 4. 建立地區物件 + 主城 */
  const groups = new Map();
  for (const c of land) {
    const l = lab[c];
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push(c);
  }
  let id = 0;
  for (const arr0 of groups.values()) {
    /* 這裡的索引是「區塊內座標」，換算成世界座標才拿去塗 */
    const arr = new Int32Array(arr0.length);
    for (let n = 0; n < arr0.length; n++) {
      const lc = arr0[n];
      arr[n] = (z.y0 + ((lc / w) | 0)) * WORLD_W + (z.x0 + (lc % w));
    }
    /* 主城位置要用「區塊內座標」算，arr 已是世界座標 */
    let capC = arr0[0], capScore = -1;
    for (const c of arr0) {
      const x = c % w, y = (c / w) | 0;
      let sc = 0;
      for (let dy = -3; dy <= 3; dy++) {
        for (let dx = -3; dx <= 3; dx++) {
          if (Math.abs(dx) + Math.abs(dy) > 3) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          if (t[ny * w + nx]) sc++;
        }
      }
      if (sc > capScore) { capScore = sc; capC = c; }
    }
    const cx = capC % w, cy = (capC / w) | 0;
    const bi = biomeAt(z.x0 + cx, z.y0 + cy);
    z.districts.push({
      id: id++, cells: arr, size: arr.length, owner: NEUTRAL, biome: bi,
      cap: {
        lx: cx, ly: cy, x: z.x0 + cx + 0.5, y: z.y0 + cy + 0.5,
        i: (z.y0 + cy) * WORLD_W + (z.x0 + cx),
        owner: NEUTRAL, prog: 0, surr: 0, pulse: 0, flash: 0, checkT: 0,
        biome: bi, pop: arr.length * 10, zone: z
      }
    });
  }
  for (const d of z.districts) d.cap.district = d;

  /* 5. 地區邊界線 */
  const p = new Path2D();
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = y * w + x;
      if (!t[c]) continue;
      const l = lab[c], wx = z.x0 + x, wy = z.y0 + y;
      if (x < w - 1 && t[c + 1] && lab[c + 1] !== l) { p.moveTo(wx + 1, wy); p.lineTo(wx + 1, wy + 1); }
      if (y < h - 1 && t[c + w] && lab[c + w] !== l) { p.moveTo(wx, wy + 1); p.lineTo(wx + 1, wy + 1); }
    }
  }
  z.borders = p;
}

/* 把整塊區塊分給各路人馬（玩家主場則保留一個地區給玩家） */
function assignOwners(z, homeIdx) {
  const b = G.board;
  const ds = z.districts;
  if (!ds.length) return;
  const want = Math.min(homeIdx >= 0 ? 3 : 4, Math.max(1, ds.length - (homeIdx >= 0 ? 1 : 0)));
  const used = new Set();
  for (const r of G.rivals) if (!r.dead) used.add(r.owner);
  const slots = [];
  for (let o = 1; o < COLORS.length && slots.length < want; o++) if (!used.has(o)) slots.push(o);

  let si = 0;
  const ownerOf = [];
  for (const d of ds) {
    if (d.id === homeIdx) { ownerOf[d.id] = 0; continue; }
    ownerOf[d.id] = slots.length ? slots[si++ % slots.length] : NEUTRAL;
  }

  /* 預填：整個地區都塗成地主的顏色（玩家主場除外） */
  for (const d of ds) {
    const o = ownerOf[d.id];
    d.owner = o;
    d.cap.owner = o;
    for (const i of d.cells) {
      b.setOwner(i, o);
      b.hp[i] = HP_MAX;
      b.lock[i] = 0;
    }
    b.setOwner(d.cap.i, o);
  }

  /* 進場走廊：接縫往中心的路、以及接縫附近的登陸場保持中立，讓玩家走得進來 */
  const cx = ZW / 2, cy = ZH / 2;
  const seams = [];
  if (zoneAt(z.gx - 1, z.gy)) seams.push([0, ZH / 2]);
  if (zoneAt(z.gx + 1, z.gy)) seams.push([ZW, ZH / 2]);
  if (zoneAt(z.gx, z.gy - 1)) seams.push([ZW / 2, 0]);
  if (zoneAt(z.gx, z.gy + 1)) seams.push([ZW / 2, ZH]);
  const clear = (lx, ly, rad) => {
    for (let y = Math.floor(ly - rad); y <= Math.ceil(ly + rad); y++) {
      for (let x = Math.floor(lx - rad); x <= Math.ceil(lx + rad); x++) {
        if (x < 0 || y < 0 || x >= ZW || y >= ZH) continue;
        if ((x - lx) * (x - lx) + (y - ly) * (y - ly) > rad * rad) continue;
        const i = (z.y0 + y) * WORLD_W + (z.x0 + x);
        if (!b.terrain[i]) continue;
        if (b.owner[i] === 0) continue;
        b.setOwner(i, NEUTRAL);
      }
    }
  };
  for (const sm of seams) {
    clear(sm[0], sm[1], 3.2);
    for (let t01 = 0; t01 <= 1.0001; t01 += 0.12) {
      clear(sm[0] + (cx - sm[0]) * t01, sm[1] + (cy - sm[1]) * t01, 1.6);
    }
  }

  /* 對手：每個佔到地的顏色生一隻，站在自己的主城上 */
  const seen = new Set();
  for (const d of ds) {
    const o = ownerOf[d.id];
    if (o <= 0 || seen.has(o)) continue;
    seen.add(o);
    const u = new Unit(o, d.cap.x, d.cap.y,
      Math.min(CFG.aiSpeedMax, CFG.aiSpeedBase + CFG.aiSpeedPerZone * (G.zones.length - 1)),
      Math.min(3, 1 + Math.floor((G.zones.length - 1) / 3)));
    G.rivals.push({ owner: o, name: makeFactionName(), unit: u, brain: new Brain(u), dead: false });
  }

  for (const d of ds) G.caps.push(d.cap);
  rivalSig = ''; capSig = '';
}

/* 玩家主場：離區塊中心最近的那個地區 */
function pickHomeDistrict(z) {
  const cx = ZW / 2, cy = ZH / 2;
  let best = -1, bestD = 1e9;
  for (const d of z.districts) {
    const dd = (d.cap.lx - cx) * (d.cap.lx - cx) + (d.cap.ly - cy) * (d.cap.ly - cy);
    const dc = (d.cells[0] % ZW - cx) * (d.cells[0] % ZW - cx);
    if (dd < bestD) { bestD = dd; best = d.id; }
  }
  return best;
}

/* ═══════════════════════════ 開局 ═══════════════════════════ */
function freeOwnerSlot() {
  for (let o = 1; o < COLORS.length; o++) {
    let used = false;
    for (const r of G.rivals) if (!r.dead && r.owner === o) used = true;
    if (!used) return o;
  }
  return -1;
}

function spawnRivals(z) {
  const want = Math.min(3, 1 + Math.floor(G.zones.length / 3));
  let placed = 0;
  const rand = mulberry32((z.seed ^ 0x51ed270b) >>> 0);
  for (let tries = 0; tries < 260 && placed < want; tries++) {
    const lx = 3 + ((rand() * (ZW - 6)) | 0);
    const ly = 3 + ((rand() * (ZH - 6)) | 0);
    const wx = z.x0 + lx, wy = z.y0 + ly;
    const i = wy * WORLD_W + wx;
    if (!G.board.terrain[i]) continue;
    let ok = true;
    for (let dy = -1; dy <= 1 && ok; dy++)
      for (let dx = -1; dx <= 1; dx++)
        if (!G.board.terrain[i + dy * WORLD_W + dx]) { ok = false; break; }
    if (!ok) continue;
    // 不要擠在一起
    for (const r of G.rivals) {
      if (r.dead) continue;
      if (Math.abs(r.unit.x - wx) + Math.abs(r.unit.y - wy) < 9) { ok = false; break; }
    }
    if (!ok) continue;
    const slot = freeOwnerSlot();
    if (slot < 0) break;
    const u = new Unit(slot, wx + 0.5, wy + 0.5,
      Math.min(CFG.aiSpeedMax, CFG.aiSpeedBase + CFG.aiSpeedPerZone * (G.zones.length - 1)),
      Math.min(3, 1 + Math.floor((G.zones.length - 1) / 3)));
    G.rivals.push({ owner: slot, unit: u, brain: new Brain(u), dead: false });
    paintBlob(wx, wy, 2, slot);
    placed++;
  }
}

function paintBlob(cx, cy, r, owner) {
  const b = G.board;
  for (let y = cy - r; y <= cy + r; y++) {
    for (let x = cx - r; x <= cx + r; x++) {
      if (Math.abs(x - cx) + Math.abs(y - cy) > r) continue;
      if (!b.isLand(x, y)) continue;
      b.setOwner(y * b.w + x, owner);
      b.hp[y * b.w + x] = HP_MAX;
    }
  }
}

function newGame() {
  G.zones.length = 0;
  G.rivals.length = 0;
  G.caps.length = 0;
  G.parts.length = 0;
  G.t = 0;
  G.zone = 1;
  G.kills = 0;
  G.suffocate = 0;
  G.openDelay = 0;
  G.pending = false;
  G.surge.t = 0;
  G.surge.cd = 0;
  G.caps.length = 0;
  G.capSig = '';
  G.armies.length = 0;
  G.control = -1;
  G.popT = 0;
  G.popPaid = 0;
  G.warMode = false;
  G.startTime = performance.now();
  G.board = newBoard();

  USED_NAMES.clear();
  const forced = new URLSearchParams(location.search).get('seed');
  WORLD_SEED = forced ? (parseInt(forced, 10) >>> 0)
                      : ((Date.now() ^ ((Math.random() * 0x7fffffff) | 0)) >>> 0);
  G.baseSeed = WORLD_SEED;
  buildWorld();
  const start = pickStartZone();
  G.home = { gx: start.gx, gy: start.gy };
  const z0 = openZone(start.gx, start.gy, true);
  const home = z0.districts.find(d => d.owner === 0) || z0.districts[0];
  const cx = Math.floor(home ? home.cap.x : z0.x0 + (ZW >> 1));
  const cy = Math.floor(home ? home.cap.y : z0.y0 + (ZH >> 1));
  const u = new Unit(0, cx + 0.5, cy + 0.5, CFG.playerSpeed, 2);
  G.player = { unit: u, brush: 2 };
  paintBlob(cx, cy, 2, 0);
  G.suffocate = 0;

  G.zones.length = 1;
  G.zones[0] = z0;
  cam.cell = fitCell();
  cam.x = u.x; cam.y = u.y;
  cam.tx = u.x; cam.ty = u.y;
  cam.camPan = 0;
  terrDirty = true;
}

function fitCell() {
  const z = G.zones[0];
  if (!z) return 30;
  return clamp(Math.min(CW / (ZW + 1), (CH * 0.9) / (ZH + 1)), 7, 56);
}

/* ═══════════════════════════ 相機 ═══════════════════════════ */
function camPanTo(x, y, dur) {
  cam.tx = x; cam.ty = y;
  cam.camPan = dur;
}

function clampCam() {
  const b = G.board;
  if (!b) return;
  const bw = b.boxX1 - b.boxX0 + 1, bh = b.boxY1 - b.boxY0 + 1;
  const halfW = (CW / 2) / cam.cell, halfH = (CH * 0.86 / 2) / cam.cell;
  const minX = b.boxX0 - 1 + halfW, maxX = b.boxX1 + 2 - halfW;
  const minY = b.boxY0 - 1 + halfH, maxY = b.boxY1 + 2 - halfH;
  cam.x = minX > maxX ? (b.boxX0 + b.boxX1 + 1) / 2 : clamp(cam.x, minX, maxX);
  cam.y = minY > maxY ? (b.boxY0 + b.boxY1 + 1) / 2 : clamp(cam.y, minY, maxY);
}

function zoomBy(f) {
  const before = cam.cell;
  cam.cell = clamp(cam.cell * f, 7, 58);
  if (cam.cell !== before) {
    zoomFlash = 0.25;
    updateHUD();
  }
  clampCam();
}
let zoomFlash = 0;

/* ═══════════════════════════ 更新 ═══════════════════════════ */
function update(dt) {
  const b = G.board;
  if (!b) return;
  if (G.state !== 'playing') { updateParts(dt); return; }
  G.t += dt;
  b.time += dt;
  if (G.grace > 0) G.grace = Math.max(0, G.grace - dt);

  if (G.surge.t > 0) {
    G.surge.t -= dt;
    if (G.surge.t <= 0) { G.surge.t = 0; G.surge.cd = CFG.surgeCd; }
  } else if (G.surge.cd > 0) {
    G.surge.cd = Math.max(0, G.surge.cd - dt);
  }

  // 玩家（或正在操控的兵團）
  const u = G.player.unit;
  const cu = controlledUnit() || u;
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  if (dx || dy) moveUnit(b, cu, dx, dy, dt, G.surge.t > 0 ? CFG.surgeSpeed : 1);
  applyBrush(b, cu, dt);
  if (cu !== u && !cu.out && Math.hypot(cu.x - cu.home.x, cu.y - cu.home.y) > 4) {
    cu.out = true;
    toast('兵團出擊中　·　' + cu.men + ' 人');
  }

  // 吃完當下的判定放在玩家塗抹之後：這一瞬間全歸玩家就算清盤
  if (!G.pending && b.cnt[1] >= b.landCount && b.landCount > 0) {
    G.pending = true;
    G.openDelay = CFG.zoneOpenDelay;
    toast('第 ' + G.zones.length + ' 塊已完全征服');
    for (let k = 0; k < 26; k++) {
      const z = G.zones[G.zones.length - 1];
      spawnPart(z.x0 + Math.random() * ZW, z.y0 + Math.random() * ZH, '#9dfff0', 1.4, 0.9);
    }
    blip(300, 0.16, 0.05, 'sine');
    setTimeout(function () { blip(450, 0.2, 0.045, 'sine'); }, 120);
  }

  // AI
  for (const r of G.rivals) {
    if (r.dead) continue;
    r.brain.update(dt, b);
    applyBrush(b, r.unit, dt);
    if (b.cnt[r.owner + 1] <= CFG.collapseAt) {
      r.unit.stunned = true;
      if (Math.random() < dt * 4) {
        const mine = [];
        for (let i = 0; i < b.n; i++) if (b.owner[i] === r.owner) mine.push(i);
        if (mine.length) b.setOwner(mine[(Math.random() * mine.length) | 0], NEUTRAL);
      }
    } else {
      r.unit.stunned = false;
    }
  }

  // 窒息判定：腳下與四鄰都沒有自己的地 → 撐不住就死
  const dead = [];
  for (const r of G.rivals) {
    if (r.dead) continue;
    if (ownGround(b, r.unit)) { r.unit.breath = 0; }
    else {
      r.unit.breath += dt;
      if (r.unit.breath > CFG.suffocateTime) dead.push(r);
    }
  }
  for (const r of dead) killRival(r);

  if (ownGround(b, u)) G.suffocate = 0;
  else {
    G.suffocate += dt;
    if (G.suffocate > CFG.suffocateTime) { onDefeat(); return; }
  }

  if (G.pending) {
    G.openDelay -= dt;
    if (G.openDelay <= 0) {
      G.pending = false;
      if (!openNextZone()) {
        G.state = 'victory';
        renderVictory();
      }
    }
  }

  updateSiege(dt);
  updatePop(dt);
  for (const z of G.zones) if (z.reveal > 0) z.reveal -= dt / 1.5;
  updateParts(dt);
  updateHUD();
}

function updateParts(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i];
    p.life -= dt;
    if (p.life <= 0) { G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.94; p.vy *= 0.94;
  }
}

/* ═══════════════════════════ 主城 ═══════════════════════════ */
/* 誰在圍城：回傳 owner（0 = 玩家），-1 表示雙方都在（僵持），-2 表示沒人 */
function siegerOf(cap) {
  let sieger = -2, bestD = 1e9;
  const pu = G.player && G.player.unit;
  if (pu && pu.alive) {
    const d = Math.hypot(pu.x - cap.x, pu.y - cap.y);
    if (d <= CFG.siegeRadius) { sieger = 0; bestD = d; }
  }
  for (const a of G.armies) {
    if (!a.alive) continue;
    const d = Math.hypot(a.x - cap.x, a.y - cap.y);
    if (d <= CFG.siegeRadius) { sieger = 0; break; }
  }
  const near = [];
  for (const r of G.rivals) {
    if (r.dead || r.unit.stunned) continue;
    if (r.owner === cap.owner) continue;      // 守軍站在自己的城上不算圍城
    const d = Math.hypot(r.unit.x - cap.x, r.unit.y - cap.y);
    if (d <= CFG.siegeRadius) near.push([d, r.owner]);
  }
  near.sort((a, b) => a[0] - b[0]);
  if (sieger === 0) {
    return near.length ? -1 : 0;      // 玩家和 AI 同時貼著城 → 僵持
  }
  if (near.length) return near[0][1];
  return -2;
}

/* 地區裡除了主城那一格以外的地，是不是全部同一方 */
function districtSoleOwner(d) {
  let who = -2;
  for (const i of d.cells) {
    if (i === d.cap.i) continue;
    const o = G.board.owner[i];
    if (o === NEUTRAL) return -1;
    if (who === -2) who = o;
    else if (who !== o) return -1;
  }
  return who;
}

function captureDistrict(cap, owner) {
  const b = G.board;
  const d = cap.district;
  const prev = cap.owner;
  if (prev === owner) { cap.prog = 0; return; }
  for (const i of d.cells) {
    b.setOwner(i, owner);
    b.hp[i] = HP_MAX;
    b.lock[i] = b.time + 0.6;
  }
  cap.owner = owner;
  d.owner = owner;
  cap.prog = 0;
  cap.surr = 0;
  cap.flash = 1;
  cap.pulse = 0.4;
  for (let k = 0; k < 18; k++) spawnPart(cap.x, cap.y, COLORS[owner < 0 ? 0 : owner].css, 0.9, 0.7);
  if (owner === 0) {
    toast('攻下主城　·　整片地區歸你');
    blip(520, 0.18, 0.05, 'sine');
  } else if (prev === 0) {
    toast('主城失守　·　這片地區被奪走');
    blip(140, 0.35, 0.06, 'sawtooth');
  } else if (owner > 0) {
    toast((rivalName(owner)) + ' 攻下了一座主城');
  }
  if (prev > 0 && b.cnt[prev + 1] === 0) {
    const r = G.rivals.find(x => x.owner === prev && !x.dead);
    if (r) killRival(r);
  }
  rivalSig = ''; capSig = '';
}

function updateSiege(dt) {
  const b = G.board;
  for (const cap of G.caps) {
    if (cap.flash > 0) cap.flash = Math.max(0, cap.flash - dt * 3);
    if (cap.pulse > 0) cap.pulse = Math.max(0, cap.pulse - dt);
    const who = siegerOf(cap);
    let sieging = false;
    if (who >= 0 && who !== cap.owner) {
      const need = who === 0 ? CFG.siegeTime : CFG.siegeAiTime;
      const bm = BIOMES[cap.biome || 0].siege;
      cap.prog = Math.min(1, cap.prog + (dt / need) * bm);
      cap.pulse = 0.5;
      sieging = true;
      if (cap.prog >= 1) { captureDistrict(cap, who); continue; }
    } else if (who === -1) {
      sieging = true;    // 僵持：進度不動也不衰減
    }
    if (!sieging) cap.prog = Math.max(0, cap.prog - dt * CFG.siegeDecay);

    /* 自動歸降：地區其他格全被同一方吃光 */
    cap.checkT -= dt;
    if (cap.checkT <= 0) {
      cap.checkT = 0.25;
      const sole = districtSoleOwner(cap.district);
      if (sole >= 0 && sole !== cap.owner) cap.surr += 0.25;
      else cap.surr = Math.max(0, cap.surr - 0.5);
      if (cap.surr >= CFG.surrenderTime) { captureDistrict(cap, sole); }
    }
  }
}

function rivalName(owner) {
  for (const r of G.rivals) if (r.owner === owner && r.name) return r.name;
  return COLORS[owner] ? COLORS[owner].name : '某個勢力';
}

function killRival(r) {
  if (r.dead) return;
  r.dead = true;
  r.unit.alive = false;
  const b = G.board;
  for (let i = 0; i < b.n; i++) if (b.owner[i] === r.owner) b.setOwner(i, NEUTRAL);
  G.kills++;
  spawnBurst(r.unit.x, r.unit.y, COLORS[r.owner].css);
  toast((r.name || COLORS[r.owner].name) + ' 被吞沒了');
  if (!muted) blip(180, 0.25, 0.05, 'sawtooth');
  const k = G.rivals.indexOf(r);
  if (k >= 0) G.rivals.splice(k, 1);
  rivalSig = '';
}

function onDefeat() {
  G.state = 'defeat';
  renderDefeat();
}

/* ═══════════════════════════ 縮放／視窗 ═══════════════════════════ */
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = window.innerWidth;
  CH = window.innerHeight;
  canvas.width = Math.floor(CW * DPR);
  canvas.height = Math.floor(CH * DPR);
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  clampCam();
}
window.addEventListener('resize', resize);

/* ═══════════════════════════ 繪圖 ═══════════════════════════ */
function rebuildTerritory() {
  const b = G.board;
  if (!b || !terrU32) return;
  const w = b.w, owner = b.owner;
  for (let i = 0; i < b.n; i++) {
    const o = owner[i];
    if (o < 0) { terrU32[i] = 0; continue; }
    const px = i % w, py = (i / w) | 0;
    const c = COLORS[o], P = BIOMES[biomeAt(px, py)];
    const mx = 0.26;
    const a2 = 146 + ((hash2i(px, py, 3) * 47) | 0);
    terrU32[i] = packRGBA(
      (c.r * (1 - mx) + P.mid[0] * mx) | 0,
      (c.g * (1 - mx) + P.mid[1] * mx) | 0,
      (c.b * (1 - mx) + P.mid[2] * mx) | 0, a2);
  }
  terrCtx.putImageData(terrImg, 0, 0);
  terrDirty = false;
}

function rebuildOutlines() {
  const b = G.board;
  if (!b || b.boxX1 < b.boxX0) return;
  const w = b.w, owner = b.owner;
  const paths = COLORS.map(() => new Path2D());
  for (let y = b.boxY0; y <= b.boxY1; y++) {
    for (let x = b.boxX0; x <= b.boxX1; x++) {
      const i = y * w + x;
      const o = owner[i];
      if (o < 0) continue;
      const p = paths[o];
      if (y === 0 || owner[i - w] !== o) { p.moveTo(x, y); p.lineTo(x + 1, y); }
      if (y === b.h - 1 || owner[i + w] !== o) { p.moveTo(x, y + 1); p.lineTo(x + 1, y + 1); }
      if (x === 0 || owner[i - 1] !== o) { p.moveTo(x, y); p.lineTo(x, y + 1); }
      if (x === w - 1 || owner[i + 1] !== o) { p.moveTo(x + 1, y); p.lineTo(x + 1, y + 1); }
    }
  }
  terrPaths = paths;
}

function render() {
  const b = G.board;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 海
  const g = ctx.createRadialGradient(CW * 0.5, CH * 0.42, 60, CW * 0.5, CH * 0.5, Math.max(CW, CH) * 0.78);
  g.addColorStop(0, '#123043');
  g.addColorStop(0.55, '#0b1c29');
  g.addColorStop(1, '#050c13');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
  if (!b) return;

  const cs = cam.cell;
  const ox = CW / 2 - cam.x * cs;
  const oy = CH * 0.5 - cam.y * cs;

  const x0 = Math.max(0, Math.floor(-ox / cs) - 1);
  const y0 = Math.max(0, Math.floor(-oy / cs) - 1);
  const x1 = Math.min(b.w, Math.ceil((CW - ox) / cs) + 1);
  const y1 = Math.min(b.h, Math.ceil((CH - oy) / cs) + 1);
  const sw = x1 - x0, sh = y1 - y0;

  ctx.imageSmoothingEnabled = false;
  if (sw > 0 && sh > 0) {
    ctx.drawImage(terrainCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);
    if (shadowCv) ctx.drawImage(shadowCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);

    if (terrDirty) rebuildTerritory();
    ctx.globalAlpha = 0.46;
    ctx.drawImage(terrCv, x0, y0, sw, sh, ox + x0 * cs, oy + y0 * cs, sw * cs, sh * cs);
    ctx.globalAlpha = 1;
  }

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(cs, cs);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  if (coastPath) {
    ctx.strokeStyle = 'rgba(186,226,232,.30)';
    ctx.lineWidth = 1.6 / cs;
    ctx.stroke(coastPath);
  }
  if (terrPaths) {
    for (let o = 0; o < COLORS.length; o++) {
      const p = terrPaths[o];
      if (!p) continue;
      ctx.lineWidth = 1.9 / cs;
      ctx.strokeStyle = OUTLINE[o];
      ctx.stroke(p);
      if (o === 0) {
        ctx.lineWidth = 4.0 / cs;
        ctx.strokeStyle = GLOW;
        ctx.stroke(p);
      }
    }
  }

  // 新區塊的浮現光環
  for (const z of G.zones) {
    if (z.reveal <= 0) continue;
    const a = clamp(z.reveal, 0, 1);
    const t = 1 - a;
    const cx = z.x0 + z.w / 2, cy = z.y0 + z.h / 2;
    const rr = Math.max(z.w, z.h) * (0.12 + t * 0.62);
    const grd = ctx.createRadialGradient(cx, cy, rr * 0.55, cx, cy, rr);
    grd.addColorStop(0, 'rgba(140,255,238,0)');
    grd.addColorStop(0.75, 'rgba(150,255,242,' + (a * 0.30).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(120,230,255,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.fill();
  }

  // 粒子
  for (const p of G.parts) {
    const a = p.life / p.max;
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.7), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 單位
  for (const r of G.rivals) {
    if (r.dead) continue;
    drawUnit(r.unit, COLORS[r.owner], cs);
  }
  for (const a of G.armies) if (a.alive) drawArmy(a, cs);
  if (G.player) drawUnit(G.player.unit, COLORS[0], cs, G.control < 0);
  if (G.control >= 0 && G.armies[G.control] && G.armies[G.control].alive) {
    const a = G.armies[G.control];
    ctx.strokeStyle = 'rgba(255,224,138,.85)';
    ctx.lineWidth = 1.6 / cs;
    ctx.beginPath();
    ctx.arc(a.x, a.y, 0.78, 0, TAU);
    ctx.stroke();
  }

  // 地區邊界（縮太小就不畫，免得糊成一團）
  if (cs >= 12) {
    ctx.strokeStyle = 'rgba(6,16,22,.32)';
    ctx.lineWidth = 1 / cs;
    ctx.setLineDash([2.5 / cs, 3.2 / cs]);
    for (const z of G.zones) if (z.borders) ctx.stroke(z.borders);
    ctx.setLineDash([]);
  }
  // 主城
  for (const cap of G.caps) drawCapital(cap, cs);

  ctx.restore();
}

function drawArmy(a, cs) {
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 3 + (a.phase || 0)) * 0.04;
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(a.x, a.y + 0.42, 0.44, 0.2, 0, 0, TAU);
  ctx.fill();
  // 三個小人
  ctx.fillStyle = COLORS[0].css;
  for (let i = 0; i < 3; i++) {
    const dx = (i - 1) * 0.23;
    const dy = (i === 1 ? -0.1 : 0) + bob;
    ctx.beginPath();
    ctx.arc(a.x + dx, a.y - 0.10 + dy, 0.135, 0, TAU);
    ctx.fill();
  }
  // 旗竿與旗子
  ctx.strokeStyle = 'rgba(10,26,30,.72)';
  ctx.lineWidth = 1.3 / cs;
  ctx.beginPath();
  ctx.moveTo(a.x + 0.32, a.y + 0.3);
  ctx.lineTo(a.x + 0.32, a.y - 0.66);
  ctx.stroke();
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.moveTo(a.x + 0.32, a.y - 0.66);
  ctx.lineTo(a.x + 0.76, a.y - 0.50);
  ctx.lineTo(a.x + 0.32, a.y - 0.34);
  ctx.closePath();
  ctx.fill();
  // 人數
  if (cs >= 18) {
    ctx.fillStyle = 'rgba(255,240,200,.92)';
    ctx.font = '600 0.34px ui-sans-serif,system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(a.men), a.x, a.y + 0.86);
    ctx.textAlign = 'left';
  }
}

function drawUnit(u, col, cs, isPlayer) {
  const r = 0.42;
  const t = performance.now() / 1000;
  // 陰影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(u.x, u.y + 0.36, r * 0.9, r * 0.42, 0, 0, TAU);
  ctx.fill();

  // 危險（腳下沒地）
  if (u.breath > 0) {
    const k = clamp(u.breath / CFG.suffocateTime, 0, 1);
    ctx.strokeStyle = 'rgba(255,90,90,' + (0.35 + k * 0.6).toFixed(3) + ')';
    ctx.lineWidth = 2.4 / cs + 0.06;
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 0.16 + k * 0.18, 0, TAU);
    ctx.stroke();
  }

  // 身體
  const bob = Math.sin(t * 2.4 + u.phase) * 0.03;
  ctx.fillStyle = col.css;
  ctx.beginPath();
  ctx.arc(u.x, u.y + bob, r, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 1.4 / cs;
  ctx.stroke();

  // 眼睛
  const ex = u.fx * 0.13, ey = u.fy * 0.11;
  ctx.fillStyle = 'rgba(6,16,20,.82)';
  ctx.beginPath();
  ctx.arc(u.x - 0.14 + ex, u.y - 0.05 + ey, 0.075, 0, TAU);
  ctx.arc(u.x + 0.14 + ex, u.y - 0.05 + ey, 0.075, 0, TAU);
  ctx.fill();

  if (isPlayer) {
    const ready = G.surge.cd <= 0 && G.surge.t <= 0;
    const p = G.surge.t > 0 ? 1 : (ready ? 1 : 1 - G.surge.cd / CFG.surgeCd);
    ctx.strokeStyle = 'rgba(46,230,200,.16)';
    ctx.lineWidth = 2.2 / cs + 0.05;
    ctx.beginPath(); ctx.arc(u.x, u.y, r + 0.3, 0, TAU); ctx.stroke();
    ctx.strokeStyle = G.surge.t > 0 ? '#dcfffa' : (ready ? 'rgba(150,255,238,.95)' : 'rgba(90,200,190,.7)');
    ctx.lineWidth = 2.6 / cs + 0.05;
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 0.3, -Math.PI / 2, -Math.PI / 2 + TAU * p);
    ctx.stroke();
    if (ready) {
      ctx.globalAlpha = 0.25 + Math.sin(t * 5) * 0.12;
      ctx.strokeStyle = '#9dfff0';
      ctx.lineWidth = 5 / cs;
      ctx.beginPath(); ctx.arc(u.x, u.y, r + 0.3, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

function drawCapital(cap, cs) {
  const halfPx = Math.max(9, Math.min(26, cs * 0.62));
  const hw = halfPx / cs;
  const o = cap.owner;
  const col = o >= 0 ? COLORS[o] : { css: '#8fa3ad', r: 143, g: 163, b: 173 };
  const x = cap.x, y = cap.y;
  const top = y - hw * 0.9, bot = y + hw * 0.9;

  // 圍城進度：先畫底環再畫進度，遠看也讀得出來
  const ringR = hw * 1.75;
  if (cap.prog > 0.002) {
    ctx.strokeStyle = 'rgba(8,18,24,.42)';
    ctx.lineWidth = 3.2 / cs;
    ctx.beginPath();
    ctx.arc(x, y, ringR, 0, TAU);
    ctx.stroke();
  }

  // 台座
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath();
  ctx.ellipse(x, bot + hw * 0.18, hw * 1.22, hw * 0.42, 0, 0, TAU);
  ctx.fill();

  // 城體（比領土色再深一點，免得跟自己的地混在一起）
  const cr = Math.round(col.r * 0.82), cg2 = Math.round(col.g * 0.82), cb2 = Math.round(col.b * 0.82);
  const bodyCss = 'rgb(' + cr + ',' + cg2 + ',' + cb2 + ')';
  ctx.fillStyle = bodyCss;
  ctx.beginPath();
  ctx.rect(x - hw, top, hw * 2, bot - top);
  const bw = hw * 0.46;
  for (let k = 0; k < 3; k++) ctx.rect(x - hw + k * (hw * 0.77), top - bw * 0.9, bw * 0.62, bw * 0.9);
  ctx.fill();

  // 屋頂陰影（上緣壓暗，立體感）
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.fillRect(x - hw, top, hw * 2, hw * 0.34);

  // 門
  ctx.fillStyle = 'rgba(6,16,20,.66)';
  ctx.beginPath();
  ctx.moveTo(x - hw * 0.26, bot);
  ctx.lineTo(x - hw * 0.26, bot - hw * 0.5);
  ctx.arc(x, bot - hw * 0.5, hw * 0.26, Math.PI, 0);
  ctx.lineTo(x + hw * 0.26, bot);
  ctx.closePath();
  ctx.fill();

  // 外框：深底 + 淡亮邊，任何底色上都看得出來
  ctx.strokeStyle = 'rgba(8,18,24,.55)';
  ctx.lineWidth = 1.4 / cs;
  ctx.strokeRect(x - hw, top, hw * 2, bot - top);

  // 旗子
  ctx.strokeStyle = 'rgba(8,18,24,.55)';
  ctx.lineWidth = 1.1 / cs;
  ctx.beginPath();
  ctx.moveTo(x, top - bw * 0.9);
  ctx.lineTo(x, top - bw * 0.9 - hw * 0.5);
  ctx.stroke();
  ctx.fillStyle = bodyCss;
  ctx.beginPath();
  ctx.moveTo(x, top - bw * 0.9 - hw * 0.5);
  ctx.lineTo(x + hw * 0.44, top - bw * 0.9 - hw * 0.34);
  ctx.lineTo(x, top - bw * 0.9 - hw * 0.18);
  ctx.closePath();
  ctx.fill();

  // 圍城進度弧
  if (cap.prog > 0.002) {
    ctx.strokeStyle = 'rgba(255,104,96,.95)';
    ctx.lineWidth = 3.2 / cs;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x, y, ringR, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(cap.prog, 0, 1));
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // 被圍城時的脈動
  if (cap.pulse > 0) {
    ctx.strokeStyle = 'rgba(255,150,150,' + (cap.pulse * 0.8).toFixed(3) + ')';
    ctx.lineWidth = 1.5 / cs;
    ctx.beginPath();
    ctx.arc(x, y, hw * (1.25 + (0.5 - cap.pulse) * 3.0), 0, TAU);
    ctx.stroke();
  }

  // 易主閃光
  if (cap.flash > 0) {
    ctx.globalAlpha = cap.flash * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, hw * 2.0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ═══════════════════════════ HUD ═══════════════════════════ */
const zoneNumEl = document.getElementById('zoneNum');
const zoneSizeEl = document.getElementById('zoneSize');
const ownBarEl = document.getElementById('ownBar');
const ownPctEl = document.getElementById('ownPct');
const leftCellsEl = document.getElementById('leftCells');
const zoneCountEl = document.getElementById('zoneCount');
const zoomPctEl = document.getElementById('zoomPct');
const capCountEl = document.getElementById('capCount');
const distCountEl = document.getElementById('distCount');
const rivalsEl = document.getElementById('rivals');
const aggLabelEl = document.getElementById('aggLabel');
const popCountEl = document.getElementById('popCount');
const armyCountEl = document.getElementById('armyCount');
const warChipEl = document.getElementById('warChip');
const surgeFillEl = document.getElementById('surgeFill');
const surgeChipEl = surgeFillEl ? surgeFillEl.closest('.surge-chip') : null;
const hudEl = document.getElementById('hud');

let rivalSig = '';
let capSig = '';
function updateHUD() {
  const b = G.board;
  if (!b) return;
  const won = b.cnt[1];
  const land = Math.max(1, b.landCount);
  const pct = won / land;
  ownBarEl.style.width = (pct * 100).toFixed(1) + '%';
  ownPctEl.textContent = Math.round(pct * 100) + '%';
  leftCellsEl.textContent = String(Math.max(0, b.landCount - won));
  zoneNumEl.textContent = String(G.zones.length);
  zoneSizeEl.textContent = ZW + ' × ' + ZH;
  zoneCountEl.textContent = String(G.zones.length);
  zoomPctEl.textContent = Math.round(cam.cell / Math.max(1, fitCell()) * 100) + '%';
  let mine = 0, total = 0, dists = 0;
  for (const c of G.caps) { total++; if (c.owner === 0) mine++; }
  for (const z of G.zones) if (z.districts) dists += z.districts.length;
  capCountEl.textContent = mine + ' / ' + total;
  distCountEl.textContent = String(dists);
  aggLabelEl.textContent = AGGRO_LABEL[G.aggression];
  const pop = playerPop();
  if (popCountEl) popCountEl.textContent = pop >= 10000 ? (pop / 1000).toFixed(1) + 'k' : String(Math.round(pop));
  if (armyCountEl) armyCountEl.textContent = String(G.armies.length);
  if (warChipEl) warChipEl.style.display = G.warMode ? '' : 'none';

  const alive = G.rivals.filter(r => !r.dead);
  const sig = alive.map(r => r.owner + ':' + b.cnt[r.owner + 1]).join(',');
  if (sig !== rivalSig) {
    rivalSig = sig;
    let html = '';
    for (const r of alive) {
      const n = b.cnt[r.owner + 1];
      const p = Math.round(n / land * 100);
      html += '<div class="rival' + (r.dead ? ' dead' : '') + '">' +
        '<i class="dot" style="background:' + COLORS[r.owner].css + ';color:' + COLORS[r.owner].css + '"></i>' +
        '<span class="rname">' + (r.name || COLORS[r.owner].name) + '</span>' +
        '<span class="rbar"><i style="width:' + p + '%;background:' + COLORS[r.owner].css + '"></i></span>' +
        '<span class="rpct">' + p + '%</span></div>';
    }
    rivalsEl.innerHTML = html;
  } else {
    const bars = rivalsEl.querySelectorAll('.rbar i');
    const pcts = rivalsEl.querySelectorAll('.rpct');
    alive.forEach((r, k) => {
      const p = Math.round(b.cnt[r.owner + 1] / land * 100);
      if (bars[k]) bars[k].style.width = p + '%';
      if (pcts[k]) pcts[k].textContent = p + '%';
    });
  }

  const cdLeft = G.surge.t > 0 ? 1 : 1 - G.surge.cd / CFG.surgeCd;
  surgeFillEl.style.width = (clamp(cdLeft, 0, 1) * 100).toFixed(0) + '%';
  if (surgeChipEl) {
    if (G.surge.t > 0) surgeChipEl.classList.add('hot');
    else surgeChipEl.classList.remove('hot');
  }
}

let toastTimer = 0;
const toastEl = document.getElementById('toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2200);
}

/* ═══════════════════════════ 覆蓋層 ═══════════════════════════ */
const overlayEl = document.getElementById('overlay');
function setOverlay(html) {
  overlayEl.innerHTML = html;
  overlayEl.classList.add('on');
}
function hideOverlay() {
  overlayEl.classList.remove('on');
  setTimeout(function () { if (!overlayEl.classList.contains('on')) overlayEl.innerHTML = ''; }, 340);
}

function aggSeg() {
  let h = '<div class="seg">';
  for (const k of ['weak', 'mid', 'strong']) {
    h += '<button data-agg="' + k + '" class="' + (G.aggression === k ? 'on' : '') + '">' +
         AGGRO_LABEL[k] + '</button>';
  }
  return h + '</div>';
}

function renderMenu() {
  let best = 0, bestZone = 0;
  try {
    best = parseInt(localStorage.getItem('territory_best_zone') || '0', 10) || 0;
    bestZone = parseInt(localStorage.getItem('territory_best_cells') || '0', 10) || 0;
  } catch (e) {}
  setOverlay(
    '<div class="card">' +
      '<div class="eyebrow">ENDLESS TERRITORY</div>' +
      '<h1>無盡領土</h1>' +
      '<p class="lead">走過的土地就是你的。吃下整塊大陸，下一塊領土就會浮現，' +
      '一圈一圈往外擴，沒有終點。<br>' +
      '每局大陸重新生成，切成 4~6 個地區，各有一座主城。<br>' +
      '站上主城旁 5 秒就能拿下整片地區；吃光它其他格子，主城自己也會投降。<br>' +
      '地質影響移動與圍城：雪原慢、雨林好塗、沙漠補給差。<br>' +
      '人口每 30 秒成長，每 1 萬人組一支兵團，<b>Q</b> 切換操控。<br>' +
      '<b>腳下與四周都沒有自己的土地時，你會窒息而死。</b></p>' +
      '<div class="agg-title">AI 對你領地的攻擊性</div>' +
      aggSeg() +
      '<div class="agg-note">不論設定為何，AI 對彼此的領地永遠維持強攻擊。</div>' +
      '<button class="primary" data-act="start">開始遊戲</button>' +
      '<div class="foot">' +
        (best > 0 ? '最佳紀錄：第 ' + best + ' 塊　·　' : '') +
        'WASD 移動 · SPACE 衝鋒 · 滾輪縮放 · ESC 暫停</div>' +
    '</div>'
  );
}

function renderPause() {
  setOverlay(
    '<div class="card">' +
      '<div class="eyebrow">PAUSED</div>' +
      '<h1>暫停</h1>' +
      '<p class="lead">已經吃到第 <b>' + G.zones.length + '</b> 塊，' +
      '佔下 <b>' + G.board.cnt[1] + '</b> 格。</p>' +
      '<div class="agg-title">AI 對你領地的攻擊性</div>' +
      aggSeg() +
      '<div class="agg-note">切換後立刻生效。</div>' +
      '<button class="primary" data-act="resume">繼續</button>' +
      '<button class="ghost" data-act="restart">重新開始</button>' +
      '<div class="foot">世界種子 #' + WORLD_SEED + ' · ESC 繼續 · M 靜音</div>' +
    '</div>'
  );
}

function renderDefeat() {
  const secs = Math.round((performance.now() - G.startTime) / 1000);
  saveBest();
  setOverlay(
    '<div class="card">' +
      '<div class="eyebrow">SWALLOWED</div>' +
      '<h1>你被吞沒了</h1>' +
      '<p class="lead">腳下再沒有一寸屬於你的土地。</p>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="k">征服區塊</div><div class="v">' + G.zones.length + '</div></div>' +
        '<div class="stat"><div class="k">佔領格數</div><div class="v">' + G.board.cnt[1] + '</div></div>' +
        '<div class="stat"><div class="k">存活</div><div class="v">' + secs + '<small>秒</small></div></div>' +
      '</div>' +
      '<button class="primary" data-act="restart">再來一次</button>' +
      '<div class="foot">WASD 移動 · SPACE 衝鋒 · 滾輪縮放</div>' +
    '</div>'
  );
}

function renderVictory() {
  const secs = Math.round((performance.now() - G.startTime) / 1000);
  saveBest();
  setOverlay(
    '<div class="card">' +
      '<div class="eyebrow">EVERYTHING IS YOURS</div>' +
      '<h1>整片海都是你的</h1>' +
      '<p class="lead">你把這個世界能長出來的每一塊土地都吃完了。</p>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="k">征服區塊</div><div class="v">' + G.zones.length + '</div></div>' +
        '<div class="stat"><div class="k">佔領格數</div><div class="v">' + G.board.cnt[1] + '</div></div>' +
        '<div class="stat"><div class="k">存活</div><div class="v">' + secs + '<small>秒</small></div></div>' +
      '</div>' +
      '<button class="primary" data-act="restart">再來一次</button>' +
    '</div>'
  );
}

function saveBest() {
  try {
    const z = parseInt(localStorage.getItem('territory_best_zone') || '0', 10) || 0;
    if (G.zones.length > z) localStorage.setItem('territory_best_zone', String(G.zones.length));
    const c = parseInt(localStorage.getItem('territory_best_cells') || '0', 10) || 0;
    if (G.board && G.board.cnt[1] > c) localStorage.setItem('territory_best_cells', String(G.board.cnt[1]));
  } catch (e) {}
}

/* ═══════════════════════════ 遊戲流程 ═══════════════════════════ */
function startGame() {
  hideOverlay();
  hudEl.classList.add('on');
  newGame();
  G.state = 'playing';
  toast('吃掉整塊大陸　·　下一塊就會出現');
}

function pauseGame() {
  if (G.state !== 'playing') return;
  G.state = 'paused';
  renderPause();
}

function resumeGame() {
  if (G.state !== 'paused') return;
  hideOverlay();
  G.state = 'playing';
}

function restart() {
  hideOverlay();
  startGame();
}

function setAggression(level) {
  G.aggression = level;
  for (const r of G.rivals) if (r.brain) r.brain.aggro = AGGRO[level];
  updateHUD();
}

function activateSurge() {
  if (G.state !== 'playing') return;
  if (G.surge.t > 0 || G.surge.cd > 0) return;
  G.surge.t = CFG.surgeDur;
  const u = G.player.unit;
  for (let k = 0; k < 16; k++) spawnPart(u.x, u.y, '#9dfff0', 0.34, 0.85);
  if (actx && !muted) {
    blip(520, 0.11, 0.05, 'square');
    setTimeout(function () { blip(780, 0.13, 0.045, 'square'); }, 70);
  }
}

/* ═══════════════════════════ 輸入 ═══════════════════════════ */
const keys = Object.create(null);

window.addEventListener('keydown', function (e) {
  const code = e.code;
  if (code === 'Escape') {
    if (G.state === 'playing') pauseGame();
    else if (G.state === 'paused') resumeGame();
    return;
  }
  if (code === 'KeyM') {
    muted = !muted;
    toast(muted ? '已靜音' : '已開啟音效');
    return;
  }
  if (code === 'Space' && !e.repeat && G.state === 'playing') { activateSurge(); e.preventDefault(); return; }
  if ((code === 'Equal' || code === 'NumpadAdd') && !e.repeat) { zoomBy(1.16); e.preventDefault(); return; }
  if ((code === 'Minus' || code === 'NumpadSubtract') && !e.repeat) { zoomBy(1 / 1.16); e.preventDefault(); return; }
  if ((code === 'KeyF') && !e.repeat) { cam.cell = fitCell(); cam.x = G.player ? G.player.unit.x : cam.x; cam.y = G.player ? G.player.unit.y : cam.y; updateHUD(); return; }
  if (code === 'KeyQ' && !e.repeat) {
    if (G.state === 'playing') cycleControl();
    return;
  }
  if ((code === 'Enter' || code === 'Space') && !e.repeat) {
    if (G.state === 'menu') startGame();
    else if (G.state === 'defeat' || G.state === 'victory') restart();
    return;
  }
  if (code.startsWith('Arrow')) e.preventDefault();
  keys[code] = true;
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; });

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  zoomBy(Math.exp(-e.deltaY * 0.0014));
}, { passive: false });

overlayEl.addEventListener('click', function (e) {
  const t = e.target;
  if (!t || !t.dataset) return;
  if (t.dataset.agg) {
    setAggression(t.dataset.agg);
    const seg = t.parentElement;
    if (seg) for (const b of seg.children) b.classList.toggle('on', b === t);
    return;
  }
  const act = t.dataset.act;
  if (act === 'start') startGame();
  else if (act === 'resume') resumeGame();
  else if (act === 'restart') restart();
});

/* ═══════════════════════════ 主迴圈 ═══════════════════════════ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (G.state === 'playing' || G.state === 'paused') {
    // 相機
    if (G.state === 'playing') {
      if (cam.camPan > 0) {
        cam.camPan -= dt;
        cam.x = lerp(cam.x, cam.tx, 1 - Math.pow(0.001, dt));
        cam.y = lerp(cam.y, cam.ty, 1 - Math.pow(0.001, dt));
      } else if (G.player) {
        const u = controlledUnit() || G.player.unit;
        const k = 1 - Math.pow(0.0001, dt * (CFG.camFollow / 6.5));
        cam.x = lerp(cam.x, u.x, k);
        cam.y = lerp(cam.y, u.y, k);
      }
    }
    clampCam();
    if (G.state === 'playing') update(dt);
    else updateParts(dt);
  }

  if (G.board) {
    if (G.board.dirty) {
      G.board.dirty = false;
      terrDirty = true;
      if (now - lastOutline > 110) { rebuildOutlines(); lastOutline = now; }
    }
    if (now - lastOutline > 140) { rebuildOutlines(); lastOutline = now; }
  }

  render();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════ 啟動 ═══════════════════════════ */
resize();
G.board = newBoard();
newGame();
G.state = 'menu';
renderMenu();
requestAnimationFrame(loop);

setInterval(function () {
  if (G.state !== 'menu' || !G.board) return;
  for (const r of G.rivals) {
    if (r.dead) continue;
    r.brain.update(1 / 30, G.board);
    G.board.time += 1 / 30;
    applyBrush(G.board, r.unit, 1 / 30 * 0.5);
  }
  terrDirty = true;
  rebuildOutlines();
  updateHUD();
}, 33);

// 讓開場畫面就有點動靜
setTimeout(function () {
  if (G.state === 'menu' && G.player) {
    cam.x = G.player.unit.x; cam.y = G.player.unit.y;
    cam.cell = fitCell();
  }
}, 80);

/* 測試鉤子 */
window.__T = {
  get G() { return G; },
  get cam() { return cam; },
  get terrainCv() { return terrainCv; }, districtSoleOwner, siegerOf, update, render, startGame, restart, openNextZone, openZone, applyBrush, keys, CFG, zoomBy, fitCell,
  activateSurge, setAggression, AGGRO, ZW, ZH, BIOMES, biomeAt, playerPop, spawnArmy, cycleControl,
  get armies() { return G.armies; },
  get board() { return G.board; },
  get zones() { return G.zones; }
};

if (location.search.indexOf('auto') >= 0) setTimeout(startGame, 60);
})();
</script>
