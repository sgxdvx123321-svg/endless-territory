<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無盡領土 · 版本畫廊 / Endless Territory</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#050a10; --panel:rgba(9,18,26,.72); --line:rgba(110,170,190,.14);
    --mint:#2ee6c8; --mint-dim:#1fb89f; --text:#dceaf2; --muted:#7f97a7; --dim:#4d6472;
  }
  body{
    background:radial-gradient(1200px 700px at 20% -10%, #0d2230 0%, #050a10 60%) fixed, var(--bg);
    color:var(--text); min-height:100vh; padding:56px 20px 80px;
    font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{text-align:center;margin-bottom:44px}
  .kicker{font-size:11px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
  h1{font-size:44px;font-weight:800;letter-spacing:.06em;margin:12px 0 8px;
     background:linear-gradient(180deg,#f2fbff,#8fc7cf);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;line-height:1.9}
  .cta{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:13px 26px;border-radius:99px;
       background:linear-gradient(180deg,var(--mint),var(--mint-dim));color:#04231f;font-weight:750;font-size:14.5px;
       text-decoration:none;box-shadow:0 10px 30px rgba(46,230,200,.22);transition:transform .15s,box-shadow .15s}
  .cta:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(46,230,200,.32)}
  .note{color:var(--dim);font-size:12px;margin-top:14px;line-height:1.8}
  .note code{color:#9fd8cf;background:rgba(46,230,200,.07);padding:1px 6px;border-radius:5px;font-size:11.5px}

  .era{margin:38px 0 0}
  .era-head{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .era-idx{font-size:11px;letter-spacing:.2em;color:var(--mint-dim)}
  .era-title{font-size:16px;font-weight:700;letter-spacing:.03em}
  .era-desc{font-size:12px;color:var(--dim);margin-left:auto}

  a.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;
        text-decoration:none;color:inherit;border:1px solid transparent;transition:background .15s,border-color .15s}
  a.row:hover{background:var(--panel);border-color:var(--line)}
  .v{font-variant-numeric:tabular-nums;font-weight:750;font-size:14px;color:var(--mint);
     min-width:52px;letter-spacing:.02em}
  .row .txt{font-size:13.5px;color:#c3d8e2;line-height:1.6}
  .row .date{margin-left:auto;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .latest{background:linear-gradient(180deg,rgba(46,230,200,.09),rgba(46,230,200,.02));
          border-color:rgba(46,230,200,.28)!important}
  .badge{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(46,230,200,.16);
         color:var(--mint);margin-left:6px;letter-spacing:.08em}
  footer{max-width:1080px;margin:56px auto 0;padding-top:22px;border-top:1px solid var(--line);
         color:var(--dim);font-size:12px;line-height:2;text-align:center}
  footer a{color:var(--muted)}
  @media (max-width:640px){
    h1{font-size:32px} .row .date{display:none} .era-desc{display:none} body{padding:36px 14px 60px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Endless Territory</div>
    <h1>無盡領土</h1>
    <p class="sub">因為玩 WorldBox 和 Fantasy Map Simulator 玩得不爽，於是和 AI 一起造出來的單檔 HTML 即時戰略遊戲<br>47 個版本全部開放，隨便下載、隨便改</p>
    <a class="cta" href="versions/territory-v48.html">▶ 玩最新版 v48</a>
    <p class="note">所有版本都是獨立單檔 HTML，雙擊即可開；<code>?seed=12345</code> 重現同一張世界，<code>?auto</code> 跳過選單直接開局。</p>
  </header>
  <div id="list"></div>
</div>
<footer>
  <a href="README.md">README</a> · <a href="README.en.md">README (EN)</a> · <a href="docs/VERSIONS.md">版本演進史</a> · <a href="docs/CHANGELOG.md">逐版 CHANGELOG</a> · MIT License<br>
  歡迎開分支改成你喜歡的樣子——代碼整理、HTML 以外版本、新玩法都收。
</footer>
<script>
const ERAS = [
  { idx:'一', title:'基礎期 v2 – v5', desc:'地圖怎麼長出來' },
  { idx:'二', title:'玩法期 v6 – v9', desc:'世界的質感與難度' },
  { idx:'三', title:'指揮期 v10 – v13', desc:'看得到、叫得動' },
  { idx:'四', title:'帝國期 v14 – v17', desc:'戰役規模化' },
  { idx:'五', title:'AI 期 v18 – v20', desc:'兵團怎麼想' },
  { idx:'六', title:'大陸期 v21 – v25', desc:'一個世界，很多國家' },
  { idx:'七', title:'兵制期 v26 – v33', desc:'單位、隊形、規則收斂' },
  { idx:'八', title:'收斂期 v34 – v38', desc:'操作、規則、戰史收尾' },
  { idx:'九', title:'磨合期 v39 – v44', desc:'兵團、守備軍、卡死收尾' },
  { idx:'十', title:'打磨期 v45 – v48', desc:'AI 兵團、手機端、統合兵團' },
];
const V = [
  ['v2','2026-11-12','基準版：區塊制世界、吃光才開新塊、可縮放視角'],
  ['v3','2026-11-12','地區 + 主城：站城內 5 秒攻下，地區吃光自動歸降'],
  ['v4','2026-11-12','一整塊大陸、同心圈開圖'],
  ['v5','2026-11-12','大陸遮罩 + 洪水填充，修掉「孤島卡死」'],
  ['v6','2026-11-12','地質、人口成長、兵團、補給式戰役'],
  ['v7','2026-11-12','兵團即棋子，移除英雄本體；敵國也有兵團'],
  ['v8','2026-11-12','守城優勢全面上線（傷害三檔、減傷、全民皆兵）'],
  ['v9','2026-11-12','圍城抽兵收緊；敵軍優勢延後到第 11 塊 + ESC 開關'],
  ['v10','2026-11-12','總兵力顯示、兵團清單、<code>O</code> 集結令'],
  ['v11','2026-11-12','<code>M</code> 緊急征召：1% 人口 → 兵力'],
  ['v12','2026-11-12','征召比例可在 ESC 調（1–20%）'],
  ['v13','2026-11-12','集結可選「最近 N 支 / 全國」、<code>P</code> 歸位'],
  ['v14','2026-11-12','軟推擠、第二片大陸 + 大一統帝國、外交、3 存檔槽'],
  ['v15','2026-11-12','推擠改移動阻擋、BFS 尋路、據點經濟、城池命名、自動存檔'],
  ['v16','2026-11-12','兵團上限自動化（max(5, 城池數)）'],
  ['v17','2026-11-12','<code>N</code> 真正均攤、<code>M</code> 補守軍、敵國結盟只打玩家'],
  ['v18','2026-11-12','目標分配（每秒重算、每目標最多 3 支）、三層優先、局部先打'],
  ['v19','2026-11-12','戰史面板：殲滅／陣亡／兵團損失／城池淨得'],
  ['v20','2026-11-13','叛亂：切出連通地區獨立成新政權，可選邊'],
  ['v21','2026-11-13','移除第二大陸、63 區塊、開局模式、12 政權、16 色'],
  ['v22','2026-11-13','修好單國頁面、兵團就近原則'],
  ['v23','2026-11-13','完整大陸開局全和平、一鍵全和平 / 全宣戰'],
  ['v24','2026-11-13','野戰軍 vs 守備軍數值區分'],
  ['v25','2026-11-13','敵方成長改成按玩家兵力換算'],
  ['v26','2026-11-13','守軍進城變數字、攻城野戰軍生在城外'],
  ['v27','2026-11-13','統合兵團 v1（四種陣法）'],
  ['v28','2026-11-13','多個統合兵團、隊內穿透、兵團數量顯示切換'],
  ['v29','2026-11-13','修 ESC「兵團數量顯示」選不動'],
  ['v30','2026-11-13','人數集中顯示在主將頭上、存檔槽 3 → 10'],
  ['v31','2026-11-13','掉隊 3 秒歸隊、集結令排除同隊、編隊小視窗'],
  ['v32','2026-11-13','佔光地區不再歸降、敵軍三軍團制、敵軍分兵'],
  ['v33','2026-11-13','敵軍守軍每 30 秒 10% 轉野戰軍'],
  ['v34','2026-11-13','拖曳編隊、敵方人口每 15 秒 2% 轉守軍、敵軍攻擊性上調'],
  ['v35','2026-11-13','三無城池 3 秒可佔、15 秒沒人佔自動補兵'],
  ['v36','2026-11-13','統合兵團攻擊優先、被圍攻中的城不能徵兵'],
  ['v37','2026-11-13','統合兵團編隊改用右鍵，左鍵恢復點選與改名'],
  ['v38','2026-11-13','區塊模式也開放外交、已消亡勢力列表'],
  ['v39','2026-11-14','兵團合併（每國 250 上限）、方向鎖修掉兵團抽搐'],
  ['v40','2026-11-14','出城的守備軍打完仗自己走回城'],
  ['v41','2026-11-15','守備軍可編入統合兵團、人數標籤分守／野、整隊跟緊主帥'],
  ['v42','2026-11-15','軍團不再橫衝直撞、主城圍困 30 秒判定、中英雙語'],
  ['v43','2026-11-15','野戰軍回城變數字、定期定位回收、敵方沒戰爭不派兵'],
  ['v44','2026-11-15','部隊不再互相卡死、集結令環形站位、主城標記多一欄「儲」'],
  ['v45','2026-11-16','英文戰史面板補齊翻譯、兵團不再貼牆抽搐'],
  ['v46','2026-11-16','修掉方向鎖造成的「卡手」、初版手機端（橫屏＋虛擬搖桿＋技能列）'],
  ['v47','2026-11-16','AI 兵團六個卡牆／不動的成因全修，敵國之間也會互相圍城'],
  ['v48','2026-11-16','統合兵團不再被併吞、成員加速追趕、窒息的誤判修正'],
];
const BOUNDS = [[0,4],[4,8],[8,12],[12,16],[16,19],[19,25],[25,33],[33,37],[37,43],[43,47]];
const list = document.getElementById('list');
list.innerHTML = ERAS.map((e,i)=>{
  const [a,b] = BOUNDS[i];
  const rows = V.slice(a,b).map(([ver,date,desc],k)=>{
    const isLast = (a+k) === V.length-1;
    return `<a class="row${isLast?' latest':''}" href="versions/territory-${ver}.html" target="_blank" rel="noopener">
      <span class="v">${ver}${isLast?'<span class="badge">LATEST</span>':''}</span>
      <span class="txt">${desc}</span>
      <span class="date">${date}</span>
    </a>`;
  }).join('');
  return `<section class="era">
    <div class="era-head">
      <span class="era-idx">${e.idx}</span>
      <span class="era-title">${e.title}</span>
      <span class="era-desc">${e.desc}</span>
    </div>${rows}</section>`;
}).join('');
</script>
</body>
</html>
